<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <style><![CDATA[
      .bg          { fill: #FAFAFA; }
      .headline    { font: 800 44px Inter, system-ui, sans-serif; fill: #111827; }
      .wordmark    { font: 800 22px Inter, system-ui, sans-serif; fill: #7C3AED; }
      .panel-mint  { fill: #E6F6EE; stroke: #16A34A; stroke-width: 2; stroke-dasharray: 6 6; }
      .panel-lilac { fill: #EEEAFE; stroke: #7C3AED; stroke-width: 2; stroke-dasharray: 6 6; }
      .panel-peach { fill: #FEEFE0; stroke: #D97706; stroke-width: 2; stroke-dasharray: 6 6; }
      .panel-sky   { fill: #E0F2FE; stroke: #0284C7; stroke-width: 2; stroke-dasharray: 6 6; }
      .pill-text   { font: 800 18px Inter, system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .group-label { font: 800 16px Inter, system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; letter-spacing: 1.4px; }
      .lane-name   { font: 800 17px Inter, system-ui, sans-serif; fill: #1F2937; text-anchor: middle; }
      .lane-sub    { font: 500 12px Inter, system-ui, sans-serif; fill: #6B7280; text-anchor: middle; }
      .body        { font: 500 15px Inter, system-ui, sans-serif; fill: #1F2937; }
      .body-bold   { font: 700 15px Inter, system-ui, sans-serif; fill: #1F2937; }
      .msg-label   { font: 600 14px Inter, system-ui, sans-serif; fill: #1F2937; text-anchor: middle; }
      .msg-time    { font: 600 12px ui-monospace, Menlo, monospace; fill: #16A34A; text-anchor: middle; }
      .annot       { font: 500 13px ui-monospace, Menlo, monospace; fill: #374151; }
      .lifeline    { stroke: #C4B5FD; stroke-width: 1.5; stroke-dasharray: 4 6; }
      .conn        { fill: none; stroke: #374151; stroke-width: 2; stroke-dasharray: 4 6; }
      .conn-solid  { fill: none; stroke: #374151; stroke-width: 2.2; }
      .conn-green  { fill: none; stroke: #16A34A; stroke-width: 2.2; stroke-dasharray: 4 6; }
      .conn-orange { fill: none; stroke: #D97706; stroke-width: 2.2; stroke-dasharray: 4 6; }
      .lane-card   { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 1.5; rx: 12; ry: 12; }
      .chip        { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 1; rx: 8; ry: 8; }
    ]]></style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>

    <symbol id="icon-server" viewBox="0 0 64 64">
      <rect x="6"  y="10" width="52" height="14" rx="3" fill="#A7F3D0" stroke="#047857" stroke-width="1.5"/>
      <rect x="6"  y="26" width="52" height="14" rx="3" fill="#A7F3D0" stroke="#047857" stroke-width="1.5"/>
      <rect x="6"  y="42" width="52" height="14" rx="3" fill="#A7F3D0" stroke="#047857" stroke-width="1.5"/>
      <circle cx="14" cy="17" r="2" fill="#10B981"/><circle cx="22" cy="17" r="2" fill="#FFFFFF" stroke="#047857" stroke-width="1"/>
      <circle cx="14" cy="33" r="2" fill="#10B981"/><circle cx="22" cy="33" r="2" fill="#FFFFFF" stroke="#047857" stroke-width="1"/>
      <circle cx="14" cy="49" r="2" fill="#10B981"/><circle cx="22" cy="49" r="2" fill="#FFFFFF" stroke="#047857" stroke-width="1"/>
    </symbol>
    <symbol id="icon-monitor" viewBox="0 0 80 64">
      <rect x="4" y="4" width="72" height="46" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
      <rect x="4" y="4" width="72" height="10" rx="5" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.5"/>
      <circle cx="11" cy="9" r="1.6" fill="#EF4444"/><circle cx="17" cy="9" r="1.6" fill="#F59E0B"/><circle cx="23" cy="9" r="1.6" fill="#10B981"/>
      <rect x="10" y="20" width="60" height="22" rx="2" fill="#BFDBFE"/>
      <rect x="32" y="50" width="16" height="6" rx="2" fill="#9CA3AF"/>
      <rect x="20" y="56" width="40" height="4" rx="2" fill="#9CA3AF"/>
    </symbol>
    <symbol id="icon-resolver" viewBox="0 0 96 64">
      <rect x="2" y="6" width="60" height="52" rx="10" fill="#BBF7D0" stroke="#047857" stroke-width="1.5"/>
      <text x="32" y="38" font-family="Inter" font-weight="800" font-size="14" fill="#065F46" text-anchor="middle">DNS</text>
    </symbol>
    <symbol id="icon-globe" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="22" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.5"/>
      <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#1D4ED8" stroke-width="1.2"/>
      <ellipse cx="32" cy="32" rx="9"  ry="22" fill="none" stroke="#1D4ED8" stroke-width="1.2"/>
      <path d="M32 10 v44" stroke="#1D4ED8" stroke-width="1.2"/>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 80 48">
      <path d="M20 36 a12 12 0 0 1 4 -23 a16 16 0 0 1 32 2 a10 10 0 0 1 2 19 z" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
    </symbol>
    <symbol id="icon-render" viewBox="0 0 80 64">
      <rect x="6" y="6" width="68" height="44" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
      <rect x="6" y="6" width="68" height="10" rx="5" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.5"/>
      <rect x="14" y="22" width="20" height="20" rx="2" fill="#FCA5A5"/>
      <rect x="40" y="22" width="32" height="6"  rx="2" fill="#9CA3AF"/>
      <rect x="40" y="32" width="26" height="6"  rx="2" fill="#9CA3AF"/>
      <rect x="14" y="46" width="58" height="6"  rx="2" fill="#9CA3AF"/>
    </symbol>
  </defs>

  <rect class="bg" width="1600" height="1200"/>

  <!-- Title bar -->
  <rect x="56" y="48" width="6" height="56" fill="#1FBFA8" rx="3"/>
  <text class="headline" x="84" y="92">google.com — message by message</text>
  <g transform="translate(1352, 60)">
    <rect width="32" height="32" rx="8" fill="#1FBFA8"/>
    <text font-family="Inter" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle" x="16" y="22">B</text>
    <text class="wordmark" x="44" y="22">ByteByteGo</text>
  </g>

  <!-- Lifeline positions: 200, 460, 720, 980, 1240, 1500 -->
  <!-- Lane headers -->
  <g id="lanes">
    <g transform="translate(120, 140)">
      <rect class="lane-card" width="160" height="100"/>
      <use href="#icon-monitor" x="40" y="14" width="80" height="60"/>
      <text class="lane-name" x="80" y="92">Browser</text>
    </g>
    <g transform="translate(380, 140)">
      <rect class="lane-card" width="160" height="100"/>
      <use href="#icon-resolver" x="32" y="20" width="96" height="60"/>
      <text class="lane-name" x="80" y="92">OS / Stub</text>
    </g>
    <g transform="translate(640, 140)">
      <rect class="lane-card" width="160" height="100"/>
      <use href="#icon-cloud" x="40" y="26" width="80" height="48"/>
      <text class="lane-name" x="80" y="92">Recursive DNS</text>
    </g>
    <g transform="translate(900, 140)">
      <rect class="lane-card" width="160" height="100"/>
      <use href="#icon-globe" x="48" y="18" width="64" height="64"/>
      <text class="lane-name" x="80" y="92">Google Edge</text>
    </g>
    <g transform="translate(1160, 140)">
      <rect class="lane-card" width="160" height="100"/>
      <use href="#icon-server" x="50" y="14" width="60" height="74"/>
      <text class="lane-name" x="80" y="92">Origin</text>
    </g>
    <g transform="translate(1420, 140)">
      <rect class="lane-card" width="160" height="100"/>
      <use href="#icon-render" x="40" y="20" width="80" height="60"/>
      <text class="lane-name" x="80" y="92">Render</text>
    </g>
  </g>

  <!-- Lifelines -->
  <g>
    <line class="lifeline" x1="200"  y1="240" x2="200"  y2="1140"/>
    <line class="lifeline" x1="460"  y1="240" x2="460"  y2="1140"/>
    <line class="lifeline" x1="720"  y1="240" x2="720"  y2="1140"/>
    <line class="lifeline" x1="980"  y1="240" x2="980"  y2="1140"/>
    <line class="lifeline" x1="1240" y1="240" x2="1240" y2="1140"/>
    <line class="lifeline" x1="1500" y1="240" x2="1500" y2="1140"/>
  </g>

  <!-- Section bands on the left (pills) -->
  <g>
    <rect x="40" y="290"  width="40" height="120" rx="12" fill="#7C3AED"/>
    <text class="group-label" transform="translate(60, 350) rotate(-90)">DNS</text>

    <rect x="40" y="430"  width="40" height="220" rx="12" fill="#16A34A"/>
    <text class="group-label" transform="translate(60, 540) rotate(-90)">TCP + TLS</text>

    <rect x="40" y="670"  width="40" height="220" rx="12" fill="#0284C7"/>
    <text class="group-label" transform="translate(60, 780) rotate(-90)">HTTP/2</text>

    <rect x="40" y="910"  width="40" height="220" rx="12" fill="#D97706"/>
    <text class="group-label" transform="translate(60, 1020) rotate(-90)">Render</text>
  </g>

  <!-- ====== DNS messages (panel-lilac background block) ====== -->
  <rect class="panel-lilac" x="100" y="280" width="1480" height="140" rx="14"/>

  <path class="conn" d="M 200 320 L 454 320" marker-end="url(#ah)"/>
  <text class="msg-label" x="328" y="312">resolve("google.com")</text>
  <text class="msg-time"  x="328" y="338">0 ms</text>

  <path class="conn" d="M 466 320 L 974 320" marker-end="url(#ah)"/>
  <text class="msg-label" x="720" y="312">recurse: root → .com → google authoritative</text>
  <text class="msg-time"  x="720" y="338">5–25 ms</text>

  <path class="conn-green" d="M 974 380 L 206 380" marker-end="url(#ah)"/>
  <text class="msg-label" x="588" y="372">142.250.181.46 (A record, TTL 300 s)</text>
  <text class="msg-time"  x="588" y="402">30 ms — cached for next time</text>

  <!-- ====== TCP + TLS messages (panel-mint) ====== -->
  <rect class="panel-mint" x="100" y="438" width="1480" height="210" rx="14"/>

  <path class="conn-solid" d="M 200 478 L 974 478" marker-end="url(#ah)"/>
  <text class="msg-label" x="588" y="470">TCP SYN  →  SYN-ACK  →  ACK   (3-way, 1 RTT)</text>
  <text class="msg-time"  x="588" y="494">40 → 65 ms</text>

  <path class="conn-solid" d="M 200 528 L 974 528" marker-end="url(#ah)"/>
  <text class="msg-label" x="588" y="520">TLS 1.3 ClientHello + key share (X25519)</text>
  <text class="msg-time"  x="588" y="544">65 ms</text>

  <path class="conn-green" d="M 974 588 L 206 588" marker-end="url(#ah)"/>
  <text class="msg-label" x="588" y="580">ServerHello + cert + Finished (encrypted)</text>
  <text class="msg-time"  x="588" y="610">95 ms — secure channel ready</text>

  <rect class="chip" x="828" y="620" width="220" height="20" rx="10" fill="#DCFCE7" stroke="#16A34A"/>
  <text class="annot" x="938" y="634" text-anchor="middle" style="fill: #166534; font-weight:700">0-RTT on resume = 0 ms</text>

  <!-- ====== HTTP/2 (panel-sky) ====== -->
  <rect class="panel-sky" x="100" y="678" width="1480" height="210" rx="14"/>

  <path class="conn-solid" d="M 200 718 L 974 718" marker-end="url(#ah)"/>
  <text class="msg-label" x="588" y="710">HTTP/2 GET / (stream 1, HPACK)</text>
  <text class="msg-time"  x="588" y="734">100 ms</text>

  <path class="conn-orange" d="M 984 768 L 1234 768" marker-end="url(#ah)"/>
  <text class="msg-label" x="1110" y="760">fan-out to index shards</text>
  <text class="msg-time"  x="1110" y="784">+10 ms</text>

  <path class="conn-green" d="M 1234 818 L 984 818" marker-end="url(#ah)"/>
  <text class="msg-label" x="1110" y="810">merged search results</text>
  <text class="msg-time"  x="1110" y="836">+80 ms (TTFB)</text>

  <path class="conn-green" d="M 974 860 L 206 860" marker-end="url(#ah)"/>
  <text class="msg-label" x="588" y="852">HTML body streamed in DATA frames (gzip/br)</text>
  <text class="msg-time"  x="588" y="876">220 ms</text>

  <!-- ====== Render (panel-peach) ====== -->
  <rect class="panel-peach" x="100" y="918" width="1480" height="210" rx="14"/>

  <path class="conn-green" d="M 200 958 L 1494 958" marker-end="url(#ah)"/>
  <text class="msg-label" x="848" y="950">HTML parser streams tokens → DOM build (preload scanner)</text>
  <text class="msg-time"  x="848" y="974">230–340 ms</text>

  <path class="conn-green" d="M 200 1018 L 1494 1018" marker-end="url(#ah)"/>
  <text class="msg-label" x="848" y="1010">CSSOM build → render tree → layout → paint → composite (GPU)</text>
  <text class="msg-time"  x="848" y="1034">FCP ~340 ms</text>

  <path class="conn-green" d="M 200 1078 L 1494 1078" marker-end="url(#ah)"/>
  <text class="msg-label" x="848" y="1070">LCP — largest contentful paint (logo + searchbox)</text>
  <text class="msg-time"  x="848" y="1100">450 ms (Web Vitals "good" ≤ 2500 ms)</text>

  <!-- Footer -->
  <text class="annot" x="84" y="1180">Legend: solid = synchronous request • dashed = response or async • orange = out-of-process fan-out • green chip = optimization path.</text>
</svg>

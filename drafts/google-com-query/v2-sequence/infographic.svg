<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style><![CDATA[
      .bg { fill: #FFFFFF; }
      .headline { font: 700 38px Inter, system-ui, sans-serif; fill: #1F2937; }
      .section-label { font: 600 16px Inter, system-ui, sans-serif; fill: #2563EB; letter-spacing: 2px; }
      .lane-title { font: 700 16px Inter, system-ui, sans-serif; fill: #1F2937; text-anchor: middle; }
      .lane-sub { font: 400 12px Inter, system-ui, sans-serif; fill: #6B7280; text-anchor: middle; }
      .msg-label { font: 500 13px Inter, system-ui, sans-serif; fill: #1F2937; }
      .msg-time  { font: 500 11px ui-monospace, Menlo, monospace; fill: #F97316; }
      .lane { fill: #FFFFFF; stroke: #2563EB; stroke-width: 2; }
      .lifeline { stroke: #9CA3AF; stroke-width: 1.5; stroke-dasharray: 4 6; }
      .arr { fill: none; stroke: #1F2937; stroke-width: 2; }
      .arr-resp { stroke: #16A34A; }
      .arr-async { stroke: #F97316; stroke-dasharray: 5 4; }
      .activation { fill: #2563EB; opacity: 0.12; }
      .activation-orange { fill: #F97316; opacity: 0.12; }
      .activation-green { fill: #16A34A; opacity: 0.12; }
      .axis-tick { font: 500 11px ui-monospace, Menlo, monospace; fill: #6B7280; text-anchor: end; }
      .group-label { font: 600 12px Inter, system-ui, sans-serif; fill: #2563EB; letter-spacing: 1px; }
    ]]></style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- Header -->
  <text class="section-label" x="64" y="64">SEQUENCE</text>
  <text class="headline" x="64" y="104">google.com → first paint, message by message</text>

  <!-- Lifelines positions -->
  <!-- Browser=200, OS/Resolver=460, DNS root chain=720, Edge/GFE=980, Origin/Search=1240, Render pipeline=1500 -->
  <g id="lifelines">
    <line class="lifeline" x1="200" y1="200" x2="200" y2="820"/>
    <line class="lifeline" x1="460" y1="200" x2="460" y2="820"/>
    <line class="lifeline" x1="720" y1="200" x2="720" y2="820"/>
    <line class="lifeline" x1="980" y1="200" x2="980" y2="820"/>
    <line class="lifeline" x1="1240" y1="200" x2="1240" y2="820"/>
    <line class="lifeline" x1="1500" y1="200" x2="1500" y2="820"/>
  </g>

  <!-- Lane headers -->
  <g id="lanes">
    <g transform="translate(120, 150)"><rect class="lane" width="160" height="56" rx="8" filter="url(#sh)"/><text class="lane-title" x="80" y="26">Browser</text><text class="lane-sub" x="80" y="44">Chrome / network stack</text></g>
    <g transform="translate(380, 150)"><rect class="lane" width="160" height="56" rx="8" filter="url(#sh)"/><text class="lane-title" x="80" y="26">OS resolver</text><text class="lane-sub" x="80" y="44">stub + cache</text></g>
    <g transform="translate(640, 150)"><rect class="lane" width="160" height="56" rx="8" filter="url(#sh)"/><text class="lane-title" x="80" y="26">Recursive DNS</text><text class="lane-sub" x="80" y="44">root → TLD → auth</text></g>
    <g transform="translate(900, 150)"><rect class="lane" width="160" height="56" rx="8" filter="url(#sh)"/><text class="lane-title" x="80" y="26">Google edge</text><text class="lane-sub" x="80" y="44">GFE / L7 LB</text></g>
    <g transform="translate(1160, 150)"><rect class="lane" width="160" height="56" rx="8" filter="url(#sh)"/><text class="lane-title" x="80" y="26">Origin</text><text class="lane-sub" x="80" y="44">search index shards</text></g>
    <g transform="translate(1420, 150)"><rect class="lane" width="160" height="56" rx="8" filter="url(#sh)"/><text class="lane-title" x="80" y="26">Render</text><text class="lane-sub" x="80" y="44">parse / paint pipeline</text></g>
  </g>

  <!-- Time axis labels on the left -->
  <g id="time-axis">
    <text class="group-label" x="56" y="240">DNS</text>
    <text class="axis-tick" x="56" y="260">0 ms</text>
    <text class="axis-tick" x="56" y="320">30 ms</text>

    <text class="group-label" x="56" y="380">TCP + TLS</text>
    <text class="axis-tick" x="56" y="400">40 ms</text>
    <text class="axis-tick" x="56" y="460">90 ms</text>

    <text class="group-label" x="56" y="510">HTTP</text>
    <text class="axis-tick" x="56" y="530">100 ms</text>
    <text class="axis-tick" x="56" y="610">220 ms</text>

    <text class="group-label" x="56" y="660">Render</text>
    <text class="axis-tick" x="56" y="680">230 ms</text>
    <text class="axis-tick" x="56" y="780">450 ms</text>
  </g>

  <!-- Activations (subtle highlight bars) -->
  <rect class="activation" x="455" y="240" width="10" height="80"/>
  <rect class="activation" x="715" y="250" width="10" height="60"/>
  <rect class="activation-orange" x="195" y="390" width="10" height="70"/>
  <rect class="activation-orange" x="975" y="390" width="10" height="70"/>
  <rect class="activation-green" x="1235" y="540" width="10" height="60"/>
  <rect class="activation-green" x="1495" y="690" width="10" height="90"/>

  <!-- DNS messages -->
  <g id="dns">
    <path class="arr" d="M 200 250 L 455 250" marker-end="url(#ah)"/>
    <text class="msg-label" x="328" y="244" text-anchor="middle">resolve("google.com")</text>
    <text class="msg-time"  x="328" y="262" text-anchor="middle">0 ms</text>

    <path class="arr arr-async" d="M 465 270 L 715 270" marker-end="url(#ah)"/>
    <text class="msg-label" x="590" y="264" text-anchor="middle">recurse via root/TLD/auth</text>
    <text class="msg-time"  x="590" y="282" text-anchor="middle">+5 ms</text>

    <path class="arr arr-resp" d="M 715 310 L 465 310" marker-end="url(#ah)"/>
    <text class="msg-label" x="590" y="304" text-anchor="middle">142.250.x.y (A record, TTL 300)</text>
    <text class="msg-time"  x="590" y="328" text-anchor="middle">+25 ms</text>

    <path class="arr arr-resp" d="M 455 330 L 205 330" marker-end="url(#ah)"/>
    <text class="msg-label" x="330" y="324" text-anchor="middle">IP returned + cached</text>
    <text class="msg-time"  x="330" y="346" text-anchor="middle">30 ms</text>
  </g>

  <!-- TCP + TLS -->
  <g id="tcp-tls">
    <path class="arr" d="M 200 400 L 975 400" marker-end="url(#ah)"/>
    <text class="msg-label" x="588" y="394" text-anchor="middle">TCP SYN → SYN-ACK → ACK  (1 RTT)</text>
    <text class="msg-time"  x="588" y="412" text-anchor="middle">40 → 60 ms</text>

    <path class="arr" d="M 200 440 L 975 440" marker-end="url(#ah)"/>
    <text class="msg-label" x="588" y="434" text-anchor="middle">TLS 1.3 ClientHello + key share</text>
    <text class="msg-time"  x="588" y="452" text-anchor="middle">60 ms</text>

    <path class="arr arr-resp" d="M 975 460 L 205 460" marker-end="url(#ah)"/>
    <text class="msg-label" x="590" y="476" text-anchor="middle">ServerHello + cert + Finished (encrypted)</text>
    <text class="msg-time"  x="590" y="494" text-anchor="middle">90 ms — secure channel ready</text>
  </g>

  <!-- HTTP -->
  <g id="http">
    <path class="arr" d="M 200 540 L 975 540" marker-end="url(#ah)"/>
    <text class="msg-label" x="588" y="534" text-anchor="middle">HTTP/2 GET / (HPACK headers, stream 1)</text>
    <text class="msg-time"  x="588" y="552" text-anchor="middle">100 ms</text>

    <path class="arr arr-async" d="M 985 560 L 1235 560" marker-end="url(#ah)"/>
    <text class="msg-label" x="1110" y="554" text-anchor="middle">fan-out to index shards</text>
    <text class="msg-time"  x="1110" y="572" text-anchor="middle">+10 ms</text>

    <path class="arr arr-resp" d="M 1235 600 L 985 600" marker-end="url(#ah)"/>
    <text class="msg-label" x="1110" y="594" text-anchor="middle">merged search results</text>
    <text class="msg-time"  x="1110" y="618" text-anchor="middle">+80 ms (TTFB)</text>

    <path class="arr arr-resp" d="M 975 620 L 205 620" marker-end="url(#ah)"/>
    <text class="msg-label" x="588" y="614" text-anchor="middle">HTML body streamed in DATA frames</text>
    <text class="msg-time"  x="588" y="638" text-anchor="middle">220 ms</text>
  </g>

  <!-- Render -->
  <g id="render">
    <path class="arr arr-resp" d="M 200 680 L 1495 680" marker-end="url(#ah)"/>
    <text class="msg-label" x="848" y="674" text-anchor="middle">parser yields tokens → DOM/CSSOM build</text>
    <text class="msg-time"  x="848" y="692" text-anchor="middle">230–340 ms</text>

    <path class="arr arr-resp" d="M 200 740 L 1495 740" marker-end="url(#ah)"/>
    <text class="msg-label" x="848" y="734" text-anchor="middle">layout → paint → composite (GPU)</text>
    <text class="msg-time"  x="848" y="752" text-anchor="middle">FCP ~340 ms</text>

    <path class="arr arr-resp" d="M 200 780 L 1495 780" marker-end="url(#ah)"/>
    <text class="msg-label" x="848" y="774" text-anchor="middle">LCP: hero image / largest text painted</text>
    <text class="msg-time"  x="848" y="798" text-anchor="middle">450 ms (Web Vitals "good" ≤ 2500 ms)</text>
  </g>

  <text class="msg-label" x="64" y="868" style="fill:#6B7280">Solid black = request • Green = response • Orange dashed = async / out of process</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style><![CDATA[
      .bg { fill: #FFFFFF; }
      .headline { font: 700 38px Inter, system-ui, sans-serif; fill: #1F2937; }
      .section-label { font: 600 16px Inter, system-ui, sans-serif; fill: #2563EB; letter-spacing: 2px; }
      .layer-num { font: 700 14px Inter, system-ui, sans-serif; fill: #6B7280; letter-spacing: 2px; }
      .layer-name { font: 700 22px Inter, system-ui, sans-serif; fill: #1F2937; }
      .layer-sub { font: 400 13px Inter, system-ui, sans-serif; fill: #6B7280; }
      .proto-pill { font: 600 13px ui-monospace, Menlo, monospace; fill: #FFFFFF; text-anchor: middle; }
      .pkt-label { font: 600 12px Inter, system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .header-h { font: 600 11px ui-monospace, Menlo, monospace; fill: #1F2937; text-anchor: middle; }
      .col-title { font: 700 16px Inter, system-ui, sans-serif; fill: #1F2937; text-anchor: middle; }
      .caption { font: 400 13px Inter, system-ui, sans-serif; fill: #6B7280; }
      .num { font: 500 12px ui-monospace, Menlo, monospace; fill: #F97316; }
      .layer-box { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 1.5; }
    ]]></style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- Header -->
  <text class="section-label" x="64" y="64">PROTOCOL STACK</text>
  <text class="headline" x="64" y="104">google.com — what the packet actually carries</text>
  <text class="caption" x="64" y="132">Each layer wraps the layer above. By the time the request hits the wire, the URL is buried under TLS, TCP, IP and Ethernet headers.</text>

  <!-- Column titles -->
  <text class="col-title" x="240" y="180">Layer</text>
  <text class="col-title" x="700" y="180">Protocol &amp; what it adds</text>
  <text class="col-title" x="1280" y="180">Packet on the wire</text>

  <!-- 5 layers, ~120 px tall each -->
  <!-- Application -->
  <g transform="translate(80, 200)">
    <rect class="layer-box" width="1440" height="118" rx="10" filter="url(#sh)"/>
    <text class="layer-num" x="24" y="32">L7</text>
    <text class="layer-name" x="24" y="62">Application</text>
    <text class="layer-sub" x="24" y="86">Browser issues a request</text>
    <text class="layer-sub" x="24" y="104">in human-readable HTTP.</text>

    <g transform="translate(440, 24)">
      <rect width="220" height="34" rx="17" fill="#2563EB"/>
      <text class="proto-pill" x="110" y="22">HTTP/2 + HPACK</text>
      <text class="layer-sub" x="0" y="60">GET / HTTP/2  •  :authority google.com  •  cookies, accept-encoding</text>
      <text class="num" x="0" y="82">Header size after HPACK: typically 60–200 B</text>
    </g>

    <!-- packet -->
    <g transform="translate(1100, 28)">
      <rect width="320" height="60" rx="6" fill="#2563EB"/>
      <text class="pkt-label" x="160" y="36">HTTP payload</text>
    </g>
  </g>

  <!-- Presentation = TLS -->
  <g transform="translate(80, 326)">
    <rect class="layer-box" width="1440" height="118" rx="10" filter="url(#sh)"/>
    <text class="layer-num" x="24" y="32">L6 / L5</text>
    <text class="layer-name" x="24" y="62">Session &amp; TLS</text>
    <text class="layer-sub" x="24" y="86">Encrypts the application</text>
    <text class="layer-sub" x="24" y="104">payload + authenticates server.</text>

    <g transform="translate(440, 24)">
      <rect width="220" height="34" rx="17" fill="#F97316"/>
      <text class="proto-pill" x="110" y="22">TLS 1.3</text>
      <text class="layer-sub" x="0" y="60">AES-GCM record, 5-byte header, AEAD tag, key from ECDHE handshake</text>
      <text class="num" x="0" y="82">1 RTT handshake (0-RTT on resume)</text>
    </g>

    <g transform="translate(1060, 28)">
      <rect width="60" height="60" rx="6" fill="#F97316"/>
      <text class="header-h" x="30" y="36" fill="#FFFFFF">TLS</text>
      <rect x="64" y="0" width="296" height="60" rx="6" fill="#2563EB"/>
      <text class="pkt-label" x="212" y="36">encrypted HTTP</text>
    </g>
  </g>

  <!-- Transport TCP -->
  <g transform="translate(80, 452)">
    <rect class="layer-box" width="1440" height="118" rx="10" filter="url(#sh)"/>
    <text class="layer-num" x="24" y="32">L4</text>
    <text class="layer-name" x="24" y="62">Transport</text>
    <text class="layer-sub" x="24" y="86">Ordered, reliable byte stream;</text>
    <text class="layer-sub" x="24" y="104">congestion + flow control.</text>

    <g transform="translate(440, 24)">
      <rect width="220" height="34" rx="17" fill="#16A34A"/>
      <text class="proto-pill" x="110" y="22">TCP (or QUIC/UDP)</text>
      <text class="layer-sub" x="0" y="60">Src/dst port, seq, ack, window, flags (SYN/ACK/PSH/FIN)</text>
      <text class="num" x="0" y="82">20-byte header (40 with options)  •  MSS ≈ 1460 B</text>
    </g>

    <g transform="translate(1020, 28)">
      <rect width="60" height="60" rx="6" fill="#16A34A"/>
      <text class="header-h" x="30" y="36" fill="#FFFFFF">TCP</text>
      <rect x="64" y="0" width="40" height="60" rx="6" fill="#F97316"/>
      <text class="header-h" x="84" y="36" fill="#FFFFFF">TLS</text>
      <rect x="108" y="0" width="292" height="60" rx="6" fill="#2563EB"/>
      <text class="pkt-label" x="254" y="36">payload</text>
    </g>
  </g>

  <!-- Network IP -->
  <g transform="translate(80, 578)">
    <rect class="layer-box" width="1440" height="118" rx="10" filter="url(#sh)"/>
    <text class="layer-num" x="24" y="32">L3</text>
    <text class="layer-name" x="24" y="62">Network</text>
    <text class="layer-sub" x="24" y="86">Best-effort packet routing</text>
    <text class="layer-sub" x="24" y="104">across autonomous systems.</text>

    <g transform="translate(440, 24)">
      <rect width="220" height="34" rx="17" fill="#DC2626"/>
      <text class="proto-pill" x="110" y="22">IPv4 / IPv6</text>
      <text class="layer-sub" x="0" y="60">Src/dst IP, TTL, protocol number, fragmentation flags</text>
      <text class="num" x="0" y="82">20-byte header (IPv4)  •  hop count typically 12–20</text>
    </g>

    <g transform="translate(980, 28)">
      <rect width="60" height="60" rx="6" fill="#DC2626"/>
      <text class="header-h" x="30" y="36" fill="#FFFFFF">IP</text>
      <rect x="64" y="0" width="60" height="60" rx="6" fill="#16A34A"/>
      <text class="header-h" x="94" y="36" fill="#FFFFFF">TCP</text>
      <rect x="128" y="0" width="40" height="60" rx="6" fill="#F97316"/>
      <text class="header-h" x="148" y="36" fill="#FFFFFF">TLS</text>
      <rect x="172" y="0" width="268" height="60" rx="6" fill="#2563EB"/>
      <text class="pkt-label" x="306" y="36">payload</text>
    </g>
  </g>

  <!-- Link -->
  <g transform="translate(80, 704)">
    <rect class="layer-box" width="1440" height="118" rx="10" filter="url(#sh)"/>
    <text class="layer-num" x="24" y="32">L2 / L1</text>
    <text class="layer-name" x="24" y="62">Link &amp; Physical</text>
    <text class="layer-sub" x="24" y="86">Frame across one hop;</text>
    <text class="layer-sub" x="24" y="104">electrical / optical signal.</text>

    <g transform="translate(440, 24)">
      <rect width="220" height="34" rx="17" fill="#6B7280"/>
      <text class="proto-pill" x="110" y="22">Ethernet / Wi-Fi</text>
      <text class="layer-sub" x="0" y="60">Src/dst MAC, ethertype, CRC; per-hop framing</text>
      <text class="num" x="0" y="82">MTU 1500 B  •  18 B header  •  bits at 10⁹–10¹⁰ Hz</text>
    </g>

    <g transform="translate(940, 28)">
      <rect width="60" height="60" rx="6" fill="#6B7280"/>
      <text class="header-h" x="30" y="36" fill="#FFFFFF">ETH</text>
      <rect x="64" y="0" width="60" height="60" rx="6" fill="#DC2626"/>
      <text class="header-h" x="94" y="36" fill="#FFFFFF">IP</text>
      <rect x="128" y="0" width="60" height="60" rx="6" fill="#16A34A"/>
      <text class="header-h" x="158" y="36" fill="#FFFFFF">TCP</text>
      <rect x="192" y="0" width="40" height="60" rx="6" fill="#F97316"/>
      <text class="header-h" x="212" y="36" fill="#FFFFFF">TLS</text>
      <rect x="236" y="0" width="244" height="60" rx="6" fill="#2563EB"/>
      <text class="pkt-label" x="358" y="36">payload</text>
    </g>
  </g>

  <!-- Encapsulation arrow -->
  <path d="M 60 250 L 60 760" stroke="#1F2937" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text class="caption" transform="translate(40, 540) rotate(-90)" text-anchor="middle">encapsulation</text>

  <text class="caption" x="64" y="868">Sources: TCP/IP Illustrated Vol 1, RFC 793, RFC 8446, RFC 9114, "Computer Networks: A Top-Down Approach".</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style><![CDATA[
      .bg { fill: #FFFFFF; }
      .headline { font: 700 38px Inter, system-ui, sans-serif; fill: #1F2937; }
      .section-label { font: 600 16px Inter, system-ui, sans-serif; fill: #2563EB; letter-spacing: 2px; }
      .axis-label { font: 500 12px ui-monospace, Menlo, monospace; fill: #6B7280; text-anchor: middle; }
      .axis-major { font: 600 13px ui-monospace, Menlo, monospace; fill: #1F2937; text-anchor: middle; }
      .row-label { font: 600 16px Inter, system-ui, sans-serif; fill: #1F2937; }
      .row-sub   { font: 400 12px Inter, system-ui, sans-serif; fill: #6B7280; }
      .seg-label { font: 600 13px Inter, system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .vital-name { font: 700 14px Inter, system-ui, sans-serif; fill: #1F2937; text-anchor: middle; }
      .vital-target { font: 500 11px ui-monospace, Menlo, monospace; fill: #6B7280; text-anchor: middle; }
      .vital-actual { font: 700 14px Inter, system-ui, sans-serif; fill: #16A34A; text-anchor: middle; }
      .note { font: 400 13px Inter, system-ui, sans-serif; fill: #6B7280; }
      .num { font: 600 12px ui-monospace, Menlo, monospace; fill: #F97316; text-anchor: middle; }
      .tick { stroke: #E5E7EB; stroke-width: 1; }
      .tick-major { stroke: #9CA3AF; stroke-width: 1; }
      .axis { stroke: #1F2937; stroke-width: 2; }
    ]]></style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- Header -->
  <text class="section-label" x="64" y="64">LATENCY BUDGET</text>
  <text class="headline" x="64" y="104">google.com on the wall clock</text>
  <text class="note" x="64" y="132">Two timelines: cold load (no caches) vs warm load (DNS, TCP, TLS session resumed). Targets follow Core Web Vitals.</text>

  <!-- Time axis -->
  <!-- x range: 240 → 1520 = 1280 px = 800 ms total -->
  <g id="axis">
    <line class="axis" x1="240" y1="780" x2="1520" y2="780"/>
    <!-- Major ticks every 100ms -->
    <g>
      <line class="tick-major" x1="240"  y1="780" x2="240"  y2="790"/><text class="axis-major" x="240"  y="810">0</text>
      <line class="tick-major" x1="400"  y1="780" x2="400"  y2="790"/><text class="axis-major" x="400"  y="810">100 ms</text>
      <line class="tick-major" x1="560"  y1="780" x2="560"  y2="790"/><text class="axis-major" x="560"  y="810">200</text>
      <line class="tick-major" x1="720"  y1="780" x2="720"  y2="790"/><text class="axis-major" x="720"  y="810">300</text>
      <line class="tick-major" x1="880"  y1="780" x2="880"  y2="790"/><text class="axis-major" x="880"  y="810">400</text>
      <line class="tick-major" x1="1040" y1="780" x2="1040" y2="790"/><text class="axis-major" x="1040" y="810">500</text>
      <line class="tick-major" x1="1200" y1="780" x2="1200" y2="790"/><text class="axis-major" x="1200" y="810">600</text>
      <line class="tick-major" x1="1360" y1="780" x2="1360" y2="790"/><text class="axis-major" x="1360" y="810">700</text>
      <line class="tick-major" x1="1520" y1="780" x2="1520" y2="790"/><text class="axis-major" x="1520" y="810">800 ms</text>
    </g>
    <!-- Minor gridlines through chart area -->
    <g opacity="0.6">
      <line class="tick" x1="400"  y1="200" x2="400"  y2="780"/>
      <line class="tick" x1="560"  y1="200" x2="560"  y2="780"/>
      <line class="tick" x1="720"  y1="200" x2="720"  y2="780"/>
      <line class="tick" x1="880"  y1="200" x2="880"  y2="780"/>
      <line class="tick" x1="1040" y1="200" x2="1040" y2="780"/>
      <line class="tick" x1="1200" y1="200" x2="1200" y2="780"/>
      <line class="tick" x1="1360" y1="200" x2="1360" y2="780"/>
    </g>
  </g>

  <!-- COLD LOAD row -->
  <!-- y=240, bar height 60. Segments measured from 240..1520 -->
  <!-- 0–30 DNS / 30–90 TCP+TLS / 90–220 TTFB / 220–340 download+parse / 340–450 paint -->
  <g id="cold">
    <text class="row-label" x="64" y="260">Cold load</text>
    <text class="row-sub"   x="64" y="280">no caches, fresh TCP+TLS</text>
    <g filter="url(#sh)">
      <!-- DNS 0–30 -->
      <rect x="240" y="240" width="48" height="60" fill="#2563EB" rx="4"/>
      <text class="seg-label" x="264" y="276">DNS</text>
      <text class="num" x="264" y="328">30 ms</text>
      <!-- TCP+TLS 30–90 -->
      <rect x="288" y="240" width="96" height="60" fill="#F97316" rx="4"/>
      <text class="seg-label" x="336" y="276">TCP + TLS</text>
      <text class="num" x="336" y="328">60 ms</text>
      <!-- TTFB 90–220 -->
      <rect x="384" y="240" width="208" height="60" fill="#16A34A" rx="4"/>
      <text class="seg-label" x="488" y="276">Request → TTFB</text>
      <text class="num" x="488" y="328">130 ms (origin)</text>
      <!-- Download+parse 220–340 -->
      <rect x="592" y="240" width="192" height="60" fill="#2563EB" rx="4" opacity="0.7"/>
      <text class="seg-label" x="688" y="276">HTML stream + parse</text>
      <text class="num" x="688" y="328">120 ms</text>
      <!-- Paint 340–450 -->
      <rect x="784" y="240" width="176" height="60" fill="#F97316" rx="4" opacity="0.7"/>
      <text class="seg-label" x="872" y="276">Layout / paint</text>
      <text class="num" x="872" y="328">110 ms</text>
    </g>
    <!-- FCP marker -->
    <line x1="960" y1="220" x2="960" y2="320" stroke="#1F2937" stroke-width="2" stroke-dasharray="4 3"/>
    <text class="vital-name" x="960" y="212">FCP 450 ms</text>
    <!-- LCP marker further -->
    <line x1="1200" y1="220" x2="1200" y2="320" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text class="vital-name" x="1200" y="212" style="fill:#DC2626">LCP 600 ms</text>
  </g>

  <!-- WARM LOAD row -->
  <g id="warm" transform="translate(0, 200)">
    <text class="row-label" x="64" y="260">Warm load</text>
    <text class="row-sub"   x="64" y="280">DNS cached, TLS resumed (0-RTT)</text>
    <g filter="url(#sh)">
      <!-- DNS cached: ~0ms — show tiny -->
      <rect x="240" y="240" width="8" height="60" fill="#2563EB" rx="3"/>
      <text class="num" x="244" y="328">~0</text>
      <!-- TCP from connection pool, TLS 0-RTT: 0–25 -->
      <rect x="248" y="240" width="40" height="60" fill="#F97316" rx="3"/>
      <text class="seg-label" x="268" y="276">0-RTT</text>
      <text class="num" x="268" y="328">25 ms</text>
      <!-- TTFB 25–120 (~95ms) -->
      <rect x="288" y="240" width="152" height="60" fill="#16A34A" rx="4"/>
      <text class="seg-label" x="364" y="276">TTFB</text>
      <text class="num" x="364" y="328">95 ms</text>
      <!-- HTML+parse 120–200 -->
      <rect x="440" y="240" width="128" height="60" fill="#2563EB" rx="4" opacity="0.7"/>
      <text class="seg-label" x="504" y="276">HTML + parse</text>
      <text class="num" x="504" y="328">80 ms</text>
      <!-- Paint 200–260 -->
      <rect x="568" y="240" width="96" height="60" fill="#F97316" rx="4" opacity="0.7"/>
      <text class="seg-label" x="616" y="276">Paint</text>
      <text class="num" x="616" y="328">60 ms</text>
    </g>
    <line x1="664" y1="220" x2="664" y2="320" stroke="#1F2937" stroke-width="2" stroke-dasharray="4 3"/>
    <text class="vital-name" x="664" y="212">FCP 260 ms</text>
    <line x1="880" y1="220" x2="880" y2="320" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text class="vital-name" x="880" y="212" style="fill:#DC2626">LCP 400 ms</text>
  </g>

  <!-- Vitals targets panel bottom -->
  <g transform="translate(64, 600)">
    <rect width="1472" height="120" rx="12" fill="#F7F8FA" stroke="#E5E7EB"/>
    <text class="row-label" x="20" y="32">Core Web Vitals — what the browser actually measures</text>

    <g transform="translate(40, 56)">
      <text class="vital-name" x="80" y="20" text-anchor="start">LCP — Largest Contentful Paint</text>
      <text class="vital-target" x="80" y="40" text-anchor="start">Good ≤ 2.5 s  •  Poor &gt; 4.0 s</text>
    </g>
    <g transform="translate(480, 56)">
      <text class="vital-name" x="80" y="20" text-anchor="start">INP — Interaction to Next Paint</text>
      <text class="vital-target" x="80" y="40" text-anchor="start">Good ≤ 200 ms  •  Poor &gt; 500 ms</text>
    </g>
    <g transform="translate(920, 56)">
      <text class="vital-name" x="80" y="20" text-anchor="start">CLS — Cumulative Layout Shift</text>
      <text class="vital-target" x="80" y="40" text-anchor="start">Good ≤ 0.1  •  Poor &gt; 0.25 (unitless)</text>
    </g>

    <text class="row-sub" x="20" y="106">Source: web.dev/articles/vitals (Google, 2024). Field data via CrUX; lab data via Lighthouse.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(64, 740)">
    <rect x="0" y="0" width="14" height="14" fill="#2563EB"/><text class="row-sub" x="22" y="12">Network setup / parse</text>
    <rect x="180" y="0" width="14" height="14" fill="#F97316"/><text class="row-sub" x="202" y="12">Crypto / render</text>
    <rect x="360" y="0" width="14" height="14" fill="#16A34A"/><text class="row-sub" x="382" y="12">Server time (TTFB)</text>
  </g>

  <text class="note" x="64" y="876">Numbers: typical desktop, fast 4G or wired. Mobile + congested networks shift everything 2–5× right.</text>
</svg>

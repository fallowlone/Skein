<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style><![CDATA[
      .bg { fill: #FFFFFF; }
      .headline { font: 700 44px Inter, system-ui, sans-serif; fill: #1F2937; }
      .section-label { font: 600 18px Inter, system-ui, sans-serif; fill: #2563EB; letter-spacing: 2px; }
      .label { font: 600 17px Inter, system-ui, sans-serif; fill: #1F2937; }
      .caption { font: 400 13px Inter, system-ui, sans-serif; fill: #6B7280; }
      .num-text { font: 500 12px ui-monospace, Menlo, monospace; fill: #F97316; }
      .step-num { font: 700 18px Inter, system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .box { fill: #FFFFFF; stroke: #2563EB; stroke-width: 2; }
      .box-orange { fill: #FFFFFF; stroke: #F97316; stroke-width: 2; }
      .box-green { fill: #FFFFFF; stroke: #16A34A; stroke-width: 2; }
      .arrow { fill: none; stroke: #1F2937; stroke-width: 2.5; }
      .arrow-curve { fill: none; stroke: #1F2937; stroke-width: 2.5; stroke-dasharray: 0; }
      .icon { fill: none; stroke: #2563EB; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-orange { stroke: #F97316; }
      .icon-green { stroke: #16A34A; }
    ]]></style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- Header -->
  <text class="section-label" x="64" y="80">REQUEST LIFECYCLE</text>
  <text class="headline" x="64" y="128">What happens when you type google.com</text>
  <text class="caption" x="64" y="156">Browser → DNS → TCP/TLS → HTTP → Render. Typical end-to-end: ~300–500 ms cold, &lt;50 ms warm.</text>

  <!-- Row 1: steps 1-4 -->
  <g transform="translate(64, 220)">
    <!-- Step 1: URL parse -->
    <g>
      <rect class="box" x="0" y="0" width="340" height="190" rx="12" filter="url(#sh)"/>
      <circle cx="0" cy="0" r="22" fill="#2563EB"/>
      <text class="step-num" x="0" y="0">1</text>
      <g class="icon" transform="translate(24, 28)">
        <rect x="0" y="0" width="40" height="28" rx="4"/>
        <line x1="0" y1="10" x2="40" y2="10"/>
        <circle cx="6" cy="5" r="1.5" fill="#2563EB" stroke="none"/>
        <circle cx="12" cy="5" r="1.5" fill="#2563EB" stroke="none"/>
      </g>
      <text class="label" x="24" y="92">URL parse + HSTS</text>
      <text class="caption" x="24" y="116">Browser detects URL vs search query;</text>
      <text class="caption" x="24" y="134">HSTS preload upgrades scheme to https.</text>
      <text class="num-text" x="24" y="166">~0 ms (in-process)</text>
    </g>

    <!-- Arrow -->
    <path class="arrow" d="M 340 95 L 388 95" marker-end="url(#ah)"/>

    <!-- Step 2: DNS -->
    <g transform="translate(388, 0)">
      <rect class="box" x="0" y="0" width="340" height="190" rx="12" filter="url(#sh)"/>
      <circle cx="0" cy="0" r="22" fill="#2563EB"/>
      <text class="step-num" x="0" y="0">2</text>
      <g class="icon" transform="translate(24, 28)">
        <circle cx="20" cy="14" r="14"/>
        <ellipse cx="20" cy="14" rx="6" ry="14"/>
        <line x1="6" y1="14" x2="34" y2="14"/>
      </g>
      <text class="label" x="24" y="92">DNS resolution</text>
      <text class="caption" x="24" y="116">OS cache → resolver →</text>
      <text class="caption" x="24" y="134">root → TLD → authoritative.</text>
      <text class="num-text" x="24" y="166">10–150 ms (0 if cached)</text>
    </g>

    <path class="arrow" d="M 728 95 L 776 95" marker-end="url(#ah)"/>

    <!-- Step 3: TCP -->
    <g transform="translate(776, 0)">
      <rect class="box-orange" x="0" y="0" width="340" height="190" rx="12" filter="url(#sh)"/>
      <circle cx="0" cy="0" r="22" fill="#F97316"/>
      <text class="step-num" x="0" y="0">3</text>
      <g class="icon icon-orange" transform="translate(24, 28)">
        <path d="M 0 14 L 12 6 L 24 14 L 36 6"/>
        <path d="M 0 22 L 12 14 L 24 22 L 36 14"/>
      </g>
      <text class="label" x="24" y="92">TCP handshake</text>
      <text class="caption" x="24" y="116">SYN → SYN-ACK → ACK.</text>
      <text class="caption" x="24" y="134">1 RTT before any data.</text>
      <text class="num-text" x="24" y="166">~1 RTT, 10–50 ms</text>
    </g>

    <path class="arrow" d="M 1116 95 L 1164 95" marker-end="url(#ah)"/>

    <!-- Step 4: TLS -->
    <g transform="translate(1164, 0)">
      <rect class="box-orange" x="0" y="0" width="340" height="190" rx="12" filter="url(#sh)"/>
      <circle cx="0" cy="0" r="22" fill="#F97316"/>
      <text class="step-num" x="0" y="0">4</text>
      <g class="icon icon-orange" transform="translate(24, 28)">
        <rect x="6" y="12" width="28" height="20" rx="2"/>
        <path d="M 12 12 L 12 6 a 8 8 0 0 1 16 0 L 28 12"/>
      </g>
      <text class="label" x="24" y="92">TLS 1.3 handshake</text>
      <text class="caption" x="24" y="116">ClientHello + key share →</text>
      <text class="caption" x="24" y="134">Server cert + Finished.</text>
      <text class="num-text" x="24" y="166">1 RTT (0-RTT on resume)</text>
    </g>
  </g>

  <!-- Connector down + back -->
  <path class="arrow-curve" d="M 1404 410 C 1404 460, 1404 460, 64 460 C 64 460, 64 480, 64 500" marker-end="url(#ah)"/>

  <!-- Row 2: steps 5-7 -->
  <g transform="translate(64, 520)">
    <!-- Step 5: HTTP req -->
    <g>
      <rect class="box-orange" x="0" y="0" width="340" height="190" rx="12" filter="url(#sh)"/>
      <circle cx="0" cy="0" r="22" fill="#F97316"/>
      <text class="step-num" x="0" y="0">5</text>
      <g class="icon icon-orange" transform="translate(24, 28)">
        <path d="M 0 8 L 36 8"/>
        <path d="M 0 16 L 30 16"/>
        <path d="M 0 24 L 24 24"/>
      </g>
      <text class="label" x="24" y="92">HTTP/2 (or /3) request</text>
      <text class="caption" x="24" y="116">GET / HTTP/2, HPACK headers,</text>
      <text class="caption" x="24" y="134">stream multiplexing.</text>
      <text class="num-text" x="24" y="166">1 RTT to first byte</text>
    </g>

    <path class="arrow" d="M 340 95 L 388 95" marker-end="url(#ah)"/>

    <!-- Step 6: server -->
    <g transform="translate(388, 0)">
      <rect class="box-green" x="0" y="0" width="340" height="190" rx="12" filter="url(#sh)"/>
      <circle cx="0" cy="0" r="22" fill="#16A34A"/>
      <text class="step-num" x="0" y="0">6</text>
      <g class="icon icon-green" transform="translate(24, 28)">
        <rect x="2" y="4" width="36" height="8" rx="1"/>
        <rect x="2" y="14" width="36" height="8" rx="1"/>
        <rect x="2" y="24" width="36" height="6" rx="1"/>
        <circle cx="34" cy="8" r="1.5" fill="#16A34A" stroke="none"/>
        <circle cx="34" cy="18" r="1.5" fill="#16A34A" stroke="none"/>
      </g>
      <text class="label" x="24" y="92">Edge LB → origin</text>
      <text class="caption" x="24" y="116">GFE → service mesh →</text>
      <text class="caption" x="24" y="134">index shards → response.</text>
      <text class="num-text" x="24" y="166">TTFB 50–200 ms</text>
    </g>

    <path class="arrow" d="M 728 95 L 776 95" marker-end="url(#ah)"/>

    <!-- Step 7: render -->
    <g transform="translate(776, 0)">
      <rect class="box" x="0" y="0" width="340" height="190" rx="12" filter="url(#sh)"/>
      <circle cx="0" cy="0" r="22" fill="#2563EB"/>
      <text class="step-num" x="0" y="0">7</text>
      <g class="icon" transform="translate(24, 28)">
        <rect x="0" y="0" width="40" height="28" rx="2"/>
        <line x1="0" y1="8" x2="40" y2="8"/>
        <rect x="4" y="14" width="14" height="10"/>
        <line x1="22" y1="16" x2="36" y2="16"/>
        <line x1="22" y1="20" x2="36" y2="20"/>
      </g>
      <text class="label" x="24" y="92">Parse + render</text>
      <text class="caption" x="24" y="116">HTML→DOM, CSS→CSSOM,</text>
      <text class="caption" x="24" y="134">layout, paint, composite.</text>
      <text class="num-text" x="24" y="166">FCP ~100–400 ms</text>
    </g>

    <!-- Final state -->
    <g transform="translate(1164, 0)">
      <rect class="box-green" x="0" y="0" width="340" height="190" rx="12" filter="url(#sh)"/>
      <g class="icon icon-green" transform="translate(150, 30)">
        <circle cx="20" cy="20" r="18"/>
        <path d="M 12 20 L 18 26 L 28 14"/>
      </g>
      <text class="label" x="170" y="100" text-anchor="middle">Pixels on screen</text>
      <text class="caption" x="170" y="124" text-anchor="middle">LCP ≤ 2.5 s = "good"</text>
      <text class="caption" x="170" y="142" text-anchor="middle">INP ≤ 200 ms = "good"</text>
      <text class="num-text" x="170" y="170" text-anchor="middle">Core Web Vitals targets</text>
    </g>

    <path class="arrow" d="M 1116 95 L 1164 95" marker-end="url(#ah)"/>
  </g>

  <!-- Footer -->
  <text class="caption" x="64" y="860">Sources: HPBN (High Performance Browser Networking), RFC 8446 (TLS 1.3), Chrome DevTools "Performance" panel.</text>
</svg>

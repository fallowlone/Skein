<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <!--
    ByteByteGo skeleton (light-pastel mode).
    Uses panel + pill-title + numbered green steps + stylized icons + dashed connectors.
    Replace content; keep <defs> ids stable (the rest of the toolchain depends on them).
  -->
  <defs>
    <style><![CDATA[
      /* canvas */
      .bg          { fill: #FFFFFF; }
      .headline    { font: 800 48px Inter, system-ui, sans-serif; fill: #111827; }
      .wordmark    { font: 800 22px Inter, system-ui, sans-serif; fill: #7C3AED; }

      /* panel */
      .panel-lilac { fill: #EEEAFE; stroke: #7C3AED; stroke-width: 2.5; stroke-dasharray: 6 6; rx: 18; ry: 18; }
      .panel-mint  { fill: #E6F6EE; stroke: #16A34A; stroke-width: 2.5; stroke-dasharray: 6 6; rx: 18; ry: 18; }
      .panel-peach { fill: #FEEFE0; stroke: #D97706; stroke-width: 2.5; stroke-dasharray: 6 6; rx: 18; ry: 18; }
      .panel-sky   { fill: #E0F2FE; stroke: #0284C7; stroke-width: 2.5; stroke-dasharray: 6 6; rx: 18; ry: 18; }
      .panel-rose  { fill: #FCE7F3; stroke: #DB2777; stroke-width: 2.5; stroke-dasharray: 6 6; rx: 18; ry: 18; }

      /* pill titles */
      .pill-lilac  { fill: #7C3AED; rx: 16; ry: 16; }
      .pill-mint   { fill: #16A34A; rx: 16; ry: 16; }
      .pill-peach  { fill: #D97706; rx: 16; ry: 16; }
      .pill-sky    { fill: #0284C7; rx: 16; ry: 16; }
      .pill-rose   { fill: #DB2777; rx: 16; ry: 16; }
      .pill-text   { font: 800 22px Inter, system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }

      /* boxes / labels inside panels */
      .body        { font: 500 16px Inter, system-ui, sans-serif; fill: #1F2937; }
      .body-bold   { font: 700 16px Inter, system-ui, sans-serif; fill: #1F2937; }
      .annot       { font: 500 13px ui-monospace, Menlo, monospace; fill: #374151; }
      .sub-label   { font: 700 13px Inter, system-ui, sans-serif; fill: #1F2937; letter-spacing: 1.4px; }

      /* steps */
      .step-circle { fill: #16A34A; }
      .step-digit  { font: 800 18px Inter, system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .step-num    { font: 800 18px Inter, system-ui, sans-serif; fill: #16A34A; }
      .step-label  { font: 700 18px Inter, system-ui, sans-serif; fill: #1F2937; }

      /* small boxes inside panels */
      .card        { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-accent { fill: #FFFFFF; stroke: #16A34A; stroke-width: 1.5; rx: 8; ry: 8; }

      /* connectors */
      .conn        { fill: none; stroke: #374151; stroke-width: 2; stroke-dasharray: 4 6; }
      .conn-solid  { fill: none; stroke: #374151; stroke-width: 2; }
      .conn-accent { fill: none; stroke: #16A34A; stroke-width: 2; stroke-dasharray: 4 6; }
    ]]></style>

    <!-- arrowhead marker (inherits stroke color via context-stroke) -->
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>

    <!-- ICON: server rack (mint stack of 3 with two dots per tier) -->
    <symbol id="icon-server" viewBox="0 0 64 64">
      <g>
        <rect x="6"  y="10" width="52" height="14" rx="3" fill="#A7F3D0" stroke="#047857" stroke-width="1.5"/>
        <rect x="6"  y="26" width="52" height="14" rx="3" fill="#A7F3D0" stroke="#047857" stroke-width="1.5"/>
        <rect x="6"  y="42" width="52" height="14" rx="3" fill="#A7F3D0" stroke="#047857" stroke-width="1.5"/>
        <circle cx="14" cy="17" r="2" fill="#10B981"/><circle cx="22" cy="17" r="2" fill="#FFFFFF" stroke="#047857" stroke-width="1"/>
        <circle cx="14" cy="33" r="2" fill="#10B981"/><circle cx="22" cy="33" r="2" fill="#FFFFFF" stroke="#047857" stroke-width="1"/>
        <circle cx="14" cy="49" r="2" fill="#10B981"/><circle cx="22" cy="49" r="2" fill="#FFFFFF" stroke="#047857" stroke-width="1"/>
      </g>
    </symbol>

    <!-- ICON: database cylinder -->
    <symbol id="icon-db" viewBox="0 0 64 64">
      <g>
        <path d="M8 14 v36 a24 8 0 0 0 48 0 v-36" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.5"/>
        <ellipse cx="32" cy="14" rx="24" ry="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
        <ellipse cx="32" cy="26" rx="24" ry="8" fill="none" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="2 2"/>
        <ellipse cx="32" cy="38" rx="24" ry="8" fill="none" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="2 2"/>
      </g>
    </symbol>

    <!-- ICON: monitor with content -->
    <symbol id="icon-monitor" viewBox="0 0 80 64">
      <g>
        <rect x="4" y="4" width="72" height="46" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
        <rect x="4" y="4" width="72" height="10" rx="5" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.5"/>
        <circle cx="11" cy="9" r="1.6" fill="#EF4444"/><circle cx="17" cy="9" r="1.6" fill="#F59E0B"/><circle cx="23" cy="9" r="1.6" fill="#10B981"/>
        <rect x="10" y="20" width="24" height="14" rx="2" fill="#BFDBFE"/>
        <rect x="38" y="20" width="34" height="4" rx="2" fill="#E5E7EB"/>
        <rect x="38" y="28" width="28" height="4" rx="2" fill="#E5E7EB"/>
        <rect x="38" y="36" width="22" height="4" rx="2" fill="#E5E7EB"/>
        <rect x="32" y="50" width="16" height="6" rx="2" fill="#9CA3AF"/>
        <rect x="20" y="56" width="40" height="4" rx="2" fill="#9CA3AF"/>
      </g>
    </symbol>

    <!-- ICON: globe -->
    <symbol id="icon-globe" viewBox="0 0 64 64">
      <g>
        <circle cx="32" cy="32" r="22" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.5"/>
        <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#1D4ED8" stroke-width="1.2"/>
        <ellipse cx="32" cy="32" rx="9"  ry="22" fill="none" stroke="#1D4ED8" stroke-width="1.2"/>
        <path d="M32 10 v44" stroke="#1D4ED8" stroke-width="1.2"/>
      </g>
    </symbol>

    <!-- ICON: cloud -->
    <symbol id="icon-cloud" viewBox="0 0 80 48">
      <g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5">
        <path d="M20 36 a12 12 0 0 1 4 -23 a16 16 0 0 1 32 2 a10 10 0 0 1 2 19 z"/>
      </g>
    </symbol>

    <!-- ICON: dns resolver (rounded card + 3 mini globes connected) -->
    <symbol id="icon-resolver" viewBox="0 0 96 64">
      <g>
        <rect x="2" y="6" width="60" height="52" rx="10" fill="#BBF7D0" stroke="#047857" stroke-width="1.5"/>
        <text x="32" y="38" font-family="Inter" font-weight="800" font-size="14" fill="#065F46" text-anchor="middle">DNS</text>
        <line x1="62" y1="20" x2="80" y2="14" stroke="#374151" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="62" y1="32" x2="80" y2="32" stroke="#374151" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="62" y1="44" x2="80" y2="50" stroke="#374151" stroke-width="1" stroke-dasharray="2 3"/>
        <circle cx="86" cy="14" r="6" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1"/>
        <circle cx="86" cy="32" r="6" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1"/>
        <circle cx="86" cy="50" r="6" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1"/>
      </g>
    </symbol>

    <!-- ICON: lock -->
    <symbol id="icon-lock" viewBox="0 0 48 56">
      <g>
        <path d="M12 24 v-6 a12 12 0 0 1 24 0 v6" fill="none" stroke="#1F2937" stroke-width="2.5"/>
        <rect x="6" y="24" width="36" height="26" rx="4" fill="#FDE68A" stroke="#1F2937" stroke-width="2"/>
        <circle cx="24" cy="36" r="3.5" fill="#1F2937"/>
        <rect x="22.5" y="37" width="3" height="6" fill="#1F2937"/>
      </g>
    </symbol>

    <!-- ICON: key -->
    <symbol id="icon-key" viewBox="0 0 64 32">
      <g>
        <circle cx="12" cy="16" r="10" fill="#FCA5A5" stroke="#991B1B" stroke-width="1.5"/>
        <circle cx="12" cy="16" r="3"  fill="#FFFFFF"/>
        <rect x="20" y="13" width="36" height="6" fill="#FCA5A5" stroke="#991B1B" stroke-width="1.5"/>
        <rect x="42" y="19" width="4"  height="6" fill="#FCA5A5" stroke="#991B1B" stroke-width="1.5"/>
        <rect x="50" y="19" width="4"  height="6" fill="#FCA5A5" stroke="#991B1B" stroke-width="1.5"/>
      </g>
    </symbol>

    <!-- ICON: document / packet -->
    <symbol id="icon-doc" viewBox="0 0 48 56">
      <g>
        <path d="M4 4 H32 L44 16 V52 H4 z" fill="#FEF3C7" stroke="#92400E" stroke-width="1.5"/>
        <path d="M32 4 V16 H44" fill="none" stroke="#92400E" stroke-width="1.5"/>
        <line x1="10" y1="26" x2="38" y2="26" stroke="#92400E" stroke-width="1.2"/>
        <line x1="10" y1="32" x2="38" y2="32" stroke="#92400E" stroke-width="1.2"/>
        <line x1="10" y1="38" x2="30" y2="38" stroke="#92400E" stroke-width="1.2"/>
      </g>
    </symbol>
  </defs>

  <!-- ============================ CANVAS ============================ -->
  <rect class="bg" width="1600" height="1200"/>

  <!-- Title bar -->
  <rect x="56" y="48" width="6" height="56" fill="#1FBFA8" rx="3"/>
  <text class="headline" x="84" y="92">Replace with your headline</text>
  <g transform="translate(1380, 60)">
    <rect width="32" height="32" rx="8" fill="#1FBFA8"/>
    <text font-family="Inter" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle" x="16" y="22">B</text>
    <text class="wordmark" x="44" y="22">ByteByteGo</text>
  </g>

  <!-- Example panel: lilac (Resolve Domain Name) -->
  <g id="panel-1">
    <rect class="panel-lilac" x="56" y="140" width="740" height="360"/>
    <rect class="pill-lilac" x="266" y="124" width="320" height="36"/>
    <text class="pill-text" x="426" y="142">Replace panel title</text>

    <!-- example step circle + label outside a card -->
    <circle class="step-circle" cx="100" cy="200" r="22"/>
    <text class="step-digit"   x="100" y="200">1</text>
    <text x="132" y="206"><tspan class="step-num">1</tspan> <tspan class="step-label">Look up in cache</tspan></text>

    <!-- example card -->
    <rect class="card" x="96" y="240" width="220" height="180"/>
    <text class="sub-label" x="116" y="266">CACHE</text>
    <text class="body" x="116" y="292">Browser</text>
    <text class="body" x="116" y="316">OS Cache</text>
    <text class="body" x="116" y="340">Local Cache</text>
    <text class="body" x="116" y="364">ISP</text>

    <use href="#icon-resolver" x="380" y="270" width="120" height="80"/>
    <text class="annot" x="380" y="380">172.67.73.33</text>
  </g>

  <!-- Example panel: mint (Initiate Request) -->
  <g id="panel-2">
    <rect class="panel-mint" x="56" y="540" width="740" height="320"/>
    <rect class="pill-mint" x="266" y="524" width="320" height="36"/>
    <text class="pill-text" x="426" y="542">Initiate Request</text>

    <use href="#icon-monitor" x="100" y="620" width="160" height="120"/>
    <use href="#icon-server"  x="600" y="630" width="120" height="120"/>

    <text class="body-bold" x="200" y="780" text-anchor="middle">Client</text>
    <text class="body-bold" x="660" y="780" text-anchor="middle">Server</text>

    <path class="conn" d="M 270 700 C 380 700, 480 700, 590 700" marker-end="url(#ah)"/>
    <text class="annot" x="430" y="688" text-anchor="middle">TCP 3-way handshake</text>
  </g>

  <!-- Example panel: peach (Handle Response) -->
  <g id="panel-3">
    <rect class="panel-peach" x="820" y="140" width="724" height="720"/>
    <rect class="pill-peach" x="1030" y="124" width="320" height="36"/>
    <text class="pill-text" x="1190" y="142">Handle Response</text>

    <text class="body" x="860" y="220">…content goes here, replace with topic detail…</text>
  </g>

  <!-- Footer -->
  <text class="annot" x="84" y="1160">Source: example.com</text>
</svg>

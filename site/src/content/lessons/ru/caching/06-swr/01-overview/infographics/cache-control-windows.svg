<svg height="788" width="1428" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1428 788"><defs /><defs><linearGradient id="gradient-timeline-line" x1="90" y1="61" x2="90" y2="439" gradientUnits="userSpaceOnUse"><stop offset="-1.5873015873015872%" stop-color="#10b981" /><stop offset="32.804232804232804%" stop-color="#f59e0b" /><stop offset="67.1957671957672%" stop-color="#f43f5e" /><stop offset="101.58730158730158%" stop-color="#10b981" /></linearGradient></defs><g id="infographic-container"><g><g transform="translate(335, 0)"><foreignObject height="35" width="718" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">max-age=60, stale-while-revalidate=300, stale-if-error=86400</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1388" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Три вложенных окна: каждый слой делает одну работу — свежесть, затем tail latency, затем выживание в аварии</span></foreignObject></g></g><g transform="translate(534, 91)"><g><path d="M 90 61 L 90 439" stroke="url(#gradient-timeline-line)" stroke-width="2" width="1" height="378" /><ellipse x="84" y="49" width="12" height="12" fill="#10b981" cx="90" cy="55" rx="6" ry="6" /><ellipse x="84" y="179" width="12" height="12" fill="#f59e0b" cx="90" cy="185" rx="6" ry="6" /><ellipse x="84" y="309" width="12" height="12" fill="#f43f5e" cx="90" cy="315" rx="6" ry="6" /><ellipse x="84" y="439" width="12" height="12" fill="#10b981" cx="90" cy="445" rx="6" ry="6" /></g><g><g transform="translate(120, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">0-60с - свежо</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="80" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Внутри max-age. Отдаётся прямо из кэша, без обращения к origin</span></foreignObject></g></g><g transform="translate(120, 130)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">60-360с - устарело, окно SWR</span></foreignObject></g><g transform="translate(0, 81)"><foreignObject height="160" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">За max-age. Отдаётся устаревшим мгновенно, пока в фоне идёт одно обновление - никто не блокируется</span></foreignObject></g></g><g transform="translate(120, 260)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">до 86400с - пол stale-if-error</span></foreignObject></g><g transform="translate(0, 56)"><foreignObject height="160" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Если origin вернул ошибку или лежит, продолжай отдавать последнюю хорошую копию вместо 503</span></foreignObject></g></g><g transform="translate(120, 390)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">за пределами окон - жёсткий промах</span></foreignObject></g><g transform="translate(0, 107)"><foreignObject height="160" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Устарелость исчерпана; следующий запрос обязан заблокироваться на origin или упасть громко</span></foreignObject></g></g></g></g></g></svg>

<svg height="471" width="1428" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1428 471"><defs /><defs><linearGradient id="gradient-timeline-line" x1="90" y1="41" x2="90" y2="299" gradientUnits="userSpaceOnUse"><stop offset="-2.3255813953488373%" stop-color="#10b981" /><stop offset="32.55813953488372%" stop-color="#f59e0b" /><stop offset="67.44186046511628%" stop-color="#f43f5e" /><stop offset="102.32558139534885%" stop-color="#10b981" /></linearGradient></defs><g id="infographic-container"><g><g transform="translate(335, 0)"><foreignObject height="35" width="718" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">max-age=60, stale-while-revalidate=300, stale-if-error=86400</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1388" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Три вложенных окна: каждый слой делает одну работу — свежесть, затем tail latency, затем выживание в аварии</span></foreignObject></g></g><g transform="translate(534, 91)"><g><path d="M 90 41 L 90 299" stroke="url(#gradient-timeline-line)" stroke-width="2" width="1" height="258" /><ellipse x="84" y="29" width="12" height="12" fill="#10b981" cx="90" cy="35" rx="6" ry="6" /><ellipse x="84" y="119" width="12" height="12" fill="#f59e0b" cx="90" cy="125" rx="6" ry="6" /><ellipse x="84" y="209" width="12" height="12" fill="#f43f5e" cx="90" cy="215" rx="6" ry="6" /><ellipse x="84" y="299" width="12" height="12" fill="#10b981" cx="90" cy="305" rx="6" ry="6" /></g><g><g transform="translate(120, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">0-60с - свежо</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Внутри max-age. Отдаётся прямо из кэша, без обращения к origin</span></foreignObject></g></g><g transform="translate(120, 90)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">60-360с - устарело, окно SWR</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">За max-age. Отдаётся устаревшим мгновенно, пока в фоне идёт одно обновление - никто не блокируется</span></foreignObject></g></g><g transform="translate(120, 180)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">до 86400с - пол stale-if-error</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Если origin вернул ошибку или лежит, продолжай отдавать последнюю хорошую копию вместо 503</span></foreignObject></g></g><g transform="translate(120, 270)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">за пределами окон - жёсткий промах</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Устарелость исчерпана; следующий запрос обязан заблокироваться на origin или упасть громко</span></foreignObject></g></g></g></g></g></svg>

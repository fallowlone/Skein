<svg height="899" width="1270" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1270 899"><defs /><g><g><g transform="translate(19, 0)"><foreignObject height="35" width="1192" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Инвалидация: три механизма по скорости распространения</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1230" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Предпочитай тот, что распространяется быстрее — версионированным URL purge не нужен вовсе.</span></foreignObject></g></g><g transform="translate(383, 91)"><g><g transform="translate(72, 338)"><g transform="translate(28, 0)"><foreignObject height="290" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Новый content hash = новый URL, инвалидировать нечего. Стоимость распространения по сути нулевая; старое и новое сосуществуют, старое стареет.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,318 16,302 16,318" /><path d="M 28 374 L 28 306 L 140 306" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 350)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Версионированный / immutable URL</span></foreignObject></g></g><g transform="translate(196, 169)"><g transform="translate(28, 0)"><foreignObject height="222" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Один вызов purge сбрасывает каждую edge-копию с тегом. Instant purge у Cloudflare распространяется глобально меньше чем за 150 мс.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,250 16,234 16,250" /><path d="M 28 306 L 28 238 L 140 238" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 282)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Instant tag / surrogate-key purge</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="256" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Широкие purge обычно доходят до каждой edge-ноды за секунды — несколько минут — пол eventual consistency, подстрахованный TTL + stale-while-revalidate.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,284 16,268 16,284" /><path d="M 28 340 L 28 272 L 140 272" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 316)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Широкий / tag-based purge на масштабе</span></foreignObject></g></g></g></g></g></svg>

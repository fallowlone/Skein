<svg height="471" width="1751" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1751 471"><defs /><g id="infographic-container"><g><g transform="translate(467.5, 0)"><foreignObject height="35" width="776" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Два вопроса, четыре выбора директивы</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1711" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Можно ли кешу ХРАНИТЬ это? × Это для одного пользователя или безопасно делить? — каждая ячейка называет подходящий Cache-Control.</span></foreignObject></g></g><g transform="translate(685.5, 91)"><path d="M 0 170 L 340 170" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(340, 170)"><path d="M 0 0 L -5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L -5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(0, 170)"><path d="M 0 0 L 5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><path d="M 170 0 L 170 340" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(170, 0)"><path d="M 0 0 L -2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(170, 340)"><path d="M 0 0 L -2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g><g transform="translate(10, 10)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 150
  L 16 150

" x="0" y="0" width="150" height="150" fill="#6366f1" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Общий HTML, который меняется → no-cache (max-age=0, must-revalidate)</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Публичный документ, который обязан подхватывать новые URL ассетов. Хранится, но ревалидируется каждый раз, поэтому никогда не отдаётся устаревшим.</span></foreignObject></g></g><g transform="translate(180, 180)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 134
  Q 150 150 134 150
  L 16 150
  Q 0 150 0 134
  L 0 0
  L 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#14b8a6" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ассет с хешем в имени → public, max-age=31536000, immutable</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">app.4f3a9c.js никогда не меняется под этим URL — кешируйте на год и пропускайте ревалидацию. Хешируйте ассеты, но не HTML.</span></foreignObject></g></g></g></g></g></svg>

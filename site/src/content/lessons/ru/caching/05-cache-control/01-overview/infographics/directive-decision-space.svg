" x="0" y="0" width="150" height="150" fill="#f43f5e" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Чувствительное / для одного → private, no-store</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Баланс счёта, сброс пароля, личный дашборд. no-store не пишет на диск и в bfcache; private исключает CDN. Никогда не делится, никогда не хранится.</span></foreignObject></g></g><g transform="translate(180, 10)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 134
  Q 150 150 134 150
  L 0 150
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#f59e0b" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Персональное, но хранимое → private, max-age=0</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Для одного пользователя, но кешируется только в браузере. private держит это вне общего CDN; ревалидация перед переиспользованием. Дополните Vary: Cookie для подстраховки.</span></foreignObject></g></g><g transform="translate(10, 180)"><path d="
  M 0 0
  L 150 0
  L 150 134

<svg height="244" width="1070" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1070 244"><defs /><defs><linearGradient id="edge-gradient-0-0" gradientUnits="userSpaceOnUse" x1="470" y1="126" x2="310" y2="78"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#14b8a6" /></linearGradient><linearGradient id="edge-gradient-0-1" gradientUnits="userSpaceOnUse" x1="670" y1="126" x2="830" y2="78"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#14b8a6" /></linearGradient><linearGradient id="edge-gradient-0-2" gradientUnits="userSpaceOnUse" x1="470" y1="126" x2="310" y2="174"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#14b8a6" /></linearGradient><linearGradient id="edge-gradient-0-3" gradientUnits="userSpaceOnUse" x1="670" y1="126" x2="830" y2="174"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#14b8a6" /></linearGradient><filter id="compact-shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" /></filter></defs><g id="infographic-container"><g><g><path d="M 470 126 C 390 126 390 78 310 78" stroke="url(#edge-gradient-0-0)" stroke-width="2" fill="none" /><path d="M 670 126 C 750 126 750 78 830 78" stroke="url(#edge-gradient-0-1)" stroke-width="2" fill="none" /><path d="M 470 126 C 390 126 390 174 310 174" stroke="url(#edge-gradient-0-2)" stroke-width="2" fill="none" /><path d="M 670 126 C 750 126 750 174 830 174" stroke="url(#edge-gradient-0-3)" stroke-width="2" fill="none" /></g><g><g transform="translate(470, 96)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="0" y="0" width="3" height="60" fill="#6366f1" rx="1.5" ry="1.5" /><g transform="translate(36, 8)"><g transform="translate(0, 13.5)"><g><foreignObject height="17" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">this-типизированные возможности</span></foreignObject></g></g></g></g><g transform="translate(110, 48)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="197" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(8, 8)"><g transform="translate(0, -0.5)"><g><foreignObject height="17" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">параметр this: T</span></foreignObject></g></g><g transform="translate(0, 16.5)"><foreignObject height="28" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Типизирует получателя на момент вызова и стирается при эмите. При noImplicitThis (в strict) выводит на поверхность баг потерянного this, когда метод отделён и вызван несвязанным.</span></foreignObject></g></g></g><g transform="translate(830, 48)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="0" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(36, 8)"><g transform="translate(0, -0.5)"><g><foreignObject height="17" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">this-гард this is Derived</span></foreignObject></g></g><g transform="translate(0, 16.5)"><foreignObject height="28" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Метод, возвращающий this is Derived, сужает самого получателя в вызывающей области — isDir() уточняет node до подкласса внутри ветки if.</span></foreignObject></g></g></g><g transform="translate(110, 144)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="197" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(8, 8)"><g transform="translate(0, -0.5)"><g><foreignObject height="17" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">полиморфный this</span></foreignObject></g></g><g transform="translate(0, 16.5)"><foreignObject height="28" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Метод, возвращающий this, означает «конкретный текущий класс», поэтому fluent-билдеры остаются типизированными при наследовании — where() сохраняет методы подкласса в цепочке.</span></foreignObject></g></g></g><g transform="translate(830, 144)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="0" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(36, 8)"><g transform="translate(0, -0.5)"><g><foreignObject height="17" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">ThisType&lt;T&gt;</span></foreignObject></g></g><g transform="translate(0, 16.5)"><foreignObject height="28" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Маркер контекстной типизации без рантайм-эффекта, задающий, чем является this внутри объектных литералов с наборами методов — объект options во Vue 2, миксины, fluent-конфиг.</span></foreignObject></g></g></g></g></g></g></svg>

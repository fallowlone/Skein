<svg height="1253" width="1978" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1978 1253"><defs /><defs><filter id="vs-divider-glow-filter" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" /></filter><filter id="drop-shadow" x="-25%" y="-25%" width="200%" height="200%"><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="black" flood-opacity="0.8" /></filter></defs><g id="infographic-container"><g><g transform="translate(537.5, 0)"><foreignObject height="35" width="863" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Слабее против жёстче — выбор ограничения</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1938" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ограничивайте ровно теми членами, которых касается тело — слабее, и тело не написать; жёстче, и вызывающие платят за ненужные им требования</span></foreignObject></g></g><g transform="translate(686.5, 91)"><g><g transform="translate(245, 521)"><ellipse x="0" y="0" width="100" height="100" fill="#ff9bb5" filter="url(#vs-divider-glow-filter)" opacity="0.6" cx="50" cy="50" rx="50" ry="50" /><ellipse x="0" y="0" width="100" height="100" fill="#ff356a" cx="50" cy="50" rx="50" ry="50" /><text x="50" y="50" font-size="66.66666666666667" font-weight="bold" fill="currentColor" text-anchor="middle" dominant-baseline="central" filter="url(#drop-shadow)">VS</text></g></g><g><g transform="translate(25, 20)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Принимает больше вызывающих</span></foreignObject></g><rect x="120" y="81" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 92)"><foreignObject height="160" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Широкая граница делает присваиваемыми больше типов аргументов, поэтому меньше отвергается в точке вызова</span></foreignObject></g></g><g transform="translate(25, 292)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Открывает меньше членов</span></foreignObject></g><rect x="120" y="81" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 92)"><foreignObject height="180" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Тело не может коснуться негарантированного и откатывается к приведениям или рантайм-проверкам</span></foreignObject></g></g><g transform="translate(25, 584)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Слишком слабое — тело не написать</span></foreignObject></g><rect x="120" y="81" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 92)"><foreignObject height="140" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ограничьте ниже того, что читает тело, и не сможете использовать ограниченное значение</span></foreignObject></g></g><g transform="translate(25, 856)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ослабление позже — молча</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 67)"><foreignObject height="199" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Уберите обязательный член: вызывающие компилируются, но телу, читавшему его, нужен ненаписанный запасной путь</span></foreignObject></g></g><g transform="translate(365, 20)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Открывает больше членов</span></foreignObject></g><rect x="0" y="81" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 92)"><foreignObject height="120" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждый член границы гарантирован, поэтому тело вправе свободно их читать</span></foreignObject></g></g><g transform="translate(365, 292)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Отвергает больше вызывающих</span></foreignObject></g><rect x="0" y="81" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 92)"><foreignObject height="120" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Аргумент без обязательного члена больше не подходит — громкая ошибка в точке вызова</span></foreignObject></g></g><g transform="translate(365, 584)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Связывает вызывающих лишним</span></foreignObject></g><rect x="0" y="81" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 92)"><foreignObject height="140" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Называя члены, которые тело не читает, навязывает ненужные вызывающим требования</span></foreignObject></g></g><g transform="translate(365, 856)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ужесточение расходится громко</span></foreignObject></g><rect x="0" y="81" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 92)"><foreignObject height="120" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Один новый обязательный член роняет каждую точку вызова — PR на ~40 файлов</span></foreignObject></g></g></g></g></g></svg>

<svg height="897" width="1314" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1314 897"><defs /><g><g><g><foreignObject height="35" width="1274" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">От обещания к доказательству: как сделать тип на fetch истинным</span></foreignObject></g><g transform="translate(63.5, 43)"><foreignObject height="48" width="1147" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждая ступень делает аннотацию меньшей ложью; только верхняя осматривает байты</span></foreignObject></g></g><g transform="translate(343, 91)"><g><g transform="translate(72, 396)"><g transform="translate(28, 0)"><foreignObject height="256" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Утверждает форму, не делает никаких проверок. Чистое обещание о проводе; переименованное поле или null проскользнут насквозь.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,284 16,268 16,284" /><path d="M 28 340 L 28 272 L 140 272" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 316)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">as User — каст</span></foreignObject></g></g><g transform="translate(196, 264)"><g transform="translate(28, 0)"><foreignObject height="342" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Заставляет каждого вызывающего обработать ветку отказа. Честный поток управления, но полезная нагрузка всё ещё кастится — без проверки.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,370 16,354 16,370" /><path d="M 28 426 L 28 358 L 140 358" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 402)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Размеченное объединение / Result</span></foreignObject></g></g><g transform="translate(320, 132)"><g transform="translate(28, 0)"><foreignObject height="307" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Тип механически привязан к контракту: расхождение закрыто. Байты всё ещё не проверены — сервер, нарушающий свою спеку, проскользнёт.</span></foreignObject></g><polygon fill="#0ea5e9" opacity="0.9" width="16" height="16" points="0,335 16,319 16,335" /><path d="M 28 391 L 28 323 L 140 323" stroke="#0ea5e9" stroke-width="8" fill="none" /><g transform="translate(32, 367)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Кодогенерация из OpenAPI / общий тип</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="256" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Осматривает реальные байты и сужает при успехе. Пробел доверия закрыт — обещание наконец становится доказательством.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,284 16,268 16,284" /><path d="M 28 340 L 28 272 L 140 272" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 316)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">zod .parse в рантайме</span></foreignObject></g></g></g></g></g></svg>

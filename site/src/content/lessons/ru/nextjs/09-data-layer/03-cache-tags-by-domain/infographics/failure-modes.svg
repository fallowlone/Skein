1999/xhtml">Шторм чистки повторяется ~60 раз в день</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#f43f5e" /></g><g transform="translate(365, 20)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Листинги протухшие ~6 часов</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#f59e0b" /></g><g transform="translate(365, 73)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Неверные цены: возвраты + юристы</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#f59e0b" /></g><g transform="translate(365, 126)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Чинится лишь при истечении time-revalidate</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#f59e0b" /></g><g transform="translate(365, 179)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;
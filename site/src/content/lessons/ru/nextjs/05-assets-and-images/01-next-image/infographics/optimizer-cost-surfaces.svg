<svg height="1921" width="1567" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1567 1921"><defs /><g id="infographic-container"><g><g transform="translate(141.5, 0)"><foreignObject height="35" width="1244" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Где работает оптимизатор — три поверхности затрат, один srcset</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1527" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Разметка next/image та же; счёт за работу оптимизатора меняет форму в зависимости от того, где идёт трансформация</span></foreignObject></g></g><g transform="translate(613.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Vercel — тариф по исходным картинкам</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="398" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">В каждый план входит квота на трансформации; каталог на 40 000 SKU пробивает включённые тысячи быстро, и каждая новая исходная картинка дальше — платная.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="530" fill="#6366f1" points="0,0 15,10 30,0 30,520 15,530 0,520" /><g><text width="30" height="530" x="15" y="265" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 530)"><g><g transform="translate(135, 0)"><polygon width="30" height="650" fill="#14b8a6" points="0,0 15,10 30,0 30,640 15,650 0,640" /><g><text width="30" height="650" x="15" y="325" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Self-hosted — CPU плюс персистентный диск</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="518" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">sharp тратит ~100–300 мс CPU на перекодирование каждого варианта; кеш живёт в .next/cache/images и обязан переживать деплои, иначе весь каталог перекодируется каждый релиз ежедневной пилой CPU.</span></foreignObject></g></g></g></g><g transform="translate(0, 1180)"><g><g transform="translate(0, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Кастомный loader — выделенный image-CDN</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="458" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Переписать URL на Cloudinary, imgix или Thumbor — сохранить преимущества разметки next/image (srcset, размеры, lazy/priority), перенеся трансформацию на инфраструктуру, для этого построенную.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="610" fill="#f59e0b" points="0,0 15,10 30,0 30,600 15,610 0,600" /><g><text width="30" height="610" x="15" y="305" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

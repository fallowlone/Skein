<svg height="831" width="1311" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1311 831"><defs /><defs><linearGradient id="gradient-arrow-fill-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" stop-opacity="0.36" /><stop offset="100%" stop-color="#FF356A" stop-opacity="0" /></linearGradient><linearGradient id="gradient-arrow-stroke-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" /><stop offset="58%" stop-color="#FF356A" stop-opacity="0" /></linearGradient></defs><g id="infographic-container"><g><g transform="translate(2, 0)"><foreignObject height="35" width="1267" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Диагностика протухших данных — сначала сервер, потом клиент</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1271" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Назовите слой-виновник до того, как трогать код; у каждого слоя ровно один правильный рычаг</span></foreignObject></g></g><g transform="translate(295.5, 91)"><g><polygon x="207.5" y="146" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(207.5, 146)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="447.5" y="146" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(447.5, 146)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="567.5" y="344.5" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(567.5, 344.5)rotate(90 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /></g><g><g><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Шаг 1 — Маршрут статический?</span></foreignObject></g><rect x="60" y="107" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 118)"><foreignObject height="199" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Вывод сборки: кружок — статический. Если статический, Full Route Cache отдаёт HTML времён сборки — задайте revalidate или force-dynamic.</span></foreignObject></g></g><g transform="translate(240, 0)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Шаг 2 — Fetch кешируется?</span></foreignObject></g><rect x="60" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="160" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">На Next 14 голый fetch по умолчанию force-cache в непробиваемом деплоем Data Cache. Дайте окно revalidate, теги или no-store.</span></foreignObject></g></g><g transform="translate(480, 0)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Шаг 3 — Мутация инвалидирует?</span></foreignObject></g><rect x="60" y="107" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 118)"><foreignObject height="160" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Запись, не вызывающая revalidatePath/revalidateTag, оставляет все кеши нетронутыми — самое частое упущение.</span></foreignObject></g></g><g transform="translate(480, 397)"><g><foreignObject height="128" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Шаг 4 — Протухло только в одной вкладке?</span></foreignObject></g><rect x="60" y="132" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 143)"><foreignObject height="160" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сервер по curl свежий, навигация назад показывает старое — клиентский Router Cache; фикс в шаге 3 или router.refresh().</span></foreignObject></g></g></g></g></g></svg>

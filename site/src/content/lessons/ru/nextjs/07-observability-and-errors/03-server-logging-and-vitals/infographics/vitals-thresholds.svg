<svg height="1780" width="2749" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 2749 1780"><defs /><g id="infographic-container"><g><g transform="translate(841, 0)"><foreignObject height="35" width="1027" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Core Web Vitals: пороги Good/Poor, измеряемые по полевому p75</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="2709" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Агрегируйте каждую метрику до полевого p75 по маршруту и деплою, затем сверяйте с этими фиксированными диапазонами — это rating, который шлёт beacon. Лабораторный прогон Lighthouse их не видит; только поле.</span></foreignObject></g></g><g transform="translate(1204.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">LCP — Largest Contentful Paint</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="458" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Хорош до 2,5 с, плох после 4 с. Плохой деплой сдвинул LCP страницы товара с 2,1 с до 3,4 с — выше Good, но не достигнув порога poor в 4 с, поэтому лабораторный алерт девять дней молчал.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="530" fill="#6366f1" points="0,0 15,10 30,0 30,520 15,530 0,520" /><g><text width="30" height="530" x="15" y="265" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 530)"><g><g transform="translate(135, 0)"><polygon width="30" height="450" fill="#14b8a6" points="0,0 15,10 30,0 30,440 15,450 0,440" /><g><text width="30" height="450" x="15" y="225" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">INP — Interaction to Next Paint</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="378" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Хорош до 200 мс, плох после 500 мс. Отзывчивость живёт в браузере, поэтому только полевой beacon скажет, где на самом деле находится маршрут.</span></foreignObject></g></g></g></g><g transform="translate(0, 980)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">CLS — Cumulative Layout Shift</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="597" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Хорош до 0,1, плох после 0,25. Безразмерная оценка визуальной стабильности, измеряемая по p75 — достаточно строго, чтобы поймать болезненный хвост, но не будить дежурного из-за одного сломанного расширения.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="669" fill="#8b5cf6" points="0,0 15,10 30,0 30,659 15,669 0,659" /><g><text width="30" height="669" x="15" y="334.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

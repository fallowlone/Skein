<svg height="871" width="858" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 858 871"><defs /><g><g><g><foreignObject height="35" width="818" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Миграция B3 → W3C — именно в таком порядке</span></foreignObject></g><g transform="translate(28.5, 43)"><foreignObject height="48" width="761" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Read-both до write-W3C; пропусти шаг — и трейсы тихо расщепятся</span></foreignObject></g></g><g transform="translate(53, 91)"><g><g transform="translate(72, 432)"><g transform="translate(28, 0)"><foreignObject height="188" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Найти каждый сервис, всё ещё эмитирующий только B3-заголовки, до любых изменений.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,216 16,200 16,216" /><path d="M 28 272 L 28 204 L 140 204" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 248)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;
<svg height="1536" width="1650" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1650 1536"><defs /><g id="infographic-container"><g><g transform="translate(495.5, 0)"><foreignObject height="35" width="619" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сопоставь симптом со стадией</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1610" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">«Медленно на какой стадии?» — первый диагностический вопрос: у каждого режима отказа своя стадия и своё исправление</span></foreignObject></g></g><g transform="translate(655, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Синтаксическая ошибка</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="199" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Стадия parse — чисто текстовая проблема, схема ни при чём. Исправь текст SQL.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="291" fill="#6366f1" points="0,0 15,10 30,0 30,281 15,291 0,281" /><g><text width="30" height="291" x="15" y="145.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 291)"><g><g transform="translate(135, 0)"><polygon width="30" height="232" fill="#14b8a6" points="0,0 15,10 30,0 30,222 15,232 0,222" /><g><text width="30" height="232" x="15" y="116" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">relation/column does not exist</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="160" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Стадия analyze — SQL валиден, но имени нет в каталоге. Исправь имя.</span></foreignObject></g></g></g></g><g transform="translate(0, 523)"><g><g transform="translate(0, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Резко замедлилось после массовой загрузки</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Стадия plan — устаревшие оценки строк, плохой план. Запусти ANALYZE для обновления статистики, не переписывай запрос.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="511" fill="#f59e0b" points="0,0 15,10 30,0 30,501 15,511 0,501" /><g><text width="30" height="511" x="15" y="255.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1034)"><g><g transform="translate(135, 0)"><polygon width="30" height="371" fill="#f43f5e" points="0,0 15,10 30,0 30,361 15,371 0,361" /><g><text width="30" height="371" x="15" y="185.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Всегда медленно, план выглядит верным</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="239" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Стадия execute — реально читается слишком много страниц. Добавь индекс или читай меньше данных.</span></foreignObject></g></g></g></g></g></g></g></svg>

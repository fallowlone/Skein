<svg height="1675" width="1187" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1187 1675"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="1147" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Четыре тормоза, чтобы рекурсивный CTE не крутился вечно</span></foreignObject></g><g transform="translate(29.5, 43)"><foreignObject height="48" width="1088" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Без тормоза цикл крутится, пока work_mem не сольётся на диск и запрос не зависнет</span></foreignObject></g></g><g transform="translate(423.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Клауза CYCLE (PG14+)</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Декларативное обнаружение циклов; стоп перепосещению узла, уже бывшего на пути — предпочтительно на реальных графах</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="391" fill="#6366f1" points="0,0 15,10 30,0 30,381 15,391 0,381" /><g><text width="30" height="391" x="15" y="195.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 391)"><g><g transform="translate(135, 0)"><polygon width="30" height="371" fill="#14b8a6" points="0,0 15,10 30,0 30,361 15,371 0,361" /><g><text width="30" height="371" x="15" y="185.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Проверка пути через массив посещённых</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Любая версия: неси ARRAY[node], добавь WHERE NOT node = ANY(path); ловит каждый графовый цикл</span></foreignObject></g></g></g></g><g transform="translate(0, 762)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">UNION, не UNION ALL</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="339" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Дедуплицирует каждый проход против результата; стопит простые повторы, но медленнее и ловит не все графовые циклы</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="411" fill="#f59e0b" points="0,0 15,10 30,0 30,401 15,411 0,401" /><g><text width="30" height="411" x="15" y="205.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1173)"><g><g transform="translate(135, 0)"><polygon width="30" height="371" fill="#f43f5e" points="0,0 15,10 30,0 30,361 15,371 0,361" /><g><text width="30" height="371" x="15" y="185.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Предел глубины (WHERE depth &lt; 50)</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="259" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ремень безопасности в любом случае — ограничивает неограниченный обход даже с защитой от циклов</span></foreignObject></g></g></g></g></g></g></g></svg>

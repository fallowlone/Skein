oke="#f59e0b" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Список аргументов (shell=False) — нет shell, нет инъекции</span></foreignObject></g></g><g transform="translate(900, 150)"><rect width="300" height="40" rx="20" ry="20" fill="#14b8a61a" stroke="#14b8a6" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">check=True — сбои всплывают, а не проходят молча</span></foreignObject></g></g><g transform="translate(1620, 150)"><rect width="300" height="40" rx="20" ry="20" fill="#6366f11a" stroke="#6366f1" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">timeout= — зависший ребёнок не повесит тебя</span></foreignObject></g></g><g transform="translate(0, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#f59e0b1a" stroke="#f59e0b" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Python запускает программу напрямую через execve — /bin/sh нет в цепочке</span></foreignObject></g></g><g transform="translate(360, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#f59e0b1a" stroke="#f59e0b" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Враждебное имя файла x.png; rm -rf ~ — один инертный аргумент argv, не вторая команда</span></foreignObject></g></g><g transform="translate(720, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#14b8a61a" stroke="#14b8a6" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Ненулевой выход бросает CalledProcessError вместо тихого возврата</span></foreignObject></g></g><g transform="translate(1080, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#14b8a61a" stroke="#14b8a6" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Ловит крон-бэкап, чей pg_dump выходил с ненулевым кодом незамеченным месяцами</span></foreignObject></g></g><g transform="translate(1440, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#6366f11a" stroke="#6366f1" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Бросает TimeoutExpired и убивает ребёнка, превысившего лимит в секундах</span></foreignObject></g></g><g transform="translate(1800, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#6366f11a" stroke="#6366f1" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Ловит битую загрузку, которая зациклила convert и заняла воркера</span></foreignObject></g></g></g></g></g></svg>

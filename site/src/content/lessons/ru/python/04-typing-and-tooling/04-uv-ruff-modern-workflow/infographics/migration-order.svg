<svg height="343" width="1170" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1170 343"><defs /><g><g><g transform="translate(266.5, 0)"><foreignObject height="35" width="597" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Мигрируйте по риску, не big-bang</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1130" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сначала наименее рисковый слой, чтобы первую поломку можно было атрибутировать</span></foreignObject></g></g><g transform="translate(271, 91)"><g><g transform="translate(72, 72)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Только конфиг, нулевой рантайм-риск. Начните с E и F, удалите конфиги flake8/isort/black.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">1. Внедрить ruff</span></foreignObject></g></g><g transform="translate(196, 48)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">uv pip install -r requirements.txt — без смены процесса, доказывает скорость.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">2. uv как drop-in pip</span></foreignObject></g></g><g transform="translate(320, 24)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">uv add, закоммитьте uv.lock, переключите CI на uv sync --frozen — протухший лок упадёт громко.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">3. Lock-файл в CI</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Замените глобальные установки изолированными кешируемыми запусками.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">4. uvx для инструментов</span></foreignObject></g></g></g></g></g></svg>

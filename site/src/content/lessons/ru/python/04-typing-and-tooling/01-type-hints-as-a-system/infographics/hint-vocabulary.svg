 fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="0" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(36, 8)"><g transform="translate(0, -38.5)"><g><foreignObject height="35" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Встроенные дженерики</span></foreignObject></g></g><g transform="translate(0, -3.5)"><foreignObject height="86" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">list[int], dict[str, Decimal] параметризуются напрямую — без импортов typing.List для повседневных коллекций.</span></foreignObject></g></g></g><g transform="translate(110, 144)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="197" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(8, 8)"><g transform="translate(0, -51)"><g><foreignObject height="18" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">TypedDict</span></foreignObject></g></g><g transform="translate(0, -33)"><foreignObject height="128" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Именует и проверяет ключи и типы значений анонимного словаря; в рантайме остаётся обычным dict, так что вызовы не ломаются.</span></foreignObject></g></g></g><g transform="translate(830, 192)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="0" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(36, 8)"><g transform="translate(0, -44)"><g><foreignObject height="18" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Literal</span></foreignObject></g></g><g transform="translate(0, -26)"><foreignObject height="114" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Замыкает строковый флаг в фиксированный набор — опечатка в режиме это падение сборки, а не KeyError в три часа ночи.</span></foreignObject></g></g></g><g transform="translate(110, 240)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="197" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(8, 8)"><g transform="translate(0, -37)"><g><foreignObject height="18" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Annotated</span></foreignObject></g></g><g transform="translate(0, -19)"><foreignObject height="100" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Несёт метаданные (единицы, валидацию), которые читают pydantic и FastAPI, тогда как чекеры видят лишь базовый тип.</span></foreignObject></g></g></g></g></g></g></svg>

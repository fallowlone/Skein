<svg height="2284" width="1294" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1294 2284"><defs /><g id="infographic-container"><g><g transform="translate(220.5, 0)"><foreignObject height="35" width="813" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Пять чисел на грани «один сервер vs флот»</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1254" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждая оценка лежит на пороге, где архитектура изгибается — считай их, остальное пропусти</span></foreignObject></g></g><g transform="translate(477, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Пиковый read QPS</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Один primary отдаёт низкие тысячи чтений; перешагнул порог — нужны реплики, кэш или fan-out путь чтения. Обычно первое меняющее дизайн число.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="431" fill="#6366f1" points="0,0 15,10 30,0 30,421 15,431 0,421" /><g><text width="30" height="431" x="15" y="215.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 431)"><g><g transform="translate(135, 0)"><polygon width="30" height="490" fill="#14b8a6" points="0,0 15,10 30,0 30,480 15,490 0,480" /><g><text width="30" height="490" x="15" y="245" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Пиковый write QPS</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="418" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Один primary держит низкие тысячи записей; десятки тысяч вынуждают шардирование или write-оптимизированное хранилище. Решает, простой data-tier или сложный.</span></foreignObject></g></g></g></g><g transform="translate(0, 921)"><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Хранилище по классу данных</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="398" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Текст и медиа часто различаются в ~100 раз; доминирующий класс выбирает технологию — реляционка/wide-column для текста, object store + CDN для медиа.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="510" fill="#f59e0b" points="0,0 15,10 30,0 30,500 15,510 0,500" /><g><text width="30" height="510" x="15" y="255" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1431)"><g><g transform="translate(135, 0)"><polygon width="30" height="331" fill="#f43f5e" points="0,0 15,10 30,0 30,321 15,331 0,321" /><g><text width="30" height="331" x="15" y="165.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Размер горячего набора</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="239" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Влез в RAM одного узла (~256 ГБ) — хватит одного кэш-узла; больше — шардируешь кэш по узлам.</span></foreignObject></g></g></g></g><g transform="translate(0, 1762)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Пиковая egress-полоса</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="299" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Пиковый read QPS x средний размер ответа задаёт счёт CDN и предел NIC — например, ~12 Гбит/с не влезут в одну карту на 10 Гбит/с.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="391" fill="#6366f1" points="0,0 15,10 30,0 30,381 15,391 0,381" /><g><text width="30" height="391" x="15" y="195.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">05</text></g></g></g></g></g></g></g></svg>

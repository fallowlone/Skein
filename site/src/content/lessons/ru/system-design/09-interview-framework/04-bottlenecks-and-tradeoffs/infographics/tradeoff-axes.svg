<svg height="3307" width="1654" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1654 3307"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="1614" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Четыре оси компромиссов — каждый выбор покупает одно свойство ценой другого</span></foreignObject></g><g transform="translate(182.5, 43)"><foreignObject height="48" width="1249" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сеньорский сигнал — назвать цену, а не сам выбор. Скажите, что купили и чем за это заплатили.</span></foreignObject></g></g><g transform="translate(657, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="180" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Согласованность против доступности — компромисс CAP/PACELC</span></foreignObject></g><g transform="translate(0, 180)"><foreignObject height="717" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сильная согласованность требует координации — она стоит доступности при разделении сети и всегда стоит задержки. Итоговая согласованность покупает доступность и низкую задержку ценой устаревших чтений. Счётчик лайков может устареть; баланс счёта — нет.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="929" fill="#6366f1" points="0,0 15,10 30,0 30,919 15,929 0,919" /><g><text width="30" height="929" x="15" y="464.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 929)"><g><g transform="translate(135, 0)"><polygon width="30" height="689" fill="#14b8a6" points="0,0 15,10 30,0 30,679 15,689 0,679" /><g><text width="30" height="689" x="15" y="344.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Задержка против стоимости</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="577" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Меньшая задержка покупается репликами, кэшем, регионами — и всё это деньги. Почти любую цель можно достичь, потратив достаточно; вопрос дизайна — самый дешёвый способ попасть в ту цель, что вам реально нужна.</span></foreignObject></g></g></g></g><g transform="translate(0, 1618)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Простота против масштаба</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="697" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Побеждает самый простой дизайн, удовлетворяющий требованиям. Один экземпляр Postgres, вмещающий нагрузку, лучше шардированной мультирегиональной системы, которая вам не нужна. Добавляйте сложность только там, где её требует оценка.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="789" fill="#f59e0b" points="0,0 15,10 30,0 30,779 15,789 0,779" /><g><text width="30" height="789" x="15" y="394.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 2407)"><g><g transform="translate(135, 0)"><polygon width="30" height="769" fill="#f43f5e" points="0,0 15,10 30,0 30,759 15,769 0,759" /><g><text width="30" height="769" x="15" y="384.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Оптимизация чтения против записи</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="637" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Предвычисляйте при записи, чтобы удешевить чтения (fan-out-on-write), или вычисляйте при чтении, чтобы удешевить записи (fan-out-on-read) — но не одновременно. Выбор решает соотношение чтений и записей в паттерне доступа.</span></foreignObject></g></g></g></g></g></g></g></svg>

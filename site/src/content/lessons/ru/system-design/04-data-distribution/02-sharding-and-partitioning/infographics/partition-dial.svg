<svg height="1641" width="1164" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1164 1641"><defs /><g id="infographic-container"><g><g transform="translate(130.5, 0)"><foreignObject height="35" width="863" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Три схемы партиционирования — одна ручка</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1124" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждая стратегия покупает одно свойство ценой другого — бесплатного выбора нет</span></foreignObject></g></g><g transform="translate(412, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Range</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="478" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Покупает эффективные range-сканы (все заказы за март бьют в один шард) — ценой горячей точки записи на упорядоченных ключах (timestamp, autoincrement id кучкуются на последнем шарде)</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="530" fill="#6366f1" points="0,0 15,10 30,0 30,520 15,530 0,520" /><g><text width="30" height="530" x="15" y="265" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 530)"><g><g transform="translate(135, 0)"><polygon width="30" height="510" fill="#14b8a6" points="0,0 15,10 30,0 30,500 15,510 0,500" /><g><text width="30" height="510" x="15" y="255" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Hash</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="458" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Покупает ровную нагрузку записи (соседи растащены по шардам) — ценой range-сканов, которые теперь расходятся веером на каждый шард, ведь соседние ключи далеко друг от друга</span></foreignObject></g></g></g></g><g transform="translate(0, 1040)"><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Directory</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="418" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Покупает гибкость (переселить горячий ключ на свой шард изменением в строку) — ценой лишнего хопа и таблицы поиска, которая сама критическая инфраструктура</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="470" fill="#f59e0b" points="0,0 15,10 30,0 30,460 15,470 0,460" /><g><text width="30" height="470" x="15" y="235" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

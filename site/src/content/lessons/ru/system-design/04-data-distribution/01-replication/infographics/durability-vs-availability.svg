<svg height="471" width="1498" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1498 471"><defs /><g id="infographic-container"><g><g transform="translate(62.5, 0)"><foreignObject height="35" width="1333" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Режимы репликации: долговечность ack против доступности записи</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1458" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Две оси — переживёт ли подтверждённая запись сбой одного узла и идут ли записи, когда реплика недоступна</span></foreignObject></g></g><g transform="translate(559, 91)"><path d="M 0 170 L 340 170" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(340, 170)"><path d="M 0 0 L -5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L -5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(0, 170)"><path d="M 0 0 L 5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><path d="M 170 0 L 170 340" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(170, 0)"><path d="M 0 0 L -2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(170, 340)"><path d="M 0 0 L -2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g><g transform="translate(10, 10)"><path d="

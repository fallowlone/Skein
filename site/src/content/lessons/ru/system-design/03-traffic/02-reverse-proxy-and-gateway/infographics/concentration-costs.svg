<svg height="2033" width="1676" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1676 2033"><defs /><g id="infographic-container"><g><g transform="translate(344, 0)"><foreignObject height="35" width="948" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Что шлюз централизует — то он и концентрирует</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1636" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Один выигрыш в согласованности ценой четырёх концентрированных издержек — все на критическом пути каждого запроса</span></foreignObject></g></g><g transform="translate(668, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Единая точка отказа</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Шлюз упал или неверно настроен = все сервисы за ним недоступны, независимо от их собственного здоровья (опечатка в 2 часа ночи)</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="451" fill="#6366f1" points="0,0 15,10 30,0 30,441 15,451 0,441" /><g><text width="30" height="451" x="15" y="225.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 451)"><g><g transform="translate(135, 0)"><polygon width="30" height="630" fill="#14b8a6" points="0,0 15,10 30,0 30,620 15,630 0,620" /><g><text width="30" height="630" x="15" y="315" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Узкое место по пропускной способности</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="478" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Весь трафик плюс работа на каждый запрос — разбор токенов, поиск лимитов, TLS, агрегация — ложится на один ярус, который масштабируется впереди всех бэкендов вместе взятых</span></foreignObject></g></g></g></g><g transform="translate(0, 1081)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Налог на задержку</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="279" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Добавляет переход и CPU на каждый вызов — обычно мало, но реально, и на критическом пути всего</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="351" fill="#f59e0b" points="0,0 15,10 30,0 30,341 15,351 0,341" /><g><text width="30" height="351" x="15" y="175.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1432)"><g><g transform="translate(135, 0)"><polygon width="30" height="470" fill="#f43f5e" points="0,0 15,10 30,0 30,460 15,470 0,460" /><g><text width="30" height="470" x="15" y="235" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Затор в деплое</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="398" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Если конфиг маршрутизации каждой команды живёт в шлюзе, команда шлюза становится узким местом для релизов — организационная версия SPOF</span></foreignObject></g></g></g></g></g></g></g></svg>

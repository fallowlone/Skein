<svg height="2332" width="1609" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1609 2332"><defs /><g id="infographic-container"><g><g transform="translate(271.5, 0)"><foreignObject height="35" width="1026" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Почему блобы в базе данных ломают её — структурно</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1569" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Одно удобство (строка и байты в одной транзакции) оплачено четырьмя структурными отказами реляционного движка</span></foreignObject></g></g><g transform="translate(634.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Бэкапы и восстановления раздуваются</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="438" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждый байт каждого файла едет в бэкапе БД — схема на 5 ГБ превращается в бэкап на 5 ТБ; восстановление длится часами, а point-in-time recovery становится непрактичным</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="570" fill="#f43f5e" points="0,0 15,10 30,0 30,560 15,570 0,560" /><g><text width="30" height="570" x="15" y="285" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 570)"><g><g transform="translate(135, 0)"><polygon width="30" height="590" fill="#f59e0b" points="0,0 15,10 30,0 30,580 15,590 0,580" /><g><text width="30" height="590" x="15" y="295" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Буферный кэш отравлен</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="498" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Большие байты картинок вытесняют горячие страницы индекса и строк, держащие запросы быстрыми, — структурные запросы замедляются, потому что RAM забит байтами, прочитанными один раз</span></foreignObject></g></g></g></g><g transform="translate(0, 1160)"><g><g transform="translate(0, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Раздувание репликации и WAL</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="339" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждый insert/update шлёт блоб в поток репликации — картинка на 1 МБ становится 1 МБ write-ahead log на запись, разгоняя лаг и трафик</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="471" fill="#8b5cf6" points="0,0 15,10 30,0 30,461 15,471 0,461" /><g><text width="30" height="471" x="15" y="235.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1631)"><g><g transform="translate(135, 0)"><polygon width="30" height="570" fill="#6366f1" points="0,0 15,10 30,0 30,560 15,570 0,560" /><g><text width="30" height="570" x="15" y="285" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Истощение пула соединений</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="438" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Стриминг блоба держит драгоценное соединение БД на всю передачу — горстка одновременных скачиваний исчерпывает пул и морит голодом все прочие запросы</span></foreignObject></g></g></g></g></g></g></g></svg>

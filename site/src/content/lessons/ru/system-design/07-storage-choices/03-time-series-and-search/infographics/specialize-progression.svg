<svg height="1003" width="1663" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1663 1003"><defs /><g><g><g><foreignObject height="35" width="1623" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Честная последовательность: когда добавлять специализированное хранилище</span></foreignObject></g><g transform="translate(247.5, 43)"><foreignObject height="48" width="1128" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Не тянись за модным словом — эскалируй только когда измеренный предел вынуждает</span></foreignObject></g></g><g transform="translate(579.5, 91)"><g><g transform="translate(72, 390)"><g transform="translate(28, 0)"><foreignObject height="342" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Одно хранилище. Postgres неплохо умеет полнотекстовый поиск (tsvector) и time-series (TimescaleDB) на умеренном масштабе — намного дешевле, чем цена согласованности двух систем.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,370 16,354 16,370" /><path d="M 28 426 L 28 358 L 140 358" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 402)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Начни на основном хранилище</span></foreignObject></g></g><g transform="translate(196, 195)"><g transform="translate(28, 0)"><foreignObject height="324" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Поток метрик вытесняет OLTP-трафик, или LIKE сканирует миллионы строк и упирается в таймаут. Измеренный предел — а не модное слово — оправдывает второе хранилище.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,352 16,336 16,352" /><path d="M 28 408 L 28 340 L 140 340" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 384)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Специализируй по измеренному пределу</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="410" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Основное хранилище остаётся источником истины; поисковый / time-series движок — это read-оптимизированная проекция. Потерял её — пересобрал из основного: теряется только этот путь запроса, не данные.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,438 16,422 16,438" /><path d="M 28 494 L 28 426 L 140 426" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 470)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Считай его производным индексом</span></foreignObject></g></g></g></g></g></svg>

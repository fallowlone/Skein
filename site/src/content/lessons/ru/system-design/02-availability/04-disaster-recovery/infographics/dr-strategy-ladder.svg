<svg height="628" width="1235" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1235 628"><defs /><g><g><g transform="translate(400, 0)"><foreignObject height="35" width="395" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Лестница disaster recovery</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1195" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждая ступень держит запущенной большую часть резервного сайта, чтобы сократить RTO</span></foreignObject></g></g><g transform="translate(303.5, 91)"><g><g transform="translate(72, 243)"><g transform="translate(28, 0)"><foreignObject height="154" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Вне площадки только данные. При аварии всё строится заново. RTO часы.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,182 16,166 16,182" /><path d="M 28 238 L 28 170 L 140 170" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 214)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Backup and restore</span></foreignObject></g></g><g transform="translate(196, 162)"><g transform="translate(28, 0)"><foreignObject height="137" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Данные реплицируются вживую, compute выключен. RTO десятки минут.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,165 16,149 16,165" /><path d="M 28 221 L 28 153 L 140 153" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 197)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Pilot light</span></foreignObject></g></g><g transform="translate(320, 81)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Уменьшенная полная копия уже работает. Масштабируется при аварии. RTO минуты.</span></foreignObject></g><polygon fill="#f97316" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#f97316" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Warm standby</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Все регионы обслуживают трафик. Потеря одного — это failover. RTO около нуля.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Multi-site active-active</span></foreignObject></g></g></g></g></g></svg>

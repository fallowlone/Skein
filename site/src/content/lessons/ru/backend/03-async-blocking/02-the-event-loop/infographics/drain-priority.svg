eignObject height="120" width="211.88273265196347" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Микрозадача, осушаемая сразу после nextTick; поэтому Promise.resolve().then обгоняет setTimeout(0).</span></foreignObject></g></g><g transform="translate(420, 522.5)"><g><foreignObject height="77" width="211.88273265196347" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Макрозадачи — timers, poll (I/O), check, close</span></foreignObject></g><g transform="translate(0, 81)"><foreignObject height="120" width="211.88273265196347" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Очереди фаз; выполняются лишь когда обе очереди микрозадач пусты, по одному колбэку, без вытеснения.</span></foreignObject></g></g></g></g></g></svg>

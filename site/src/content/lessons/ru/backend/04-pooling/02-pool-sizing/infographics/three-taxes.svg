<svg height="1781" width="901" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 901 1781"><defs /><g id="infographic-container"><g><g transform="translate(157, 0)"><foreignObject height="35" width="547" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Три налога раздутого пула</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="861" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждое соединение за пределом железа тормозит все остальные</span></foreignObject></g></g><g transform="translate(280.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Переключение контекста</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="458" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">ОС нарезает 100 соединений по 8 ядрам; каждое переключение сбрасывает кеши CPU и жжёт время планировщика — коробка тратит CPU на выбор запроса, а не на его выполнение.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="570" fill="#6366f1" points="0,0 15,10 30,0 30,560 15,570 0,560" /><g><text width="30" height="570" x="15" y="285" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 570)"><g><g transform="translate(135, 0)"><polygon width="30" height="570" fill="#f59e0b" points="0,0 15,10 30,0 30,560 15,570 0,560" /><g><text width="30" height="570" x="15" y="285" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Конкуренция за блокировки и латчи</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="418" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Общие внутренние латчи — буферный пул, WAL, таблицы блокировок — конкурируют сверхлинейно, поэтому хуже растёт быстрее числа соединений.</span></foreignObject></g></g></g></g><g transform="translate(0, 1140)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Память на соединение</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="418" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">~2–3 МБ базы на backend Postgres плюс work_mem (16 МБ) на операцию на соединение — сортировка через 100 соединений может зарезервировать гигабайты.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="510" fill="#f43f5e" points="0,0 15,10 30,0 30,500 15,510 0,500" /><g><text width="30" height="510" x="15" y="255" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

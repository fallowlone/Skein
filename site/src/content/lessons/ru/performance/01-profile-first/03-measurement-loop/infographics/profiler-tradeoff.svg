<svg height="1083" width="1605" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1605 1083"><defs /><defs><filter id="vs-divider-glow-filter" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" /></filter><filter id="drop-shadow" x="-25%" y="-25%" width="200%" height="200%"><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="black" flood-opacity="0.8" /></filter></defs><g id="infographic-container"><g><g transform="translate(210.5, 0)"><foreignObject height="35" width="1144" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Эффект наблюдателя: какой профайлер возмущает меньше</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1565" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждый профайлер искажает то, что измеряет — подбирай под вопрос, держи накладные расходы ниже порога доверия 5%</span></foreignObject></g></g><g transform="translate(500, 91)"><g><g transform="translate(245, 436)"><ellipse x="0" y="0" width="100" height="100" fill="#ff9bb5" filter="url(#vs-divider-glow-filter)" opacity="0.6" cx="50" cy="50" rx="50" ry="50" /><ellipse x="0" y="0" width="100" height="100" fill="#ff356a" cx="50" cy="50" rx="50" ry="50" /><text x="50" y="50" font-size="66.66666666666667" font-weight="bold" fill="currentColor" text-anchor="middle" dominant-baseline="central" filter="url(#drop-shadow)">VS</text></g></g><g><g transform="translate(25, 20)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сэмплинг: периодический обход стеков</span></foreignObject></g><rect x="120" y="107" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 118)"><foreignObject height="80" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Снимает стек вызовов по таймеру, а не на каждом вызове</span></foreignObject></g></g><g transform="translate(25, 258)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">100 Гц добавляет 0.5-2%</span></foreignObject></g><rect x="120" y="81" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 92)"><foreignObject height="100" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ниже 5% порога доверия — безопасно гонять на живом production-трафике</span></foreignObject></g></g><g transform="translate(25, 476)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">1000 Гц доходит до 10%</span></foreignObject></g><rect x="120" y="81" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 92)"><foreignObject height="100" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Выше частота — больше разрешение, но пробивает бюджет 5%</span></foreignObject></g></g><g transform="translate(25, 714)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Лучший для production-профилирования</span></foreignObject></g><rect x="120" y="81" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 92)"><foreignObject height="120" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Находит следующее узкое место на реальном трафике за ничтожную цену</span></foreignObject></g></g><g transform="translate(365, 20)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Инструментирование: таймит каждый вызов</span></foreignObject></g><rect x="0" y="107" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 118)"><foreignObject height="100" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Оборачивает каждый вход/выход, поэтому считает вызовы точно</span></foreignObject></g></g><g transform="translate(365, 258)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">20-100% в JIT-рантаймах</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 67)"><foreignObject height="80" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Обёртка каждого вызова мешает оптимизатору инлайнить</span></foreignObject></g></g><g transform="translate(365, 476)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Точные счётчики входов/выходов</span></foreignObject></g><rect x="0" y="107" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 118)"><foreignObject height="100" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Точен там, где сэмплинг лишь оценивает — но искажает тайминги</span></foreignObject></g></g><g transform="translate(365, 714)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Лучший для плотных микробенчмарков</span></foreignObject></g><rect x="0" y="107" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 118)"><foreignObject height="120" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Применяй только где точные счётчики оправдывают тяжёлое возмущение</span></foreignObject></g></g></g></g></g></svg>

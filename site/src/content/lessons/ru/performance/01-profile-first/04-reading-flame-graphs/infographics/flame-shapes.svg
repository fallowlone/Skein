<svg height="831" width="1134" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1134 831"><defs /><g id="infographic-container"><g><g transform="translate(49, 0)"><foreignObject height="35" width="996" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Пять форм флейм-графа — читайте форму, а не имена</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1094" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Опытный глаз читает форму за секунды, до того как увеличивает масштаб на имена</span></foreignObject></g></g><g transform="translate(397, 91)"><g><g><g><g transform="translate(0, 40)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Высокая узкая колонна, один путь</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Рекурсия или глубокая цепочка middleware. Один фикс — на листе или рядом с ним.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="140" fill="#f59e0b" points="0,0 15,10 30,0 30,130 15,140 0,130" /><g><text width="30" height="140" x="15" y="70" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 140)"><g><g transform="translate(135, 0)"><polygon width="30" height="140" fill="#f43f5e" points="0,0 15,10 30,0 30,130 15,140 0,130" /><g><text width="30" height="140" x="15" y="70" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 40)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Широкое плато, много тонких листьев</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Диспетчер, раздающий работу многим хэндлерам. Чините диспетчер или общий путь над ним, а не один хэндлер.</span></foreignObject></g></g></g></g><g transform="translate(0, 280)"><g><g transform="translate(0, 40)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Две соседних широких колонны</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Два независимых горячих пути. Чините каждый отдельно; закон Амдала применяется к каждому независимо.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="140" fill="#6366f1" points="0,0 15,10 30,0 30,130 15,140 0,130" /><g><text width="30" height="140" x="15" y="70" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 420)"><g><g transform="translate(135, 0)"><polygon width="30" height="140" fill="#14b8a6" points="0,0 15,10 30,0 30,130 15,140 0,130" /><g><text width="30" height="140" x="15" y="70" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 40)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">«Вулкан», расширяющийся от листа к корню</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Работа распределена под одной точкой входа. Идите по форме туда, где реальная работа превращается в диспетчеризацию, и чините там.</span></foreignObject></g></g></g></g><g transform="translate(0, 560)"><g><g transform="translate(0, 40)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Тонкие шипы, рассыпанные по ширине</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Реального hotspot нет вовсе. Задержка off-CPU (I/O, локи, GC, сеть) — переключитесь на off-CPU или allocation-профиль.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="140" fill="#f59e0b" points="0,0 15,10 30,0 30,130 15,140 0,130" /><g><text width="30" height="140" x="15" y="70" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">05</text></g></g></g></g></g></g></g></svg>

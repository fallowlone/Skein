<svg height="2187" width="1134" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1134 2187"><defs /><g id="infographic-container"><g><g transform="translate(49, 0)"><foreignObject height="35" width="996" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Пять форм флейм-графа — читайте форму, а не имена</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1094" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Опытный глаз читает форму за секунды, до того как увеличивает масштаб на имена</span></foreignObject></g></g><g transform="translate(397, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Высокая узкая колонна, один путь</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="180" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Рекурсия или глубокая цепочка middleware. Один фикс — на листе или рядом с ним.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="292" fill="#f59e0b" points="0,0 15,10 30,0 30,282 15,292 0,282" /><g><text width="30" height="292" x="15" y="146" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 292)"><g><g transform="translate(135, 0)"><polygon width="30" height="451" fill="#f43f5e" points="0,0 15,10 30,0 30,441 15,451 0,441" /><g><text width="30" height="451" x="15" y="225.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Широкое плато, много тонких листьев</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Диспетчер, раздающий работу многим хэндлерам. Чините диспетчер или общий путь над ним, а не один хэндлер.</span></foreignObject></g></g></g></g><g transform="translate(0, 743)"><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Две соседних широких колонны</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="299" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Два независимых горячих пути. Чините каждый отдельно; закон Амдала применяется к каждому независимо.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="411" fill="#6366f1" points="0,0 15,10 30,0 30,401 15,411 0,401" /><g><text width="30" height="411" x="15" y="205.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1154)"><g><g transform="translate(135, 0)"><polygon width="30" height="491" fill="#14b8a6" points="0,0 15,10 30,0 30,481 15,491 0,481" /><g><text width="30" height="491" x="15" y="245.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">«Вулкан», расширяющийся от листа к корню</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Работа распределена под одной точкой входа. Идите по форме туда, где реальная работа превращается в диспетчеризацию, и чините там.</span></foreignObject></g></g></g></g><g transform="translate(0, 1645)"><g><g transform="translate(0, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Тонкие шипы, рассыпанные по ширине</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="279" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Реального hotspot нет вовсе. Задержка off-CPU (I/O, локи, GC, сеть) — переключитесь на off-CPU или allocation-профиль.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="411" fill="#f59e0b" points="0,0 15,10 30,0 30,401 15,411 0,401" /><g><text width="30" height="411" x="15" y="205.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">05</text></g></g></g></g></g></g></g></svg>

<svg height="3049" width="1982" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1982 3049"><defs /><g id="infographic-container"><g><g transform="translate(350, 0)"><foreignObject height="35" width="1242" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Спектр доступа к данным: четыре точки, четыре режима отказа</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1942" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Чем дальше слой уезжает от SQL, который видно глазами, тем чаще его отказы — семантические сюрпризы, выполняющиеся чисто, и тем позже их ловят</span></foreignObject></g></g><g transform="translate(821, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Сырой database/sql — не проверяется никогда</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="498" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Максимум контроля, максимум рутины. Позиционный Scan — постоянная угроза: переставьте две колонки одного типа в SELECT — и name ляжет в email без единой ошибки. Баг порчи данных, а не падение.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="650" fill="#6366f1" points="0,0 15,10 30,0 30,640 15,650 0,640" /><g><text width="30" height="650" x="15" y="325" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 650)"><g><g transform="translate(135, 0)"><polygon width="30" height="690" fill="#f59e0b" points="0,0 15,10 30,0 30,680 15,690 0,680" /><g><text width="30" height="690" x="15" y="345" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Билдеры / squirrel — проверка в рантайме</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="558" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Единственный здравый ответ для по-настоящему динамических запросов — двенадцать опциональных фильтров в админке. Но запрос существует только в рантайме, и до выполнения его ничто не валидирует.</span></foreignObject></g></g></g></g><g transform="translate(0, 1340)"><g><g transform="translate(0, 16)"><g><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Полный ORM / GORM — не проверяется, сюрпризы в рантайме</span></foreignObject></g><g transform="translate(0, 140)"><foreignObject height="577" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Максимум эргономики, максимум семантической дистанции: Updates со структурой пропускает поля с нулевыми значениями, деактивация тихо не срабатывает, а выполнившийся SQL в дифф ревьюера не попадает.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="749" fill="#8b5cf6" points="0,0 15,10 30,0 30,739 15,749 0,739" /><g><text width="30" height="749" x="15" y="374.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 2089)"><g><g transform="translate(135, 0)"><polygon width="30" height="829" fill="#14b8a6" points="0,0 15,10 30,0 30,819 15,829 0,819" /><g><text width="30" height="829" x="15" y="414.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">sqlc — проверка на этапе генерации, в CI</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="677" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Настоящие SQL-файлы на входе, типизированный Go на выходе. Неизвестные колонки, несовпадения типов и ошибки арности валят sqlc generate до ревью; сгенерированный Querier — бесплатный тестовый шов. Жёсткий предел: один статический стейтмент на запрос.</span></foreignObject></g></g></g></g></g></g></g></svg>

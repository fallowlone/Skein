<svg height="1415" width="1366" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1366 1415"><defs /><g id="infographic-container"><g><g transform="translate(321, 0)"><foreignObject height="35" width="684" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сигнальный словарь супервизора</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1326" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Четыре сигнала, четыре контракта — пропусти один, и тебя не остановить и не перезагрузить чисто</span></foreignObject></g></g><g transform="translate(513, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">SIGTERM — graceful-остановка</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="259" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Перестать принимать, дренировать незавершённое, выйти с кодом 0 в дедлайн супервизора</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="351" fill="#6366f1" points="0,0 15,10 30,0 30,341 15,351 0,341" /><g><text width="30" height="351" x="15" y="175.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 351)"><g><g transform="translate(135, 0)"><polygon width="30" height="331" fill="#14b8a6" points="0,0 15,10 30,0 30,321 15,331 0,321" /><g><text width="30" height="331" x="15" y="165.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">SIGINT — остановка интерактивно</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="199" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ctrl-C группе переднего плана; обрабатывай идентично SIGTERM</span></foreignObject></g></g></g></g><g transform="translate(0, 682)"><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;
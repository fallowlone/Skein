альные получают EEXIST</span></foreignObject></g></g><g transform="translate(720, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#14b8a61a" stroke="#14b8a6" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Риск: упавший владелец оставляет протухший lock-файл</span></foreignObject></g></g><g transform="translate(1080, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#f59e0b1a" stroke="#f59e0b" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Зачем: краш-безопасная перезапись читаемого файла</span></foreignObject></g></g><g transform="translate(1440, 270)"><rect width="300" height="40" rx="20" ry="20" fill="#f59e0b1a" stroke="#f59e0b" stroke-width="1" opacity="0.8" /><g transform="translate(20, 4)"><foreignObject height="32" width="260" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:500;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Плюс: читатель и сбой видят целиком старое или новое</span></foreignObject></g></g><g transform="translat
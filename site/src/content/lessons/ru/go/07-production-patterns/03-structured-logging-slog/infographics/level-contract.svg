3.2081004519568523e-12" transform="translate(0, 246)" /></g><g /><g><g transform="translate(257.54716981132077, 6)"><g><foreignObject height="26" width="232.45283018867923" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Error — человек обязан действовать</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="30" width="232.45283018867923" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Питает алерты и будит дежурного. Логируйте сюда ожидаемые клиентские отказы — и пейджер привыкнет, пока настоящие ошибки не утонут.</span></foreignObject></g></g><g transform="translate(311.6981132075472, 88)"><g><foreignObject height="26" width="232.4528301886793" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Warn — деградировало, но само починилось</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="30" width="232.4528301886793" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ретрай прошёл, включился fallback. Никто не просыпается; агрегатная частота — раннее предупреждение, его смотрят завтра.</span></foreignObject></g></g><g transform="translate(365.84905660377353, 170)"><g><foreignObject height="26" width="232.4528301886793" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#0ea5e9;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Info — редкие смены состояния</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="30" width="232.4528301886793" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Деплои, установленные соединения, завершённые джобы — стоит грепать потом. Если стреляет на каждый запрос — это объём, а не сигнал.</span></foreignObject></g></g><g transform="translate(420, 252)"><g><foreignObject height="26" width="232.4528301886793" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Debug — в проде выключен</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="30" width="232.4528301886793" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Включается на инцидент; считайте, что его никто не видит. Самый большой объём, самые низкие ставки.</span></foreignObject></g></g></g></g></g></svg>

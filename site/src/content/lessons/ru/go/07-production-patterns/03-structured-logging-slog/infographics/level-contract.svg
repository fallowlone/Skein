315394991,0.23347695350500697 54.421327853214805,0.05871397142026602 55.18532548656353,2.7533531010703882e-14" transform="translate(0, 825.5999999999999)" /></g><g /><g><g transform="translate(261.0561056105611, 22.099999999999994)"><g><foreignObject height="77" width="228.94389438943892" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Error — человек обязан действовать</span></foreignObject></g><g transform="translate(0, 81)"><foreignObject height="140" width="228.94389438943892" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Питает алерты и будит дежурного. Логируйте сюда ожидаемые клиентские отказы — и пейджер привыкнет, пока настоящие ошибки не утонут.</span></foreignObject></g></g><g transform="translate(314.03740374037403, 297.29999999999995)"><g><foreignObject height="128" width="228.94389438943898" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Warn — деградировало, но само починилось</span></foreignObject></g><g transform="translate(0, 132)"><foreignObject height="89" width="228.94389438943898" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ретрай прошёл, включился fallback. Никто не просыпается; агрегатная частота — раннее предупреждение, его смотрят завтра.</span></foreignObject></g></g><g transform="translate(367.018701870187, 572.5)"><g><foreignObject height="77" width="228.94389438943904" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#0ea5e9;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Info — редкие смены состояния</span></foreignObject></g><g transform="translate(0, 81)"><foreignObject height="140" width="228.94389438943904" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Деплои, установленные соединения, завершённые джобы — стоит грепать потом. Если стреляет на каждый запрос — это объём, а не сигнал.</span></foreignObject></g></g><g transform="translate(420, 847.6999999999999)"><g><foreignObject height="52" width="228.94389438943892" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Debug — в проде выключен</span></foreignObject></g><g transform="translate(0, 56)"><foreignObject height="165" width="228.94389438943892" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Включается на инцидент; считайте, что его никто не видит. Самый большой объём, самые низкие ставки.</span></foreignObject></g></g></g></g></g></svg>

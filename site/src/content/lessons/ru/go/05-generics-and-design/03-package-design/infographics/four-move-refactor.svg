<svg height="373" width="1468" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1468 373"><defs /><defs><linearGradient id="gradient-arrow-fill-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" stop-opacity="0.36" /><stop offset="100%" stop-color="#FF356A" stop-opacity="0" /></linearGradient><linearGradient id="gradient-arrow-stroke-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" /><stop offset="58%" stop-color="#FF356A" stop-opacity="0" /></linearGradient></defs><g id="infographic-container"><g><g transform="translate(188, 0)"><foreignObject height="35" width="1052" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Рефакторинг в четыре хода, который размыкает цикл</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1428" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Механическая последовательность — ничто не меняет поведение; медиана пакетов на один PR упала с 3.4 до 1.6</span></foreignObject></g></g><g transform="translate(374, 91)"><g><polygon x="207.5" y="28" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(207.5, 28)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="447.5" y="28" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(447.5, 28)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="567.5" y="108.5" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(567.5, 108.5)rotate(90 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /></g><g><g><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Распустить models</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Перенести каждую структуру в пакет, владеющий её жизненным циклом; дать потребителям узкую view-структуру, а не общий тип на 40 полей</span></foreignObject></g></g><g transform="translate(240, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Развернуть цикл</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Заменить обратный вызов интерфейсом на стороне потребителя (billing.CustomerSource); слой сборки адаптирует customer к нему</span></foreignObject></g></g><g transform="translate(480, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Распустить util</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Перенести каждую функцию к её единственному вызывающему — у 62 из 91 он был один; общие выжившие выделить в настоящие пакеты: retry, clock, money</span></foreignObject></g></g><g transform="translate(480, 161)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Огородить через internal/</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Перенести под internal/ всё, что не нужно другому сервису; следующий удобный, но неверный импорт теперь ошибка компиляции</span></foreignObject></g></g></g></g></g></svg>

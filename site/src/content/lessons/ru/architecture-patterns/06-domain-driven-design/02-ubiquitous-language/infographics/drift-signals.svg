<svg height="1662" width="1390" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1390 1662"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="1350" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Три сигнала дрейфа имён — каждый указывает на свой дефект модели</span></foreignObject></g><g transform="translate(69, 43)"><foreignObject height="48" width="1212" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Дрейф это диагностика: каждый сигнал ведёт к своему исправлению, а не к переименованию</span></foreignObject></g></g><g transform="translate(525, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Слову начинают требоваться уточнения</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="378" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Sales Order vs Billing Order — один термин, два смысла. Дефект: граница контекста не там. Исправление: разделить bounded context, а не переименовать.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="530" fill="#6366f1" points="0,0 15,10 30,0 30,520 15,530 0,520" /><g><text width="30" height="530" x="15" y="265" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 530)"><g><g transform="translate(135, 0)"><polygon width="30" height="530" fill="#14b8a6" points="0,0 15,10 30,0 30,520 15,530 0,520" /><g><text width="30" height="530" x="15" y="265" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Один концепт — разные имена по артефактам</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="378" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">ProposalDraft в коде, Quote в разговоре, pending_order в базе. Дефект: модель не совпадает с языком команды. Исправление: рефакторинг-переименование к языку.</span></foreignObject></g></g></g></g><g transform="translate(0, 1060)"><g><g transform="translate(0, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Эксперты говорят слово, которого нет в коде</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="339" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Approval escalation живёт в разговоре, но нет ни класса, ни метода, ни события. Дефект: отсутствующий концепт. Исправление: добавить его в код.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="471" fill="#f59e0b" points="0,0 15,10 30,0 30,461 15,471 0,461" /><g><text width="30" height="471" x="15" y="235.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

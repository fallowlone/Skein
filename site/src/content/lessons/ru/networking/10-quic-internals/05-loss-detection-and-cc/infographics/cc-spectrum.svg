<svg height="2332" width="1490" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1490 2332"><defs /><g id="infographic-container"><g><g transform="translate(167, 0)"><foreignObject height="35" width="1116" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Подключаемое CC покрывает весь спектр развёртывания</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1450" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Четыре алгоритма, четыре ниши — сменяемы на соединение в пользовательском пространстве, без патча ядра</span></foreignObject></g></g><g transform="translate(575, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">NewReno — безопасный дефолт</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="458" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Базовый алгоритм RFC 9002: медленный старт, аддитивное увеличение, уполовинивание cwnd при потере. Консервативный фолбэк, который обязан поддерживать каждый QUIC-стек.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="570" fill="#6366f1" points="0,0 15,10 30,0 30,560 15,570 0,560" /><g><text width="30" height="570" x="15" y="285" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 570)"><g><g transform="translate(135, 0)"><polygon width="30" height="590" fill="#14b8a6" points="0,0 15,10 30,0 30,580 15,590 0,580" /><g><text width="30" height="590" x="15" y="295" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">CUBIC — агрессивное зондирование в LAN</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="438" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Дефолт Cloudflare quiche и стандарт ядра Linux. Кубическая функция жёстко перезондирует после потери, выигрывая на путях с низким RTT и высокой пропускной способностью.</span></foreignObject></g></g></g></g><g transform="translate(0, 1160)"><g><g transform="translate(0, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">BBR — высокопроизводительный WAN</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="438" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Google YouTube и Cloudflare edge. Моделирует пропускную способность узкого места и минимальный RTT, игнорируя случайные потери, которые обрушили бы CUBIC.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="570" fill="#f59e0b" points="0,0 15,10 30,0 30,560 15,570 0,560" /><g><text width="30" height="570" x="15" y="285" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1730)"><g><g transform="translate(135, 0)"><polygon width="30" height="471" fill="#8b5cf6" points="0,0 15,10 30,0 30,461 15,471 0,461" /><g><text width="30" height="471" x="15" y="235.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">HyStart++ — ранний выход из медленного старта</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">В паре с CUBIC: обнаруживает рост очереди, чтобы выйти из медленного старта до перерегулирования, срезая потери на старте.</span></foreignObject></g></g></g></g></g></g></g></svg>

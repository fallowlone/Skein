<svg height="778" width="1015" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1015 778"><defs /><g><g><g transform="translate(40, 0)"><foreignObject height="35" width="895" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Защита от отравления кеша строится слоями</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="975" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждый слой повышает цену атаки; ни один по отдельности не достаточен</span></foreignObject></g></g><g transform="translate(193.5, 91)"><g><g transform="translate(72, 333)"><g transform="translate(28, 0)"><foreignObject height="154" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Изначальный DNS: лишь 65536 попыток подделать ответ (Камински, 2008)</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,182 16,166 16,182" /><path d="M 28 238 L 28 170 L 140 170" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 214)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">16-битный TXID + фиксированный порт</span></foreignObject></g></g><g transform="translate(196, 222)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">~65K портов x ~65K ID = ~4 млрд комбинаций для перебора</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Рандомизация source-порта (RFC 5452)</span></foreignObject></g></g><g transform="translate(320, 111)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Возвращённый регистр QNAME добавляет ~30 бит, ненаблюдаемых внешним атакующим</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">0x20-смешение регистров</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Подписанные ответы не пройдут аутентификацию; DoH/DoT убирают внешние инъекции</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">DNSSEC + зашифрованный транспорт</span></foreignObject></g></g></g></g></g></svg>

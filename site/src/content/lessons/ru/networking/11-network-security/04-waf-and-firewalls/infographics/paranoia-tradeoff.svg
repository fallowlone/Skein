t-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Внесите ложные срабатывания в белый список и подправьте веса; цель — 95% покрытия при менее 0.1% блокировок</span></foreignObject></g></g></g></g></g></svg>

<svg height="1203" width="2008" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 2008 1203"><defs /><g><g><g transform="translate(676, 0)"><foreignObject height="35" width="616" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Лестница эскалации обхода NAT</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1968" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">ICE поднимается от самого дешёвого прямого пути к гарантированному релею — каждая ступень меняет задержку на более высокий шанс соединиться</span></foreignObject></g></g><g transform="translate(752, 91)"><g><g transform="translate(72, 490)"><g transform="translate(28, 0)"><foreignObject height="342" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">STUN-сервер сообщает каждому пиру публичный IP и порт, которые ему выдал NAT. Дальше пиры пробуют прямой путь. Без релея, минимальная задержка — это желаемый путь.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,370 16,354 16,370" /><path d="M 28 426 L 28 358 L 140 358" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 402)"><foreignObject height="180" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">STUN — узнать публичный маппинг и соединиться напрямую</span></foreignObject></g></g><g transform="translate(196, 245)"><g transform="translate(28, 0)"><foreignObject height="324" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Фреймворк гоняет вместе кандидатов от STUN, прямые и релейные адреса, выбирая первую рабочую пару. Это логика, которая решает, хватило ли STUN или нужен TURN.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,352 16,336 16,352" /><path d="M 28 408 L 28 340 L 140 340" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 384)"><foreignObject height="199" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">ICE — перебирать кандидатов, пока один путь не сработает</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="376" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Если прямое соединение не вышло (symmetric NAT, CGNAT), TURN-сервер пересылает каждый пакет. Работает всегда, но добавляет задержку и стоимость сервера — запасной вариант последней надежды.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,404 16,388 16,404" /><path d="M 28 460 L 28 392 L 140 392" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 436)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">TURN — релеить весь трафик через сервер</span></foreignObject></g></g></g></g></g></svg>

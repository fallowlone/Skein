<svg height="343" width="1201" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1201 343"><defs /><g><g><g transform="translate(133.5, 0)"><foreignObject height="35" width="894" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Откуда берутся 200 мс — Лондон до Калифорнии</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1161" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Физический минимум фиксирован; код его не уменьшит. Только перенос контента ближе.</span></foreignObject></g></g><g transform="translate(286.5, 91)"><g><g transform="translate(72, 72)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">8 700 км при ~200 000 км/с в стекле — жёсткий физический предел. Никакая оптимизация не опустится ниже.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">One-way свет в оптоволокне ~43 мс</span></foreignObject></g></g><g transform="translate(196, 48)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Сигнал должен дойти и вернуться до первого байта. Всё ещё чистая физика, всё ещё непобедимо.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Round-trip только свет ~87 мс</span></foreignObject></g></g><g transform="translate(320, 24)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Реальные рукопожатия и буферизация ложатся поверх round-trip света. Именно это чувствует пользователь.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">+ TCP + TLS + очереди ~200-250 мс</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">CDN отвечает с PoP в 20 мс — в 10-20 раз быстрее, сокращая расстояние, а не сеть.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Вместо этого edge cache hit ~10-20 мс</span></foreignObject></g></g></g></g></g></svg>

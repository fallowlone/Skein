content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Нет PFS — forward secrecy опциональна и выключена по умолчанию</span></foreignObject></g><rect x="120" y="132" width="80" height="3" fill="#f43f5e" /></g><g transform="translate(365, 20)"><g><foreignObject height="180" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">key_share несёт свежий публичный ключ ECDHE, новый для каждого соединения</span></foreignObject></g><rect x="0" y="184" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 278)"><g><foreignObject height="180" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Эфемерные приватные скаляры уничтожаются после рукопожатия</span></foreignObject></g><rect x="0" y="184" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 536)"><g><foreignObject height="180" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Украденный долгосрочный ключ не расшифрует прошлые сессии</span></foreignObject></g><rect x="0" y="184" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 794)"><g
<svg height="1077" width="1544" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1544 1077"><defs /><defs><filter id="vs-divider-glow-filter" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" /></filter><filter id="drop-shadow" x="-25%" y="-25%" width="200%" height="200%"><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="black" flood-opacity="0.8" /></filter></defs><g id="infographic-container"><g><g transform="translate(384.5, 0)"><foreignObject height="35" width="735" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">HTTP/2 поверх TCP против HTTP/3 поверх QUIC</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1504" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Тот же мультиплекс, другой транспорт — компромисс между изоляцией потерь и CPU/скоростью на надёжных линиях</span></foreignObject></g></g><g transform="translate(469.5, 91)"><g><g transform="translate(245, 433)"><ellipse x="0" y="0" width="100" height="100" fill="#ff9bb5" filter="url(#vs-divider-glow-filter)" opacity="0.6" cx="50" cy="50" rx="50" ry="50" /><ellipse x="0" y="0" width="100" height="100" fill="#ff356a" cx="50" cy="50" rx="50" ry="50" /><text x="50" y="50" font-size="66.66666666666667" font-weight="bold" fill="currentColor" text-anchor="middle" dominant-baseline="central" filter="url(#drop-shadow)">VS</text></g></g><g><g transform="translate(25, 20)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Восстановление потерь per-connection</span></foreignObject></g><rect x="120" y="107" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 118)"><foreignObject height="80" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Один потерянный пакет тормозит все потоки (TCP HOL-блокировка)</span></foreignObject></g></g><g transform="translate(25, 278)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Отдельный TCP-хендшейк затем TLS</span></foreignObject></g><rect x="120" y="81" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 92)"><foreignObject height="80" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Холодная установка добавляет round-trip до TLS 1.3</span></foreignObject></g></g><g transform="translate(25, 496)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Идентифицируется по 4-tuple</span></foreignObject></g><rect x="120" y="81" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 92)"><foreignObject height="100" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Смена IP сбрасывает соединение, новый хендшейк 1–2 RTT</span></foreignObject></g></g><g transform="translate(25, 728)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Выигрывает на надёжных проводных линиях</span></foreignObject></g><rect x="120" y="107" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 118)"><foreignObject height="100" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Мало потерь, нет CPU-нагрузки userspace QUIC — быстрее east-west в датацентре</span></foreignObject></g></g><g transform="translate(365, 20)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Восстановление потерь per-stream</span></foreignObject></g><rect x="0" y="107" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 118)"><foreignObject height="120" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Повторно идут только потоки потерянного пакета; остальные текут дальше</span></foreignObject></g></g><g transform="translate(365, 278)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">TLS 1.3 встроен в хендшейк</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Холодное соединение 1 RTT; 0 RTT при resumption</span></foreignObject></g></g><g transform="translate(365, 496)"><g><foreignObject height="77" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Идентифицируется по connection ID</span></foreignObject></g><rect x="0" y="81" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 92)"><foreignObject height="120" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Переживает смену IP через миграцию соединения, без повторного хендшейка</span></foreignObject></g></g><g transform="translate(365, 728)"><g><foreignObject height="103" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Выигрывает на лоссовых и дальних путях</span></foreignObject></g><rect x="0" y="107" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 118)"><foreignObject height="100" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Мобильные и межконтинентальные — ценой CPU в userspace</span></foreignObject></g></g></g></g></g></svg>

<svg height="212" width="2568" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 2568 212"><defs /><defs><linearGradient id="gradient-arrow-fill-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" stop-opacity="0.36" /><stop offset="100%" stop-color="#FF356A" stop-opacity="0" /></linearGradient><linearGradient id="gradient-arrow-stroke-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" /><stop offset="58%" stop-color="#FF356A" stop-opacity="0" /></linearGradient></defs><g id="infographic-container"><g><g transform="translate(771.5, 0)"><foreignObject height="35" width="985" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">SameSite: меняем защиту от CSRF на межсайтовый охват</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="2528" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждый шаг вниз отправляет cookie на большее число межсайтовых запросов — больше функциональности, меньше защиты от CSRF. Lax — современное умолчание браузера, когда директива не задана.</span></foreignObject></g></g><g transform="translate(924, 91)"><g><polygon x="207.5" y="28" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(207.5, 28)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="447.5" y="28" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(447.5, 28)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /></g><g><g><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Strict — никогда межсайтово</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Cookie не отправляется ни на один межсайтовый запрос, включая переходы по ссылке. Сильнейшая защита от CSRF; может «разлогинить» пользователя, пришедшего по внешней ссылке.</span></foreignObject></g></g><g transform="translate(240, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Lax — только безопасные переходы (умолчание)</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Отправляется при безопасных межсайтовых переходах (по ссылке), но не на межсайтовый POST/PUT. Блокирует большинство CSRF, сохраняя сценарии входа по ссылке. Браузеры применяют это, когда SameSite отсутствует.</span></foreignObject></g></g><g transform="translate(480, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">None; Secure — все межсайтово</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Отправляется на каждый межсайтовый запрос, поэтому обязателен Secure. Нужен для легитимных сторонних встраиваний, но не даёт SameSite-защиты от CSRF — дополняйте CSRF-токеном.</span></foreignObject></g></g></g></g></g></svg>

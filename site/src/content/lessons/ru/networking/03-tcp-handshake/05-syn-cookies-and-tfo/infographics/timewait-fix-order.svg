<svg height="1333" width="1130" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1130 1333"><defs /><g><g><g transform="translate(46.5, 0)"><foreignObject height="35" width="997" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Лечим исчерпание TIME-WAIT — именно в таком порядке</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1090" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">EADDRNOTAVAIL на connect(): сначала временные меры, структурное исправление последним</span></foreignObject></g></g><g transform="translate(313, 91)"><g><g transform="translate(72, 555)"><g transform="translate(28, 0)"><foreignObject height="427" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Переиспользует запись TIME-WAIT для нового исходящего соединения только когда Timestamps доказывают, что SYN новее (RFC 6191). Риска порчи данных нет. Никогда tcp_tw_recycle — удалён в 4.12 за поломку NAT.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,455 16,439 16,455" /><path d="M 28 511 L 28 443 L 140 443" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 487)"><foreignObject height="160" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">tcp_tw_reuse=1 — безопасное переиспользование по timestamp</span></foreignObject></g></g><g transform="translate(196, 277.5)"><g transform="translate(28, 0)"><foreignObject height="342" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Дефолтные ~28k эфемерных портов (32768-60999) становятся ~64k. Даёт запас против времени жизни TIME-WAIT ~120s (2xMSL), но не прекращает тратить four-tuple на каждый запрос.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,370 16,354 16,370" /><path d="M 28 426 L 28 358 L 140 358" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 402)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Расширить ip_local_port_range до 1024 65535</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="410" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Каждое соединение к апстриму обслуживает много запросов, и балансировщик перестаёт открывать новый four-tuple на каждый запрос. TIME-WAIT перестаёт накапливаться, и проблема исчезает полностью.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,438 16,422 16,438" /><path d="M 28 494 L 28 426 L 140 426" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 470)"><foreignObject height="160" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Пул соединений с keep-alive — настоящее исправление</span></foreignObject></g></g></g></g></g></svg>

<svg height="800" width="1035" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1035 800"><defs /><defs><linearGradient id="gradient-timeline-line" x1="90" y1="84" x2="90" y2="600" gradientUnits="userSpaceOnUse"><stop offset="-1.1627906976744187%" stop-color="#6366f1" /><stop offset="32.945736434108525%" stop-color="#14b8a6" /><stop offset="67.05426356589147%" stop-color="#f59e0b" /><stop offset="101.16279069767442%" stop-color="#10b981" /></linearGradient></defs><g id="infographic-container"><g><g><foreignObject height="35" width="995" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Граница дебаунса: докажите контракт на 799 / 800 мс</span></foreignObject></g><g transform="translate(53, 43)"><foreignObject height="48" width="889" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Паттерн 799-затем-1 фиксирует: один раз, ровно в дедлайн, не раньше</span></foreignObject></g></g><g transform="translate(337.5, 91)"><g><path d="M 90 84 L 90 600" stroke="url(#gradient-timeline-line)" stroke-width="2" width="1" height="516" /><ellipse x="84" y="72" width="12" height="12" fill="#6366f1" cx="90" cy="78" rx="6" ry="6" /><ellipse x="84" y="248" width="12" height="12" fill="#14b8a6" cx="90" cy="254" rx="6" ry="6" /><ellipse x="84" y="424" width="12" height="12" fill="#f59e0b" cx="90" cy="430" rx="6" ry="6" /><ellipse x="84" y="600" width="12" height="12" fill="#10b981" cx="90" cy="606" rx="6" ry="6" /></g><g><g
ex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Файловые инпуты всегда uncontrolled — код не может задать их значение</span></foreignObject></g></g></g></g></g></svg>

<svg height="343" width="1609" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1609 343"><defs /><g><g><g transform="translate(185.5, 0)"><foreignObject height="35" width="1198" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Задержка водопада: каждый уровень дерева добавляет круг</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1569" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Дети запрашивают при монтировании, и независимые запросы сериализуются вниз по дереву — пока вы их не поднимете</span></foreignObject></g></g><g transform="translate(490.5, 91)"><g><g transform="translate(72, 72)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">ProfilePage монтируется и запрашивает пользователя — первый круг в 200 мс.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Запрос пользователя · 0–200 мс</span></foreignObject></g></g><g transform="translate(196, 48)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Posts монтируется только после коммита пользователя, поэтому его запрос стартует на круг позже.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Запрос постов · 200–400 мс</span></foreignObject></g></g><g transform="translate(320, 24)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Comments монтируется только после коммита постов — три серийных хопа, 600 мс до серверной работы.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Запрос комментариев · 400–600 мс</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Выпустить независимые запросы вместе из верхнего компонента — один круг, ~3× быстрее.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,88 16,72 16,88" /><path d="M 28 144 L 28 76 L 140 76" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 120)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Подъём + Promise.all · ~200 мс</span></foreignObject></g></g></g></g></g></svg>

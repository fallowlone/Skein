<svg height="1488" width="865" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 865 1488"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="825" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Классы серьёзности ошибок в корне React 19</span></foreignObject></g></g><g transform="translate(262.5, 35)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onUncaughtError — класс «белый экран»</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ни одна граница не поймала ошибку; дерево размонтировалось, пользователь увидел поломку. Поднимайте алерт сразу.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="431" fill="#f43f5e" points="0,0 15,10 30,0 30,421 15,431 0,421" /><g><text width="30" height="431" x="15" y="215.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 431)"><g><g transform="translate(135, 0)"><polygon width="30" height="451" fill="#f59e0b" points="0,0 15,10 30,0 30,441 15,451 0,441" /><g><text width="30" height="451" x="15" y="225.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onCaughtError — обработанный класс</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="339" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Граница отрисовала запасной UI; страница осталась рабочей. Следите за частотой, не алертите на единичные события.</span></foreignObject></g></g></g></g><g transform="translate(0, 882)"><g><g transform="translate(0, 16)"><g><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onRecoverableError — самовосстановившийся класс</span></foreignObject></g><g transform="translate(0, 140)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">React восстановился сам; сюда попадают рассинхроны гидратации, пользователь ничего не заметил. Заведите метрику с бюджетом, без алертов.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="531" fill="#14b8a6" points="0,0 15,10 30,0 30,521 15,531 0,521" /><g><text width="30" height="531" x="15" y="265.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

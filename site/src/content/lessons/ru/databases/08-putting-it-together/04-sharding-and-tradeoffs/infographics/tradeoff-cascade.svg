<svg height="1347" width="1782" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1782 1347"><defs /><g><g><g transform="translate(517, 0)"><foreignObject height="35" width="708" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Семиуровневый каскад трейдоффов</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1742" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждый акт открывает следующий только если предыдущий в порядке — пропусти один, и платишь за него в каждом последующем акте</span></foreignObject></g></g><g transform="translate(391, 91)"><g><g transform="translate(72, 843)"><g transform="translate(28, 0)"><foreignObject height="273" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Неверные ключи здесь отравляют шардинг: пропусти — и Акты 2–7 воюют с неэффективными join-ами и изменяемыми натуральными ключами.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,301 16,285 16,301" /><path d="M 28 357 L 28 289 L 140 289" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 333)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Акт 1 — Схема</span></foreignObject></g></g><g transform="translate(196, 702.5)"><g transform="translate(28, 0)"><foreignObject height="222" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Без индексов планировщик слеп: статистика Акта 3 бесполезна, когда не из чего выбирать.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,250 16,234 16,250" /><path d="M 28 306 L 28 238 L 140 238" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 282)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Акт 2 — Индексы</span></foreignObject></g></g><g transform="translate(320, 562)"><g transform="translate(28, 0)"><foreignObject height="256" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Пропусти статистику — и vacuum единственный рычаг; таблицы раздуваются, пока ты угадываешь кардинальность.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,284 16,268 16,284" /><path d="M 28 340 L 28 272 L 140 272" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 316)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Акт 3 — Статистика</span></foreignObject></g></g><g transform="translate(444, 421.5)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Мёртвые tuples раздувают heap pages; потоки пула Акта 5 видят более медленные table scans.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Акт 4 — Контроль bloat</span></foreignObject></g></g><g transform="translate(568, 281)"><g transform="translate(28, 0)"><foreignObject height="154" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Connection storms душат миграции Акта 6; backlog handshakes блокирует получение блокировок.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,182 16,166 16,182" /><path d="M 28 238 L 28 170 L 140 170" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 214)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Акт 5 — Размер пула</span></foreignObject></g></g><g transform="translate(692, 140.5)"><g transform="translate(28, 0)"><foreignObject height="222" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Без expand-contract Акт 7 невозможен без downtime — каждый rebalance требует эксклюзивной блокировки.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,250 16,234 16,250" /><path d="M 28 306 L 28 238 L 140 238" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 282)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Акт 6 — Безопасные миграции</span></foreignObject></g></g><g transform="translate(816, 0)"><g transform="translate(28, 0)"><foreignObject height="256" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Шарди только когда пределы одного узла измерены; пропусти — и один tenant доминирует, пока остальные ждут в очереди.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,284 16,268 16,284" /><path d="M 28 340 L 28 272 L 140 272" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 316)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Акт 7 — Шардинг</span></foreignObject></g></g></g></g></g></svg>

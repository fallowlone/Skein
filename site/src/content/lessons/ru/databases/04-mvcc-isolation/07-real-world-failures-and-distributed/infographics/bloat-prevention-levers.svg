<svg height="1125" width="1066" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1066 1125"><defs /><g id="infographic-container"><g><g transform="translate(58.5, 0)"><foreignObject height="35" width="909" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Три независимых рычага против bloat от oldest-xmin</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1026" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждый нейтрализует свой способ, которым запрос пинит глобальный oldest-xmin</span></foreignObject></g></g><g transform="translate(363, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">idle_in_transaction_session_timeout = 5–15 мин</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">На primary: убивает забытые открытые транзакции, пока их backend_xmin не запинил bloat</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="331" fill="#6366f1" points="0,0 15,10 30,0 30,321 15,331 0,321" /><g><text width="30" height="331" x="15" y="165.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 331)"><g><g transform="translate(135, 0)"><polygon width="30" height="391" fill="#14b8a6" points="0,0 15,10 30,0 30,381 15,391 0,381" /><g><text width="30" height="391" x="15" y="195.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">hot_standby_feedback = off</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="299" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">На аналитических репликах: реплика перестаёт слать свой xmin назад, и autovacuum primary больше не удерживается</span></foreignObject></g></g></g></g><g transform="translate(0, 722)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Алерты на лаг replication slot</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="180" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ловят orphan slot, чей столбец xmin пинит oldest-xmin publisher без активной сессии</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="272" fill="#f59e0b" points="0,0 15,10 30,0 30,262 15,272 0,262" /><g><text width="30" height="272" x="15" y="136" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

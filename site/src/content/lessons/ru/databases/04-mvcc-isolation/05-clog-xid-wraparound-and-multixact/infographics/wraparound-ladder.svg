<svg height="990.5" width="1365" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1365 990.5"><defs /><g><g><g transform="translate(116, 0)"><foreignObject height="35" width="1093" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Лестница возраста id транзакций к стене в 2 миллиарда</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1325" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Один конечный 32-битный бюджет — верхнюю ступень Postgres навязывает сам, отказывая в подключениях</span></foreignObject></g></g><g transform="translate(368.5, 91)"><g><g transform="translate(72, 460.5)"><g transform="translate(28, 0)"><foreignObject height="239" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Кортежи старше этого порога получают t_xmin = FrozenTransactionId. Заморозка против wraparound идёт даже при autovacuum = off.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,267 16,251 16,267" /><path d="M 28 323 L 28 255 L 140 255" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 299)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">200M — VACUUM замораживает (autovacuum_freeze_max_age)</span></foreignObject></g></g><g transform="translate(196, 307)"><g transform="translate(28, 0)"><foreignObject height="307" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Первый операционный порог. Заморозка отстаёт; разбирайтесь с пропускной способностью autovacuum, пока проблема не нарастёт.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,335 16,319 16,335" /><path d="M 28 391 L 28 323 L 140 323" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 367)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">1B — алерт на age(datfrozenxid)</span></foreignObject></g></g><g transform="translate(320, 153.5)"><g transform="translate(28, 0)"><foreignObject height="256" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Запас тонкий. При таком темпе есть риск дойти до стены отключения; эскалируйте и рассмотрите ручную заморозку.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,284 16,268 16,284" /><path d="M 28 340 L 28 272 L 140 272" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 316)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">1.5B — будите дежурного</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="239" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">«database is not accepting commands to avoid wraparound data loss» — только аварийная заморозка в однопользовательском режиме. Sentry, 2017.</span></foreignObject></g><polygon fill="#8b5cf6" opacity="0.9" width="16" height="16" points="0,267 16,251 16,267" /><path d="M 28 323 L 28 255 L 140 255" stroke="#8b5cf6" stroke-width="8" fill="none" /><g transform="translate(32, 299)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">~2B — Postgres отклоняет команды</span></foreignObject></g></g></g></g></g></svg>

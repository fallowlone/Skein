<svg height="471" width="1852" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1852 471"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="1812" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Четыре способа стабилизировать планы между деплоями — по умолчанию верен только один</span></foreignObject></g><g transform="translate(13, 43)"><foreignObject height="48" width="1786" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Одна ось: оставить планировщик адаптивным или жёстко зафиксировать. Чем сильнее фиксируем, тем хуже это как выбор по умолчанию.</span></foreignObject></g></g><g transform="translate(736, 91)"><path d="M 0 170 L 340 170" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(340, 170)"><path d="M 0 0 L -5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L -5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(0, 170)"><path d="M 0 0 L 5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><path d="M 170 0 L 170 340" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(170, 0)"><path d="M 0 0 L -2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(170, 340)"><path d="M 0 0 L -2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g><g transform="translate(10, 10)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 150
  L 16 150
  Q 0 150 0 134
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#10b981" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сначала статистика — продакшен по умолчанию</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Верно для ~90% случаев. ANALYZE в каждом хуке деплоя, CREATE STATISTICS для коррелированных колонок, алерты auto_explain. Свежая статистика держит планировщик правильным по мере роста данных — адаптивность сохранена.</span></foreignObject></g></g><g transform="translate(180, 10)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 134
  Q 150 150 134 150
  L 0 150
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#f59e0b" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Пиннинг через pg_hint_plan — крайняя мера</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Верно лишь для 1-3 критичных к стабильности запросов (фиксированный SLA, финансовые отчёты). Фиксирует форму плана; меняет адаптивность на предсказуемость — завтрашние данные сделают сегодняшнюю подсказку неверной.</span></foreignObject></g></g><g transform="translate(10, 180)"><path d="
  M 0 0
  L 150 0
  L 150 134
  Q 150 150 134 150
  L 16 150
  Q 0 150 0 134
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#6366f1" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Отключить переупорядочивание join — кувалда-блокировка</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">join_collapse_limit = 1 заставляет соблюдать порядок JOIN из запроса. Полезно для вручную настроенных аналитических запросов, но глобально это кувалда; применяйте по роли, не на всю БД, иначе крупные OLTP-джойны упустят оптимальный порядок.</span></foreignObject></g></g><g transform="translate(180, 180)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 134
  Q 150 150 134 150
  L 16 150
  Q 0 150 0 134
  L 0 0
  L 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#f43f5e" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Внешний кэш планов + свой исполнитель — неверный выбор</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Встречается только при экстремальном масштабировании. Переизобретение кэширования планов вне Postgres добавляет операционную сложность, ломает инструменты и плохо стареет. Только когда нативного механизма не хватает — что бывает редко.</span></foreignObject></g></g></g></g></g></svg>

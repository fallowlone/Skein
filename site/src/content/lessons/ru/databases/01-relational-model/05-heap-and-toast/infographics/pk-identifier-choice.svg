<svg height="3486" width="1349" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1349 3486"><defs /><g id="infographic-container"><g><g transform="translate(24, 0)"><foreignObject height="35" width="1261" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Идентификатор primary key: байты против локальности B-tree индекса</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1309" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">PK зафиксирован на весь срок жизни таблицы — выбирайте сначала по локальности, потом по байтам</span></foreignObject></g></g><g transform="translate(504.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">BIGSERIAL — 8 байт, последовательный</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="876" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Auto-incremented целое. Лучшая локальность B-tree — новые строки добавляются на крайнюю правую страницу, минимум фрагментации. Наименьшая запись индекса. Правильный дефолт для single-region сервисов; единственное ограничение — центральная последовательность ломается при multi-region распределённых вставках.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="988" fill="#14b8a6" points="0,0 15,10 30,0 30,978 15,988 0,978" /><g><text width="30" height="988" x="15" y="494" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 988)"><g><g transform="translate(135, 0)"><polygon width="30" height="928" fill="#6366f1" points="0,0 15,10 30,0 30,918 15,928 0,918" /><g><text width="30" height="928" x="15" y="464" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">UUIDv7 — 16 байт, упорядоченный по времени</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="776" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">48-битный миллисекундный временной префикс делает значения монотонно возрастающими, поэтому локальность B-tree почти как у BIGSERIAL. Удваивает запись индекса до 16 байт, но даёт глобальную уникальность без центральной последовательности. Современный дефолт когда нужен UUID.</span></foreignObject></g></g></g></g><g transform="translate(0, 1916)"><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">UUIDv4 — 16 байт, случайный</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="717" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Глобально уникален, но каждая вставка попадает на случайную страницу B-tree, вызывая разбиения и раздутие — индекс может достичь 3-5x размера индекса с последовательными ключами свыше ~10M строк. Только если уникальность нужна сегодня и UUIDv7 недоступен.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="829" fill="#f43f5e" points="0,0 15,10 30,0 30,819 15,829 0,819" /><g><text width="30" height="829" x="15" y="414.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 2745)"><g><g transform="translate(135, 0)"><polygon width="30" height="610" fill="#f59e0b" points="0,0 15,10 30,0 30,600 15,610 0,600" /><g><text width="30" height="610" x="15" y="305" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">ULID — 26 байт, хранится как TEXT</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="498" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Упорядочен по времени и глобально уникален как UUIDv7, но у Postgres нет нативного типа ULID — хранится как TEXT в 26 байт без нативных операторов. В Postgres-окружении предпочтительнее UUIDv7.</span></foreignObject></g></g></g></g></g></g></g></svg>

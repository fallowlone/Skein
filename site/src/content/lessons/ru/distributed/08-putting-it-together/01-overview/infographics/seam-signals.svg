<svg height="2293" width="1853" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1853 2293"><defs /><g id="infographic-container"><g><g transform="translate(323, 0)"><foreignObject height="35" width="1167" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Веди систему по сигналам швов, а не по зелёным дашбордам</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1813" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Дашборд каждого сервиса может оставаться зелёным, пока пайплайн молча подводит клиентов — эти четыре сигнала живут между слоями</span></foreignObject></g></g><g transform="translate(756.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Consumer lag (отставание консьюмера)</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="478" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Насколько отстали консьюмеры событий саги. Растущий lag значит, что пайплайн отстаёт от продюсеров; саги застревают на полпути, а компенсации в полёте копятся.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="610" fill="#6366f1" points="0,0 15,10 30,0 30,600 15,610 0,600" /><g><text width="30" height="610" x="15" y="305" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 610)"><g><g transform="translate(135, 0)"><polygon width="30" height="431" fill="#14b8a6" points="0,0 15,10 30,0 30,421 15,431 0,421" /><g><text width="30" height="431" x="15" y="215.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Latency кворумной записи/чтения</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="299" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">p99 записи W=2. Медленная третья реплика тянет хвостовую latency, даже когда ни одна нода технически не упала.</span></foreignObject></g></g></g></g><g transform="translate(0, 1041)"><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Leader churn (частота смены лидера)</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="339" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Выборы в минуту. Частые перевыборы значат, что fencing-токены постоянно растут — ты в одной паузе от попытки split-brain записи.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="451" fill="#f59e0b" points="0,0 15,10 30,0 30,441 15,451 0,441" /><g><text width="30" height="451" x="15" y="225.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1492)"><g><g transform="translate(135, 0)"><polygon width="30" height="670" fill="#f43f5e" points="0,0 15,10 30,0 30,660 15,670 0,660" /><g><text width="30" height="670" x="15" y="335" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Исчерпание бюджета ретраев</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="558" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Процент потреблённого бюджета. Около 100% ретраи отбрасываются и выходят наружу как видимые пользователю ошибки, хотя каждый сервис вниз здоров. Бюджеты ограничивают ретраи ~10% сверх обычного rate запросов.</span></foreignObject></g></g></g></g></g></g></g></svg>

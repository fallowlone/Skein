<svg height="2054" width="956" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 956 2054"><defs /><g id="infographic-container"><g><g transform="translate(116.5, 0)"><foreignObject height="35" width="683" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Где exactly-once на самом деле ломался</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="916" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Четыре реальных инцидента — ни один не отказал в гарантии брокера</span></foreignObject></g></g><g transform="translate(308, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Stripe 2020 — код консьюмера</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="418" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Консьюмер очереди терял Idempotency-Key при ретрае; клиентов списывали дважды. Брокер доставлял корректно; неидемпотентным был консьюмер.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="530" fill="#f43f5e" points="0,0 15,10 30,0 30,520 15,530 0,520" /><g><text width="30" height="530" x="15" y="265" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 530)"><g><g transform="translate(135, 0)"><polygon width="30" height="491" fill="#f59e0b" points="0,0 15,10 30,0 30,481 15,491 0,481" /><g><text width="30" height="491" x="15" y="245.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">AWS SQS 2019 — гонка на стороне консьюмера</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">ChangeMessageVisibility конкурировал с незавершённым DeleteMessage, вызывая переотправку. Дубль протёк через контракт visibility-timeout, а не через брокер.</span></foreignObject></g></g></g></g><g transform="translate(0, 1021)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Slack 2022 — зомби-продюсер</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Rolling restart оставил сессии продюсера без fencing; Kafka EOS слал дубли 6 минут. Отказало состояние координации, а не обещание доставки.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="451" fill="#8b5cf6" points="0,0 15,10 30,0 30,441 15,451 0,441" /><g><text width="30" height="451" x="15" y="225.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1472)"><g><g transform="translate(135, 0)"><polygon width="30" height="451" fill="#6366f1" points="0,0 15,10 30,0 30,441 15,451 0,441" /><g><text width="30" height="451" x="15" y="225.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Stripe 2023 — операционная процедура</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Redrive 1M-сообщений DLQ без throttling затопил пул консьюмеров и задушил платёжный API. Сбой вызвал runbook, а не брокер.</span></foreignObject></g></g></g></g></g></g></g></svg>

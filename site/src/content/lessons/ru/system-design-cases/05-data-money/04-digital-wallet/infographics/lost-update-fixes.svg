<svg height="2061" width="1624" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1624 2061"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="1584" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Три способа победить потерянное обновление — выбор по профилю конкуренции</span></foreignObject></g><g transform="translate(70, 43)"><foreignObject height="48" width="1444" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Все три закрывают разрыв «прочитал устаревшее — записал»; различие в том, как ведёт себя горячий кошелёк</span></foreignObject></g></g><g transform="translate(642, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Пессимистичная блокировка — SELECT … FOR UPDATE</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="458" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Блокируем строку кошелька до чтения, поэтому второе списание ждёт и читает свежий баланс. Просто и абсолютно корректно, но горячий кошелёк вырождается в очередь.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="610" fill="#6366f1" points="0,0 15,10 30,0 30,600 15,610 0,600" /><g><text width="30" height="610" x="15" y="305" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 610)"><g><g transform="translate(135, 0)"><polygon width="30" height="670" fill="#14b8a6" points="0,0 15,10 30,0 30,660 15,670 0,660" /><g><text width="30" height="670" x="15" y="335" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Оптимистичная / CAS — проверка версии</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="538" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Читаем баланс + версию, пишем только если версия не изменилась (WHERE id=? AND version=?); при конфликте обновляется 0 строк и идёт повтор. Отлично при редкой конкуренции, лавина повторов при высокой.</span></foreignObject></g></g></g></g><g transform="translate(0, 1280)"><g><g transform="translate(0, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Атомарная условная запись — один оператор</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="498" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Переносим проверку-и-вычитание в одну операцию: UPDATE … SET balance = balance - 70 WHERE balance &gt;= 70. Гонки read-modify-write нет; ноль строк — недостаточно средств. Самое чистое списание для одного кошелька.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="650" fill="#f59e0b" points="0,0 15,10 30,0 30,640 15,650 0,640" /><g><text width="30" height="650" x="15" y="325" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

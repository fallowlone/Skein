<svg height="1583" width="1123" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1123 1583"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="1083" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ручка кворума (N=3): одно хранилище, три рабочие точки</span></foreignObject></g><g transform="translate(75.5, 43)"><foreignObject height="48" width="932" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">R + W &gt; N заставляет множество чтения пересечься с множеством записи</span></foreignObject></g></g><g transform="translate(391.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">W=2, R=2 — сбалансированный выбор по умолчанию</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="339" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Оба кворума требуют 2 из 3 узлов; чтение всегда видит последнюю подтверждённую запись — обычная универсальная настройка</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="491" fill="#6366f1" points="0,0 15,10 30,0 30,481 15,491 0,481" /><g><text width="30" height="491" x="15" y="245.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 491)"><g><g transform="translate(135, 0)"><polygon width="30" height="451" fill="#14b8a6" points="0,0 15,10 30,0 30,441 15,451 0,441" /><g><text width="30" height="451" x="15" y="225.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">W=1, R=3 — быстрые записи</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Запись подтверждает один узел, поэтому put переживает отказ, пока жив хотя бы один узел; за это чтение опрашивает все 3 реплики</span></foreignObject></g></g></g></g><g transform="translate(0, 942)"><g><g transform="translate(0, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">W=3, R=1 — надёжные записи, быстрые чтения</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="378" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Подтвердить должны все реплики, поэтому чтению хватает 1 узла; но запись падает или зависает, как только отказывает любой узел</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="510" fill="#f59e0b" points="0,0 15,10 30,0 30,500 15,510 0,500" /><g><text width="30" height="510" x="15" y="255" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

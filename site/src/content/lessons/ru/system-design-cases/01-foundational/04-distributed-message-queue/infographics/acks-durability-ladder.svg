<svg height="621" width="1089" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1089 621"><defs /><g><g><g transform="translate(276.5, 0)"><foreignObject height="35" width="496" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Лестница надёжности acks</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1049" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Каждая ступень меняет скорость на более сильную гарантию от потери данных</span></foreignObject></g></g><g transform="translate(292.5, 91)"><g><g transform="translate(72, 199)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Самый быстрый; продюсер не ждёт. Сбой теряет сообщение — нет надёжности.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">acks=0 — отправил и забыл</span></foreignObject></g></g><g transform="translate(196, 99.5)"><g transform="translate(28, 0)"><foreignObject height="188" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Лидер подтверждает до репликации. Теряет данные, если лидер падает первым.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,216 16,200 16,216" /><path d="M 28 272 L 28 204 L 140 204" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 248)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">acks=1 — подтверждение только лидером</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="205" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Каждая синхронная реплика должна получить сообщение. Переживает отказ лидера без потерь.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,233 16,217 16,233" /><path d="M 28 289 L 28 221 L 140 221" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 265)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">acks=all — подтверждение всем ISR</span></foreignObject></g></g></g></g></g></svg>

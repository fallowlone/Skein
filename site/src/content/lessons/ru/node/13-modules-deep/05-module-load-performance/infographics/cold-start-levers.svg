<svg height="3506" width="1469" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1469 3506"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="1429" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Четыре рычага холодного старта, от дешёвого — каждый режет свою фазу</span></foreignObject></g><g transform="translate(35, 43)"><foreignObject height="48" width="1359" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сначала профилируй, потом подбери рычаг к доминирующей фазе; возьмёшь не тот — не получишь ничего</span></foreignObject></g></g><g transform="translate(564.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Ленивый require — пропустить редкую зависимость</span></foreignObject></g><g transform="translate(0, 140)"><foreignObject height="816" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Делай require() тяжёлой зависимости внутри функции, что её использует, чтобы путь, который большинство вызовов не берут, не грузил ничего при старте. Подвох — откладывает, не убирает: зависимость на общем пути всё равно платит то же разрешение + компиляцию, просто на первом вызове.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="988" fill="#6366f1" points="0,0 15,10 30,0 30,978 15,988 0,978" /><g><text width="30" height="988" x="15" y="494" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 988)"><g><g transform="translate(135, 0)"><polygon width="30" height="709" fill="#14b8a6" points="0,0 15,10 30,0 30,699 15,709 0,699" /><g><text width="30" height="709" x="15" y="354.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Сборка (esbuild / ncc) — убить I/O разрешения</span></foreignObject></g><g transform="translate(0, 100)"><foreignObject height="577" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Встраивает весь граф в один файл, так что загрузчик делает один stat()+read() вместо десятков тысяч — Lambda упала с ~3 с до менее 1 с. Подвох — не помогает eval, и нужен tree-shaking мёртвых зависимостей, чтобы удержать выигрыш.</span></foreignObject></g></g></g></g><g transform="translate(0, 1697)"><g><g transform="translate(0, 16)"><g><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">NODE_COMPILE_CACHE — переиспользовать тёплый байткод</span></foreignObject></g><g transform="translate(0, 140)"><foreignObject height="717" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сериализует байткод V8 по ключу исходника, так что тёплые загрузки пропускают парсинг+компиляцию — доля компиляции в 20-40% может упасть на порядок. Подвох — первый прогон платит полную цену за наполнение, а serverless нужен постоянный каталог кэша, не /tmp.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="889" fill="#f59e0b" points="0,0 15,10 30,0 30,879 15,889 0,879" /><g><text width="30" height="889" x="15" y="444.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 2586)"><g><g transform="translate(135, 0)"><polygon width="30" height="789" fill="#f43f5e" points="0,0 15,10 30,0 30,779 15,789 0,779" /><g><text width="30" height="789" x="15" y="394.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Снапшот старта — заморозить кучу после init</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="637" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">--build-snapshot прогоняет init один раз и захватывает кучу V8; --snapshot-blob восстанавливает её мгновенно, полностью пропуская eval. Подвох — никаких открытых дескрипторов на момент снапшота, экспериментальный API, и блоб привязан к точной версии Node.</span></foreignObject></g></g></g></g></g></g></g></svg>

<svg height="1231" width="1515" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1515 1231"><defs /><g><g><g><foreignObject height="35" width="1475" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Лестница стоимости инструментирования — берите самое дешёвое первым</span></foreignObject></g><g transform="translate(197, 43)"><foreignObject height="48" width="1081" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Накладные расходы CPU на операцию растут: pub/sub → контекст запроса → сырые хуки</span></foreignObject></g></g><g transform="translate(505.5, 91)"><g><g transform="translate(72, 504)"><g transform="translate(28, 0)"><foreignObject height="376" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Внутрипроцессный pub/sub; проверка hasSubscribers делает публикацию без подписчиков практически бесплатной, поэтому она остаётся в горячих путях. Берите его первым.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,404 16,388 16,404" /><path d="M 28 460 L 28 392 L 140 392" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 436)"><foreignObject height="160" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">diagnostics_channel — почти бесплатно без подписчиков</span></foreignObject></g></g><g transform="translate(196, 252)"><g transform="translate(28, 0)"><foreignObject height="290" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Хранилище в области запроса, переживает await и колбэки; хорошо оптимизированный потребитель async_hooks. Держите хранилище маленьким — id и флаги.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,318 16,302 16,318" /><path d="M 28 374 L 28 306 L 140 306" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 350)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">AsyncLocalStorage — однозначные % CPU</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="324" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">init/before/after/destroy срабатывает на каждом таймере, сокете и промисе. Спускайтесь к нему только ради трекинга, который иначе не получить — и измеряйте.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,352 16,336 16,352" /><path d="M 28 408 L 28 340 L 140 340" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 384)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">сырой async_hooks — двузначные % CPU</span></foreignObject></g></g></g></g></g></svg>

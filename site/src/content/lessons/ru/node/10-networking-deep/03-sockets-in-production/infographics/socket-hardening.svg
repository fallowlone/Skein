<svg height="5330" width="1365" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1365 5330"><defs /><g id="infographic-container"><g><g transform="translate(122, 0)"><foreignObject height="35" width="1081" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Пять продакшн-сбоев сокетов, пять осознанных защит</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1325" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Сбои сокетов предсказуемы, не случайны: каждый режим отказа отвечает одной осознанной защите.</span></foreignObject></g></g><g transform="translate(512.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="160" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Idle или half-open сокеты текут файловыми дескрипторами</span></foreignObject></g><g transform="translate(0, 160)"><foreignObject height="836" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Подключившийся-и-замолчавший клиент — упавший без чистого закрытия или half-open соединение, чей FIN не пришёл — держит fd вечно: нет падения, нет CPU, нет роста памяти, лишь медленное накопление, пока не упрёшься в ulimit -n и accept() не откажет. Фикс — socket.setTimeout(ms) эмитит 'timeout', затем ТЫ зовёшь socket.destroy(), чтобы вернуть дескриптор.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="1028" fill="#f43f5e" points="0,0 15,10 30,0 30,1018 15,1028 0,1018" /><g><text width="30" height="1028" x="15" y="514" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 1028)"><g><g transform="translate(135, 0)"><polygon width="30" height="948" fill="#f59e0b" points="0,0 15,10 30,0 30,938 15,948 0,938" /><g><text width="30" height="948" x="15" y="474" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Slowloris капает байты, чтобы копить соединения</span></foreignObject></g><g transform="translate(0, 140)"><foreignObject height="776" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Атакующий открывает много соединений и шлёт байты чуть под любым наивным idle-таймаутом, исчерпывая ёмкость соединений почти без трафика. Фикс — HTTP headersTimeout и requestTimeout ограничивают общее время на отправку заголовков и запроса, а не только idle-промежуток между чтениями.</span></foreignObject></g></g></g></g><g transform="translate(0, 1976)"><g><g transform="translate(0, 16)"><g><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Необработанные ECONNRESET / EPIPE роняют весь процесс</span></foreignObject></g><g transform="translate(0, 140)"><foreignObject height="1015" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Оба всплывают как события 'error' сокета — ECONNRESET это RST пира (резкое закрытие), EPIPE это запись в уже закрытый сокет — и одно необработанное 'error' кидает исключение и убивает вместе с ним каждое другое соединение в полёте. Фикс — каждому сокету, принятому сервером и открытому клиентом, нужен слушатель 'error', что логирует-и-очищает вместо переброса.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="1187" fill="#6366f1" points="0,0 15,10 30,0 30,1177 15,1187 0,1177" /><g><text width="30" height="1187" x="15" y="593.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 3163)"><g><g transform="translate(135, 0)"><polygon width="30" height="968" fill="#14b8a6" points="0,0 15,10 30,0 30,958 15,968 0,958" /><g><text width="30" height="968" x="15" y="484" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Безграничный accept исчерпывает таблицу fd</span></foreignObject></g><g transform="translate(0, 120)"><foreignObject height="816" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ничто не ограничивает одновременные сокеты по умолчанию, поэтому рост обнаруживается в 3 часа ночи, а не выбирается. Фикс — server.maxConnections сбрасывает нагрузку за лимитом (OS backlog поглощает несколько, затем отказывает), а осознанно поднятый ulimit -n делает потолок тем, что ты выбрал.</span></foreignObject></g></g></g></g><g transform="translate(0, 4131)"><g><g transform="translate(0, 16)"><g><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">SIGTERM посреди деплоя порождает шторм reset'ов</span></foreignObject></g><g transform="translate(0, 140)"><foreignObject height="896" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Бросание живых соединений на деплое или scale-down шлёт волну ECONNRESET пользователям посреди запроса. Фикс — server.close() перестаёт принимать и даёт существующим запросам завершиться, затем проходишь по активным сокетам и destroy()-ишь отставших после дедлайна слива, ведь close() сам по себе ждёт вечно на простаивающем keep-alive.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="1068" fill="#f43f5e" points="0,0 15,10 30,0 30,1058 15,1068 0,1058" /><g><text width="30" height="1068" x="15" y="534" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">05</text></g></g></g></g></g></g></g></svg>

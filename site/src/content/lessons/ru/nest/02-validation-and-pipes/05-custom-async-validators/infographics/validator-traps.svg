<svg height="809" width="1468" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1468 809"><defs /><g><g><g><foreignObject height="35" width="1428" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Три ловушки асинхронного валидатора БД (по нарастанию серьёзности)</span></foreignObject></g></g><g transform="translate(482, 35)"><g><g transform="translate(72, 321)"><g transform="translate(28, 0)"><foreignObject height="273" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Забыл useContainer — и class-validator инстанцирует constraint вне DI Nest, так что this.users становится undefined. Краш в день деплоя, легко найти.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,301 16,285 16,301" /><path d="M 28 357 L 28 289 L 140 289" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 333)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">DI — инжектированный repo undefined</span></foreignObject></g></g><g transform="translate(196, 160.5)"><g transform="translate(28, 0)"><foreignObject height="376" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Запрос в БД на каждый запрос до хендлера; отличимый ответ email-taken 400 даёт атакующему перечислить, у каких email есть аккаунты. Митигируй rate limiting и расплывчатым сообщением.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,404 16,388 16,404" /><path d="M 28 460 L 28 392 L 140 392" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 436)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Производительность + оракул user-enumeration</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="444" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Read-then-write: две конкурентные регистрации обе видят SELECT «отсутствует», обе проходят, обе делают INSERT — дубликаты или необработанный 500. Сериализует их только UNIQUE-индекс; мапь 23505 в 409.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,472 16,456 16,472" /><path d="M 28 528 L 28 460 L 140 460" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 504)"><foreignObject height="100" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Гонка TOCTOU — настоящий урок</span></foreignObject></g></g></g></g></g></svg>

<svg height="3027" width="1097" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1097 3027"><defs /><g id="infographic-container"><g><g transform="translate(83.5, 0)"><foreignObject height="35" width="890" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The seven production index failure modes — each with its one-line diagnostic</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1057" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Every production index postmortem maps to one of these seven; the diagnosis is always EXPLAIN (ANALYZE, BUFFERS) on the exact query</span></foreignObject></g></g><g transform="translate(378.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Missing index on FK column</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Postgres indexes the referenced PK, never the referencing column. ON DELETE CASCADE does an O(n) Seq Scan of the child table — a DELETE that takes 7 minutes holding row locks. Fix — CREATE INDEX CONCURRENTLY on every FK column.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="391" fill="#f43f5e" points="0,0 15,10 30,0 30,381 15,391 0,381" /><g><text width="30" height="391" x="15" y="195.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 391)"><g><g transform="translate(135, 0)"><polygon width="30" height="371" fill="#f59e0b" points="0,0 15,10 30,0 30,361 15,371 0,361" /><g><text width="30" height="371" x="15" y="185.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Implicit type coercion defeats the index</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="279" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">WHERE bigint_col = '42' (TEXT vs BIGINT) casts the column on every row, so the planner cannot walk the B-tree and falls to Seq Scan. Fix — typed parameters ($1::BIGINT), and range predicates instead of created_at::date.</span></foreignObject></g></g></g></g><g transform="translate(0, 762)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Stale statistics cause the wrong plan</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Autovacuum only ANALYZEs after 20% of rows change; until then EXPLAIN shows rows=50 when actual is 500,000 — a 10,000x miss that picks a catastrophic nested loop. Fix — ANALYZE after bulk ops, CREATE STATISTICS for skewed multi-column data.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="451" fill="#6366f1" points="0,0 15,10 30,0 30,441 15,451 0,441" /><g><text width="30" height="451" x="15" y="225.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1213)"><g><g transform="translate(135, 0)"><polygon width="30" height="391" fill="#14b8a6" points="0,0 15,10 30,0 30,381 15,391 0,381" /><g><text width="30" height="391" x="15" y="195.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Index bloat slows scans</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Dead entries from updates and deletes grow the index to 5-10x its expected size; queries stay slow despite using it. Fix — REINDEX INDEX CONCURRENTLY on indexes past 30% bloat (pgstattuple_approx), scheduled off-peak.</span></foreignObject></g></g></g></g><g transform="translate(0, 1604)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Wrong composite column order</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="339" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A composite (status, workspace_id) does not accelerate queries filtering by workspace_id alone — a leading-column violation that falls back to Seq Scan. Fix — add a second index with the correct leading column or redesign the composite.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="411" fill="#f43f5e" points="0,0 15,10 30,0 30,401 15,411 0,401" /><g><text width="30" height="411" x="15" y="205.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">05</text></g></g></g></g><g transform="translate(0, 2015)"><g><g transform="translate(135, 0)"><polygon width="30" height="411" fill="#f59e0b" points="0,0 15,10 30,0 30,401 15,411 0,401" /><g><text width="30" height="411" x="15" y="205.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">06</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">JSONB GIN cardinality bomb</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="339" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A GIN index over a JSONB column with millions of unique keys grows 10-50x the column size, evicts hot heap pages from shared_buffers, and spikes insert latency. Fix — expression B-tree indexes on known-hot fields like (payload-&gt;&gt;'event_type').</span></foreignObject></g></g></g></g><g transform="translate(0, 2426)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Has an index but still slow</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="398" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The right index exists but the structure is wrong — ORDER BY column not in the index forces a full sort, no INCLUDE means heap fetches dominate, or the leading column misses the most selective filter. Fix — EXPLAIN (ANALYZE, BUFFERS), then a covering composite that serves filter and sort.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="470" fill="#6366f1" points="0,0 15,10 30,0 30,460 15,470 0,460" /><g><text width="30" height="470" x="15" y="235" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">07</text></g></g></g></g></g></g></g></svg>

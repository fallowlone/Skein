<svg height="373" width="720" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 720 373"><defs /><defs><linearGradient id="gradient-arrow-fill-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" stop-opacity="0.36" /><stop offset="100%" stop-color="#FF356A" stop-opacity="0" /></linearGradient><linearGradient id="gradient-arrow-stroke-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" /><stop offset="58%" stop-color="#FF356A" stop-opacity="0" /></linearGradient></defs><g id="infographic-container"><g transform="translate(5.5, 0)"><g transform="translate(101, 0)"><foreignObject height="35" width="467" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The life of one row's update under MVCC</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="669" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A version is born on UPDATE, kept alive by an active snapshot, and only then reclaimed</span></foreignObject></g></g><g transform="translate(0, 91)"><g><polygon x="207.5" y="28" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(207.5, 28)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="447.5" y="28" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(447.5, 28)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="567.5" y="108.5" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(567.5, 108.5)rotate(90 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="447.5" y="189" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(447.5, 189)rotate(180 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="207.5" y="189" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(207.5, 189)rotate(180 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /></g><g><g><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A starts — gets snapshot</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Transaction A begins and is tagged with a snapshot frozen at this moment.</span></foreignObject></g></g><g transform="translate(240, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A reads v1</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A reads the row at version v1 — the version stamped before A started.</span></foreignObject></g></g><g transform="translate(480, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">B updates — creates v2</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Transaction B updates the row, writing a new version v2 and marking v1 dead.</span></foreignObject></g></g><g transform="translate(480, 161)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">B commits</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">v2 becomes the latest version visible to any new snapshot.</span></foreignObject></g></g><g transform="translate(240, 161)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A still reads v1</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A keeps seeing v1; its snapshot predates v2, so neither waits.</span></foreignObject></g></g><g transform="translate(0, 161)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">VACUUM reclaims v1</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Once no snapshot needs v1, VACUUM marks its space reusable.</span></foreignObject></g></g></g></g></g></svg>

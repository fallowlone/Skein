<svg height="787" width="640" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 640 787"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="600" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Three independent levers against oldest-xmin bloat</span></foreignObject></g><g transform="translate(37.5, 43)"><foreignObject height="48" width="525" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each neutralizes a different way a query pins the global oldest-xmin</span></foreignObject></g></g><g transform="translate(150, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">idle_in_transaction_session_timeout = 5–15 min</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">On the primary: kills forgotten open transactions before their backend_xmin pins bloat</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="232" fill="#6366f1" points="0,0 15,10 30,0 30,222 15,232 0,222" /><g><text width="30" height="232" x="15" y="116" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 232)"><g><g transform="translate(135, 0)"><polygon width="30" height="232" fill="#14b8a6" points="0,0 15,10 30,0 30,222 15,232 0,222" /><g><text width="30" height="232" x="15" y="116" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">hot_standby_feedback = off</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">On analytics replicas: stops the replica from sending its xmin back, so primary autovacuum is never held back</span></foreignObject></g></g></g></g><g transform="translate(0, 464)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Replication-slot lag alerts</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Catch orphan slots whose xmin column pins the publisher's oldest-xmin with no active session</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="192" fill="#f59e0b" points="0,0 15,10 30,0 30,182 15,192 0,182" /><g><text width="30" height="192" x="15" y="96" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

<svg height="471" width="823" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 823 471"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="783" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Four ways to stabilise plans across deploys — only one is the default</span></foreignObject></g><g transform="translate(6, 43)"><foreignObject height="48" width="771" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">One axis: keep the planner adaptive vs pin it hard. The further you pin, the worse a default it makes.</span></foreignObject></g></g><g transform="translate(221.5, 91)"><path d="M 0 170 L 340 170" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(340, 170)"><path d="M 0 0 L -5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L -5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(0, 170)"><path d="M 0 0 L 5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><path d="M 170 0 L 170 340" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(170, 0)"><path d="M 0 0 L -2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(170, 340)"><path d="M 0 0 L -2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g><g transform="translate(10, 10)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 150
  L 16 150
  Q 0 150 0 134
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#10b981" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Statistics-first — the production default</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Right for ~90% of cases. ANALYZE in every deploy hook, CREATE STATISTICS for correlated columns, auto_explain alerting. Fresh stats let the planner stay correct as data grows — adaptability preserved.</span></foreignObject></g></g><g transform="translate(180, 10)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 134
  Q 150 150 134 150
  L 0 150
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#f59e0b" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">pg_hint_plan pinning — last resort</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Right only for the 1-3 stability-critical queries (fixed-SLA, financial reports). Locks the plan shape; trades adaptability for predictability — tomorrow's data can make today's hint wrong.</span></foreignObject></g></g><g transform="translate(10, 180)"><path d="
  M 0 0
  L 150 0
  L 150 134
  Q 150 150 134 150
  L 16 150
  Q 0 150 0 134
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#6366f1" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Disable join reordering — lock-down sledgehammer</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">join_collapse_limit = 1 forces the written JOIN order. Useful for hand-tuned analytic queries, but global is a sledgehammer; apply per-role, never database-wide, or large OLTP joins miss the optimal order.</span></foreignObject></g></g><g transform="translate(180, 180)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 134
  Q 150 150 134 150
  L 16 150
  Q 0 150 0 134
  L 0 0
  L 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#f43f5e" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">External plan cache + custom executor — wrong default</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Seen only in extreme scale-out. Reinventing planner caching outside Postgres adds operational complexity, breaks tooling, and ages poorly. Use only when no native mechanism suffices — which is rare.</span></foreignObject></g></g></g></g></g></svg>

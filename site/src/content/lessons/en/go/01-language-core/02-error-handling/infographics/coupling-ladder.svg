<svg height="513" width="800" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 800 513"><defs /><g><g><g transform="translate(203.5, 0)"><foreignObject height="35" width="353" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Error idioms by caller coupling</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="760" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Default to the lowest rung — export a sentinel or type only when a caller must branch on the failure</span></foreignObject></g></g><g transform="translate(148, 91)"><g><g transform="translate(72, 145)"><g transform="translate(28, 0)"><foreignObject height="137" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Exposes nothing; callers can only log or propagate, so you stay free to change everything behind the message. The senior default.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,165 16,149 16,165" /><path d="M 28 221 L 28 153 L 140 153" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 197)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Opaque — just return error</span></foreignObject></g></g><g transform="translate(196, 72.5)"><g transform="translate(28, 0)"><foreignObject height="103" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Cheap identity branch via errors.Is, but carries no data and is permanent public API forever.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,131 16,115 16,131" /><path d="M 28 187 L 28 119 L 140 119" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 163)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Sentinel — var ErrX = errors.New(...)</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="103" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Carries fields (path, code) reached with errors.As; richest data, heaviest contract callers couple to.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,131 16,115 16,131" /><path d="M 28 187 L 28 119 L 140 119" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 163)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Typed — struct implements error</span></foreignObject></g></g></g></g></g></svg>

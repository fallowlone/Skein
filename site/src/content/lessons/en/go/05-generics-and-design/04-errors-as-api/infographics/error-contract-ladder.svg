<svg height="919" width="716" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 716 919"><defs /><g id="infographic-container"><g><g transform="translate(7, 0)"><foreignObject height="35" width="662" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Escalate the contract only as far as the caller must decide</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="676" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Opaque is the default to keep; each step down is more API surface you maintain forever</span></foreignObject></g></g><g transform="translate(188, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Opaque: no branch needed</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Promises only non-nil. Zero surface — the default you should fight to keep.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="192" fill="#14b8a6" points="0,0 15,10 30,0 30,182 15,192 0,182" /><g><text width="30" height="192" x="15" y="96" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 192)"><g><g transform="translate(135, 0)"><polygon width="30" height="192" fill="#6366f1" points="0,0 15,10 30,0 30,182 15,192 0,182" /><g><text width="30" height="192" x="15" y="96" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Behaviour interface: capability check</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">interface{ Timeout() bool } — ask the question without coupling to an identity.</span></foreignObject></g></g></g></g><g transform="translate(0, 384)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Sentinel: a yes/no branch (404?)</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Exported value matched by errors.Is. Dataless and permanent — never un-exportable.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#f59e0b" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 596)"><g><g transform="translate(135, 0)"><polygon width="30" height="192" fill="#f43f5e" points="0,0 15,10 30,0 30,182 15,192 0,182" /><g><text width="30" height="192" x="15" y="96" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Typed error: branch needs data</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Struct read by errors.As. Richest contract; versions like any public type.</span></foreignObject></g></g></g></g></g></g></g></svg>

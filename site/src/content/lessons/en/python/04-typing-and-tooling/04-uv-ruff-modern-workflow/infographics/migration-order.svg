<svg height="408" width="628" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 628 408"><defs /><g><g transform="translate(59, 0)"><g transform="translate(23.5, 0)"><foreignObject height="35" width="423" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Migrate in risk order, never big-bang</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="470" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Lowest-risk layer first, so the first breakage stays attributable</span></foreignObject></g></g><g transform="translate(0, 91)"><g><g transform="translate(72, 111)"><g transform="translate(28, 0)"><foreignObject height="86" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Config-only, zero runtime risk. Start with E and F, delete flake8/isort/black configs.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,114 16,98 16,114" /><path d="M 28 170 L 28 102 L 140 102" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 146)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">1. Adopt ruff</span></foreignObject></g></g><g transform="translate(196, 74)"><g transform="translate(28, 0)"><foreignObject height="86" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">uv pip install -r requirements.txt — no workflow change, proves the speed.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,114 16,98 16,114" /><path d="M 28 170 L 28 102 L 140 102" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 146)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">2. uv as drop-in pip</span></foreignObject></g></g><g transform="translate(320, 37)"><g transform="translate(28, 0)"><foreignObject height="86" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">uv add, commit uv.lock, switch CI to uv sync --frozen so stale locks fail loudly.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,114 16,98 16,114" /><path d="M 28 170 L 28 102 L 140 102" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 146)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">3. Lockfile in CI</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="69" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Replace global tool installs with isolated, cached runs.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,97 16,81 16,97" /><path d="M 28 153 L 28 85 L 140 85" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 129)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">4. uvx for tools</span></foreignObject></g></g></g></g></g></svg>

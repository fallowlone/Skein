ns="http://www.w3.org/1999/xhtml">Search latency 3x, CPU on handshakes +40%</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#f43f5e" /></g><g transform="translate(365, 20)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">One loop in a daemon thread, started at boot</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 99)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Connection pool and TLS sessions reused</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 178)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">.result(timeout) blocks the caller, not the loop</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 257)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;
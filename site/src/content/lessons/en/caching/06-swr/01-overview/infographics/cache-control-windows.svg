<svg height="577" width="800" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 800 577"><defs /><defs><linearGradient id="gradient-timeline-line" x1="90" y1="51" x2="90" y2="369" gradientUnits="userSpaceOnUse"><stop offset="-1.8867924528301887%" stop-color="#10b981" /><stop offset="32.70440251572327%" stop-color="#f59e0b" /><stop offset="67.29559748427673%" stop-color="#f43f5e" /><stop offset="101.88679245283019%" stop-color="#10b981" /></linearGradient></defs><g id="infographic-container"><g><g transform="translate(21, 0)"><foreignObject height="35" width="718" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">max-age=60, stale-while-revalidate=300, stale-if-error=86400</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="760" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Three nested windows: each layer does one job — freshness, then tail latency, then outage survival</span></foreignObject></g></g><g transform="translate(220, 91)"><g><path d="M 90 51 L 90 369" stroke="url(#gradient-timeline-line)" stroke-width="2" width="1" height="318" /><ellipse x="84" y="39" width="12" height="12" fill="#10b981" cx="90" cy="45" rx="6" ry="6" /><ellipse x="84" y="149" width="12" height="12" fill="#f59e0b" cx="90" cy="155" rx="6" ry="6" /><ellipse x="84" y="259" width="12" height="12" fill="#f43f5e" cx="90" cy="265" rx="6" ry="6" /><ellipse x="84" y="369" width="12" height="12" fill="#10b981" cx="90" cy="375" rx="6" ry="6" /></g><g><g transform="translate(120, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">0-60s - fresh</span></foreignObject></g><g transform="translate(0, 30)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Inside max-age. Served directly from cache, no origin contact</span></foreignObject></g></g><g transform="translate(120, 110)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">60-360s - stale, SWR window</span></foreignObject></g><g transform="translate(0, 56)"><foreignObject height="80" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Past max-age. Served stale instantly while one background refresh runs - no user blocks</span></foreignObject></g></g><g transform="translate(120, 220)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">up to 86400s - stale-if-error floor</span></foreignObject></g><g transform="translate(0, 56)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">If the origin errors or is down, keep serving the last good copy instead of a 503</span></foreignObject></g></g><g transform="translate(120, 330)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">beyond the windows - hard miss</span></foreignObject></g><g transform="translate(0, 56)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Staleness exhausted; the next request must block on the origin or fail loudly</span></foreignObject></g></g></g></g></g></svg>

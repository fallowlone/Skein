<svg height="547" width="668" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 668 547"><defs /><g><g><g><foreignObject height="35" width="628" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Invalidation: three mechanisms by propagation speed</span></foreignObject></g><g transform="translate(16.5, 43)"><foreignObject height="48" width="595" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Prefer the one that propagates fastest — versioned URLs need no purge at all.</span></foreignObject></g></g><g transform="translate(82, 91)"><g><g transform="translate(72, 162)"><g transform="translate(28, 0)"><foreignObject height="154" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">New content hash = new URL, so there is nothing to invalidate. Propagation cost is effectively zero; old and new coexist and the old ages out.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,182 16,166 16,182" /><path d="M 28 238 L 28 170 L 140 170" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 214)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Versioned / immutable URL</span></foreignObject></g></g><g transform="translate(196, 81)"><g transform="translate(28, 0)"><foreignObject height="137" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">One purge call drops every edge copy carrying a tag. Cloudflare instant purge propagates globally in under 150ms.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,165 16,149 16,165" /><path d="M 28 221 L 28 153 L 140 153" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 197)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Instant tag / surrogate-key purge</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="205" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Wider purges typically take seconds to a few minutes to reach every edge node — the eventual-consistency floor, backed by TTL + stale-while-revalidate.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,233 16,217 16,233" /><path d="M 28 289 L 28 221 L 140 221" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 265)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Broad / tag-based purge at scale</span></foreignObject></g></g></g></g></g></svg>

lign-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Pool evicts spare idle connections off-peak — only acts when minimumIdle is set below the maximum.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">idleTimeout — 10 min</span></foreignObject></g></g><g transform="translate(444, 64)"><g transform="translate(28, 0)"><foreignObject height="86" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Pool retires every connection by age, proactively, whether or not it still looks healthy.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,114 16,98 16,114" /><path d="M 28 170 L 28 102 L 140 102" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 146)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">maxLifetime — 30 min</span></foreignObject></g></g><g transform="translate(568, 0)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">External: the server closes its backend unannounced, so maxLifetime must fire first and the pool closes before this does.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">MySQL wait_timeout — 8 h</span></foreignObject></g></g></g></g></g></svg>

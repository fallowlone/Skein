<svg height="607" width="827" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 827 607"><defs /><g><g><g transform="translate(99, 0)"><foreignObject height="35" width="589" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Timeout ladder: retire before something else kills it</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="787" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ordered shortest to longest — each pool control must fire before the external timeout it guards against</span></foreignObject></g></g><g transform="translate(37.5, 91)"><g><g transform="translate(72, 256)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Pool pings idle connections before the NAT can drop them; the interval must beat the middlebox idle limit.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="40" width="112" y="0" x=
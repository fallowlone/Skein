1357225192232,1.7901395093349093 66.54300694534084,1.3378440437859846 67.02540907761882,0.942529578023322 67.55327275438016,0.6103469733861058 68.11838472626783,0.346464796464657 68.71195218228895,0.15498889923430248 69.32473956079924,0.03889853440562874 69.94721224942789,-1.127986593019159e-12" transform="translate(0, 298.4)" /></g><g /><g><g transform="translate(276.800731261426, 11.599999999999994)"><g><foreignObject height="52" width="213.199268738574" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">process.nextTick — highest, drained first</span></foreignObject></g><g transform="translate(0, 56)"><foreignObject height="60" width="213.199268738574" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Node-specific microtask emptied before promises; a self-rescheduling nextTick can starve the poll phase.</span></foreignObject></g></g><g transform="translate(348.40036563071294, 160.79999999999998)"><g><foreignObject height="52" width="213.19926873857412" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Promise reactions — .then / await</span></foreignObject></g><g transform="translate(0, 56)"><foreignObject height="60" width="213.19926873857412" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Microtask drained right after nextTick; this is why Promise.resolve().then beats setTimeout(0).</span></foreignObject></g></g><g transform="translate(420, 310)"><g><foreignObject height="52" width="213.19926873857412" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Macrotasks — timers, poll (I/O), check, close</span></foreignObject></g><g transform="translate(0, 56)"><foreignObject height="60" width="213.19926873857412" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The phase queues; they run only once both microtask tiers are empty, one callback at a time, no preemption.</span></foreignObject></g></g></g></g></g></svg>

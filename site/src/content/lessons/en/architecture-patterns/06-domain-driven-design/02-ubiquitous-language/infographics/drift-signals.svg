<svg height="985" width="718" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 718 985"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="678" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Three naming-drift signals — each a different model defect</span></foreignObject></g><g transform="translate(72.5, 43)"><foreignObject height="48" width="533" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Drift is a diagnostic: every signal points to a distinct fix, not a rename</span></foreignObject></g></g><g transform="translate(189, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">A word starts needing qualifiers</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Sales Order vs Billing Order — one term, two meanings. Defect: a misplaced context boundary. Fix: split the bounded context, not rename.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="311" fill="#6366f1" points="0,0 15,10 30,0 30,301 15,311 0,301" /><g><text width="30" height="311" x="15" y="155.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 311)"><g><g transform="translate(135, 0)"><polygon width="30" height="291" fill="#14b8a6" points="0,0 15,10 30,0 30,281 15,291 0,281" /><g><text width="30" height="291" x="15" y="145.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">One concept, different names per artifact</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="199" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">ProposalDraft in code, Quote in conversation, pending_order in the DB. Defect: model does not match the team's language. Fix: rename toward the language.</span></foreignObject></g></g></g></g><g transform="translate(0, 602)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Experts say a word the code lacks</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="160" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Approval escalation lives in conversation but has no class, method, or event. Defect: a missing concept. Fix: add it to the code.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="252" fill="#f59e0b" points="0,0 15,10 30,0 30,242 15,252 0,242" /><g><text width="30" height="252" x="15" y="126" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

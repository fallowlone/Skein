<svg height="244" width="1070" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1070 244"><defs /><defs><linearGradient id="edge-gradient-0-0" gradientUnits="userSpaceOnUse" x1="470" y1="126" x2="310" y2="78"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#14b8a6" /></linearGradient><linearGradient id="edge-gradient-0-1" gradientUnits="userSpaceOnUse" x1="670" y1="126" x2="830" y2="126"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#14b8a6" /></linearGradient><linearGradient id="edge-gradient-0-2" gradientUnits="userSpaceOnUse" x1="470" y1="126" x2="310" y2="174"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#14b8a6" /></linearGradient><filter id="compact-shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" /></filter></defs><g id="infographic-container"><g><g><path d="M 470 126 C 390 126 390 78 310 78" stroke="url(#edge-gradient-0-0)" stroke-width="2" fill="none" /><path d="M 670 126 C 750 126 750 126 830 126" stroke="url(#edge-gradient-0-1)" stroke-width="2" fill="none" /><path d="M 470 126 C 390 126 390 174 310 174" stroke="url(#edge-gradient-0-2)" stroke-width="2" fill="none" /></g><g><g transform="translate(470, 96)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="0" y="0" width="3" height="60" fill="#6366f1" rx="1.5" ry="1.5" /><g transform="translate(36, 8)"><g transform="translate(0, 13)"><g><foreignObject height="18" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">An architectural decision</span></foreignObject></g></g></g></g><g transform="translate(110, 48)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="197" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(8, 8)"><g transform="translate(0, -38.5)"><g><foreignObject height="35" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Sensitivity point — one attribute</span></foreignObject></g></g><g transform="translate(0, -3.5)"><foreignObject height="86" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Strongly moves a single quality attribute; the rest barely change. E.g. partitioning the event log by customer ID tunes per-customer query latency alone.</span></foreignObject></g></g></g><g transform="translate(830, 96)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="0" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(36, 8)"><g transform="translate(0, -38.5)"><g><foreignObject height="35" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Tradeoff point — opposing attributes</span></foreignObject></g></g><g transform="translate(0, -3.5)"><foreignObject height="86" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Improves some attributes while degrading others. E.g. event sourcing buys auditability and temporal queries at the cost of modifiability and operational simplicity.</span></foreignObject></g></g></g><g transform="translate(110, 144)"><rect x="0" y="0" width="200" height="60" fill="#ffffff" stroke="#ffffff" stroke-width="1" rx="6" ry="6" filter="url(#compact-shadow)" /><rect x="197" y="0" width="3" height="60" fill="#14b8a6" rx="1.5" ry="1.5" /><g transform="translate(8, 8)"><g transform="translate(0, -38.5)"><g><foreignObject height="35" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Risk — a plausible future failure</span></foreignObject></g></g><g transform="translate(0, -3.5)"><foreignObject height="86" width="156" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:10px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Lets an attribute miss its required level in a plausible-but-unrealized scenario. E.g. an immutable PII log once right-to-erasure becomes law.</span></foreignObject></g></g></g></g></g></g></svg>

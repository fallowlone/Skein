<svg height="471" width="1046" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1046 471"><defs /><g id="infographic-container"><g><g transform="translate(291, 0)"><foreignObject height="35" width="424" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Four ways to order distributed writes</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1006" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The senior question is "does it detect concurrency?" — only one of these does it in software, and only one trusts the wall clock at all.</span></foreignObject></g></g><g transform="translate(333, 91)"><path d="M 0 170 L 340 170" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(340, 170)"><path d="M 0 0 L -5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L -5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(0, 170)"><path d="M 0 0 L 5 -2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 5 2.5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><path d="M 170 0 L 170 340" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,2" fill="none" /><g transform="translate(170, 0)"><path d="M 0 0 L -2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g transform="translate(170, 340)"><path d="M 0 0 L -2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /><path d="M 0 0 L 2.5 -5" stroke="#D9D9D9" stroke-width="1" fill="none" /></g><g><g transform="translate(10, 10)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 150
  L 16 150
  Q 0 150 0 134
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#f43f5e" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Wall-clock LWW — keep the highest timestamp</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">O(1), one number. Detects nothing: the fastest clock wins, so skew silently drops the genuinely newer write — and the client still gets 200 OK.</span></foreignObject></g></g><g transform="translate(180, 10)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 134
  Q 150 150 134 150
  L 0 150
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#f59e0b" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Lamport timestamp — counter, max+1 on receive</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">O(1), one counter. Gives a consistent total order but cannot detect concurrency: L(A) &lt; L(B) does not mean A caused B, so concurrent writes get an arbitrary order.</span></foreignObject></g></g><g transform="translate(10, 180)"><path d="
  M 0 0
  L 150 0
  L 150 134
  Q 150 150 134 150
  L 16 150
  Q 0 150 0 134
  L 0 16
  Q 0 0 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#14b8a6" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Vector clock — one counter per node</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">O(n) metadata that grows with the cluster. Detects concurrency: flags two writes as concurrent so the store keeps both as siblings to merge — never silently lost.</span></foreignObject></g></g><g transform="translate(180, 180)"><path d="
  M 16 0
  L 134 0
  Q 150 0 150 16
  L 150 134
  Q 150 150 134 150
  L 16 150
  Q 0 150 0 134
  L 0 0
  L 16 0
  Z
" x="0" y="0" width="150" height="150" fill="#6366f1" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">TrueTime — GPS + atomic clocks, commit-wait</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Real physical ordering. Bounds clock uncertainty to ε (about 1ms) and sleeps it out for external consistency — at the cost of special hardware and commit-wait latency.</span></foreignObject></g></g></g></g></g></svg>

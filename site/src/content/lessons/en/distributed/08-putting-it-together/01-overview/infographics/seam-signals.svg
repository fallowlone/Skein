<svg height="1236" width="1006" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1006 1236"><defs /><g id="infographic-container"><g><g transform="translate(217.5, 0)"><foreignObject height="35" width="531" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Run it on seam signals, not green dashboards</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="966" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Every per-service dashboard can stay green while the pipeline quietly fails customers — these four signals live between layers</span></foreignObject></g></g><g transform="translate(333, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Consumer lag</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">How far behind the saga's event consumers are. Rising lag means the pipeline is falling behind producers; sagas stall mid-flight and in-flight compensations pile up.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="271" fill="#6366f1" points="0,0 15,10 30,0 30,261 15,271 0,261" /><g><text width="30" height="271" x="15" y="135.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 271)"><g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#14b8a6" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Quorum write/read latency</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">p99 of the W=2 write. A slow third replica drags tail latency even when no node is technically down.</span></foreignObject></g></g></g></g><g transform="translate(0, 483)"><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Leader churn</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Elections per minute. Frequent re-elections mean fencing tokens are bumping constantly — you are one pause away from a split-brain write attempt.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="271" fill="#f59e0b" points="0,0 15,10 30,0 30,261 15,271 0,261" /><g><text width="30" height="271" x="15" y="135.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 754)"><g><g transform="translate(135, 0)"><polygon width="30" height="351" fill="#f43f5e" points="0,0 15,10 30,0 30,341 15,351 0,341" /><g><text width="30" height="351" x="15" y="175.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Retry-budget exhaustion</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="279" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Percent of budget consumed. Near 100%, retries get dropped and surface as user-visible failures even though every downstream service is healthy. Budgets cap retries at ~10% over normal request rate.</span></foreignObject></g></g></g></g></g></g></g></svg>

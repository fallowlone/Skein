<svg height="493" width="659" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 659 493"><defs /><g><g><g transform="translate(32, 0)"><foreignObject height="35" width="555" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">From promise to proof: making a fetch type true</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="619" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each rung makes the annotation less of a lie; only the top one inspects the bytes</span></foreignObject></g></g><g transform="translate(15.5, 91)"><g><g transform="translate(72, 162)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Asserts a shape, runs zero checks. A pure promise about the wire; a renamed field or a null sails straight through.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="20" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">as User — cast</span></foreignObject></g></g><g transform="translate(196, 108)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Forces every caller to handle the failure branch. Honest control flow, but the payload is still cast — unchecked.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Discriminated union / Result</span></foreignObject></g></g><g transform="translate(320, 54)"><g transform="translate(28, 0)"><foreignObject height="137" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Type is mechanically tied to the contract: drift closed. Bytes still unverified — a server that breaks its own spec slips by.</span></foreignObject></g><polygon fill="#0ea5e9" opacity="0.9" width="16" height="16" points="0,165 16,149 16,165" /><path d="M 28 221 L 28 153 L 140 153" stroke="#0ea5e9" stroke-width="8" fill="none" /><g transform="translate(32, 197)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">OpenAPI codegen / shared type</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="103" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Inspects the real bytes and narrows on success. Trust gap closed — the promise finally becomes a proof.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,131 16,115 16,131" /><path d="M 28 187 L 28 119 L 140 119" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 163)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">zod .parse at runtime</span></foreignObject></g></g></g></g></g></svg>

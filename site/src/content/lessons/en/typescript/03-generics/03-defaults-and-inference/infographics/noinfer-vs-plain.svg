><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The list guard evaporates</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">no error — the typo slips through</span></foreignObject></g></g><g transform="translate(365, 20)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Only initial feeds T</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">allowed is removed as an inference source</span></foreignObject></g></g><g transform="translate(365, 12
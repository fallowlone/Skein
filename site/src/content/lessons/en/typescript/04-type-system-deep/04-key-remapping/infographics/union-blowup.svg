<svg height="485" width="838" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 838 485"><defs /><g><g><g transform="translate(113.5, 0)"><foreignObject height="35" width="571" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Renaming via template literals multiplies key sets</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="798" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each key axis you cross-multiply in an as clause explodes the union — remapping amplifies the blow-up</span></foreignObject></g></g><g transform="translate(167, 91)"><g><g transform="translate(72, 131)"><g transform="translate(28, 0)"><foreignObject height="103" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">One template over a 50-key source builds 50 string literals. Snappy editor, instant hovers.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,131 16,115 16,131" /><path d="M 28 187 L 28 119 L 140 119" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 163)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">1 key set — 50-member union</span></foreignObject></g></g><g transform="translate(196, 65.5)"><g transform="translate(28, 0)"><foreignObject height="103" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Cross-product of two 50-key sets in a single as clause: 50 x 50 = 2,500 literals built in one step.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,131 16,115 16,131" /><path d="M 28 187 L 28 119 L 140 119" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 163)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">2 key sets — 2,500-member union</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="154" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">50 x 50 x 50 = 125,000 blows past TypeScript's ~100,000-member union cap: type too complex to represent, multi-second hovers.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,182 16,166 16,182" /><path d="M 28 238 L 28 170 L 140 170" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 214)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">3 key sets — 125,000 members, past the cap</span></foreignObject></g></g></g></g></g></svg>

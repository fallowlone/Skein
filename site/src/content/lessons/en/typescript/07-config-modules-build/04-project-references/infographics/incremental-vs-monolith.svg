l">No package boundary, so every package is re-analysed together</span></foreignObject></g></g><g transform="translate(25, 314)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">No .tsbuildinfo reuse</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">tsc re-hashes the whole program; nothing is skipped</span></foreignObject></g></g><g transform="translate(25, 461)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Editor re-checks the whole repo</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Language server re-analyses every package on each keystroke</span></foreignObject></g></g><g transform="translate(365, 20)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Edit re-checks only that project</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A one-line web edit rebuilds just web, reusing cached core and ui</span></foreignObject></g></g><g transform="translate(365, 167)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Builds dependencies before dependents</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">tsc -b topo-sorts the reference DAG: core then ui then web</span></foreignObject></g></g><g transform="translate(365, 314)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">.tsbuildinfo skips unchanged projects</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Inputs hashed against the cache; a dependent rebuilds only on a public .d.ts change</span></foreignObject></g></g><g transform="translate(365, 461)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Editor checks one project in isolation</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;li
<svg height="1715" width="798" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 798 1715"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="758" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Four cold-start levers, cheapest first — each cuts a different phase</span></foreignObject></g><g transform="translate(4, 43)"><foreignObject height="48" width="750" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Profile first, then match the lever to the dominant phase; pick the wrong one and you get nothing</span></foreignObject></g></g><g transform="translate(229, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Lazy require — skip a rare-path dep</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="279" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">require() the heavy dep inside the function that uses it, so a path most invocations never take loads nothing at boot. Catch — it defers, not removes: a common-path dep still pays the same resolution + compile, just on first call.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="371" fill="#6366f1" points="0,0 15,10 30,0 30,361 15,371 0,361" /><g><text width="30" height="371" x="15" y="185.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 371)"><g><g transform="translate(135, 0)"><polygon width="30" height="371" fill="#14b8a6" points="0,0 15,10 30,0 30,361 15,371 0,361" /><g><text width="30" height="371" x="15" y="185.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Bundle (esbuild / ncc) — kill resolution I/O</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="279" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Inlines the whole graph into one file, so the loader does one stat()+read() instead of tens of thousands — a Lambda fell from ~3s to under 1s. Catch — no help for eval, and you must tree-shake dead deps to hold the win.</span></foreignObject></g></g></g></g><g transform="translate(0, 742)"><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">NODE_COMPILE_CACHE — reuse warm bytecode</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Serializes V8 bytecode keyed by source, so warm boots skip parse+compile — the 20-40% compile slice can drop by an order of magnitude. Catch — the first run pays full cost to populate it, and serverless needs a persistent cache dir, not /tmp.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="431" fill="#f59e0b" points="0,0 15,10 30,0 30,421 15,431 0,421" /><g><text width="30" height="431" x="15" y="215.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1173)"><g><g transform="translate(135, 0)"><polygon width="30" height="411" fill="#f43f5e" points="0,0 15,10 30,0 30,401 15,411 0,401" /><g><text width="30" height="411" x="15" y="205.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Startup snapshot — freeze the post-init heap</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">--build-snapshot runs init once and captures the V8 heap; --snapshot-blob restores it instantly, skipping eval entirely. Catch — no open handles at snapshot time, an experimental API, and the blob is locked to the exact Node version.</span></foreignObject></g></g></g></g></g></g></g></svg>

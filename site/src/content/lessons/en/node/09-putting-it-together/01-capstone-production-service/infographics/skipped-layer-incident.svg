<svg height="1111" width="758" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 758 1111"><defs /><g id="infographic-container"><g><g transform="translate(189.5, 0)"><foreignObject height="35" width="339" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Skip a layer, book an incident</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="718" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each cross-cutting concern omitted is not a smaller service — it is a named production outage</span></foreignObject></g></g><g transform="translate(209, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">No error boundary</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Raw stack traces and DB internals leak to clients; an unexpected throw crashes instead of a clean 500</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#f43f5e" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 212)"><g><g transform="translate(135, 0)"><polygon width="30" height="172" fill="#f59e0b" points="0,0 15,10 30,0 30,162 15,172 0,162" /><g><text width="30" height="172" x="15" y="86" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Blocked event loop</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">One inline CPU call queues every request behind it — p99 jumps from 40 ms to 9 s</span></foreignObject></g></g></g></g><g transform="translate(0, 384)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">No graceful shutdown</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">SIGTERM with no drain: in-flight checkouts dropped on every deploy, hard-killed after 30 s</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#6366f1" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 596)"><g><g transform="translate(135, 0)"><polygon width="30" height="172" fill="#f43f5e" points="0,0 15,10 30,0 30,162 15,172 0,162" /><g><text width="30" height="172" x="15" y="86" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Unvalidated input</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A crafted query string reaches an unparameterized SQL string — injection and corruption</span></foreignObject></g></g></g></g><g transform="translate(0, 768)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Config baked into the image</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">One artifact cannot promote across environments and a secret ends up committed to git</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#f59e0b" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">05</text></g></g></g></g></g></g></g></svg>

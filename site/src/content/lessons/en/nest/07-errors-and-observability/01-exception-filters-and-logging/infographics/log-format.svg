<svg height="535" width="609" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 609 535"><defs /><defs><filter id="vs-divider-glow-filter" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" /></filter><filter id="drop-shadow" x="-25%" y="-25%" width="200%" height="200%"><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="black" flood-opacity="0.8" /></filter></defs><g id="infographic-container"><g><g><foreignObject height="35" width="569" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Logging the error: console.log vs structured JSON</span></foreignObject></g><g transform="translate(1, 43)"><foreignObject height="48" width="567" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">At 2am a machine must read your logs — free-form strings it cannot parse</span></foreignObject></g></g><g transform="translate(2, 91)"><g><g transform="translate(245, 162)"><ellipse x="0" y="0" width="100" height="100" fill="#ff9bb5" filter="url(#vs-divider-glow-filter)" opacity="0.6" cx="50" cy="50" rx="50" ry="50" /><ellipse x="0" y="0" width="100" height="100" fill="#ff356a" cx="50" cy="50" rx="50" ry="50" /><text x="50" y="50" font-size="66.66666666666667" font-weight="bold" fill="currentColor" text-anchor="middle" dominant-baseline="central" filter="url(#drop-shadow)">VS</text></g></g><g><g transform="translate(25, 20)"><g><foreignObject height="26" width=
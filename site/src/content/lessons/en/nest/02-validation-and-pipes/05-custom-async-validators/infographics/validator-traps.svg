<svg height="565" width="640" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 640 565"><defs /><g><g><g><foreignObject height="35" width="600" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Three traps of an async DB validator (rising severity)</span></foreignObject></g></g><g transform="translate(68, 35)"><g><g transform="translate(72, 199)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Forget useContainer and class-validator instantiates the constraint outside Nest's DI, so this.users is undefined. A deploy-day crash, easy to find.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">DI — the injected repo is undefined</span></foreignObject></g></g><g transform="translate(196, 99.5)"><g transform="translate(28, 0)"><foreignObject height="205" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">A DB round trip on every request before the handler; a distinct email-taken 400 lets an attacker enumerate which emails have accounts. Mitigate with rate limiting and a vague message.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,233 16,217 16,233" /><path d="M 28 289 L 28 221 L 140 221" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 265)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Perf + a user-enumeration oracle</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="205" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Read-then-write: two concurrent signups both SELECT absent, both pass, both INSERT — duplicate rows or an unhandled 500. Only a UNIQUE index serializes them; map 23505 to a 409.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,233 16,217 16,233" /><path d="M 28 289 L 28 221 L 140 221" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 265)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">TOCTOU race — the real lesson</span></foreignObject></g></g></g></g></g></svg>

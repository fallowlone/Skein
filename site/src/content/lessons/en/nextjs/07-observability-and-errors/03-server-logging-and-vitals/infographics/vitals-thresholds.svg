<svg height="551" width="1517" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1517 551"><defs /><g id="infographic-container"><g><g transform="translate(375, 0)"><foreignObject height="35" width="727" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Core Web Vitals: the Good/Poor thresholds, judged at field p75</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="1477" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Aggregate each metric to the field p75 per route per deploy, then judge it against these fixed bands — the rating the beacon reports. The lab Lighthouse run cannot see them; only the field can.</span></foreignObject></g></g><g transform="translate(588.5, 91)"><g><g><g><g transform="translate(0, 40)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">LCP — Largest Contentful Paint</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Good under 2.5 s, poor past 4 s. The bad deploy moved product-page LCP from 2.1 s to 3.4 s — past Good but short of the 4 s poor line, so no lab alarm fired for nine days.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="140" fill="#6366f1" points="0,0 15,10 30,0 30,130 15,140 0,130" /><g><text width="30" height="140" x="15" y="70" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 140)"><g><g transform="translate(135, 0)"><polygon width="30" height="140" fill="#14b8a6" points="0,0 15,10 30,0 30,130 15,140 0,130" /><g><text width="30" height="140" x="15" y="70" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 40)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">INP — Interaction to Next Paint</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Good under 200 ms, poor past 500 ms. Responsiveness lives in the browser, so only a field beacon can report where a route actually sits.</span></foreignObject></g></g></g></g><g transform="translate(0, 280)"><g><g transform="translate(0, 40)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">CLS — Cumulative Layout Shift</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Good under 0.1, poor past 0.25. A unitless visual-stability score, judged at p75 — strict enough to surface the painful tail without one broken extension paging you.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="140" fill="#8b5cf6" points="0,0 15,10 30,0 30,130 15,140 0,130" /><g><text width="30" height="140" x="15" y="70" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

<svg height="1184" width="707" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 707 1184"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="667" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Where the optimizer runs — three cost surfaces, one srcset</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="667" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Same next/image markup; the optimizer's bill changes shape with where it transforms</span></foreignObject></g></g><g transform="translate(183.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Vercel — metered per source image</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="259" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each plan bundles a transformation quota; a 40,000-SKU catalog blows through the included thousands fast, and every new source image after that is billable.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="331" fill="#6366f1" points="0,0 15,10 30,0 30,321 15,331 0,321" /><g><text width="30" height="331" x="15" y="165.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 331)"><g><g transform="translate(135, 0)"><polygon width="30" height="351" fill="#14b8a6" points="0,0 15,10 30,0 30,341 15,351 0,341" /><g><text width="30" height="351" x="15" y="175.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Self-hosted — CPU plus persistent disk</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="259" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">sharp spends ~100–300 ms re-encoding each variant; the cache lives in .next/cache/images and must survive deploys, or the whole catalog re-encodes every release as a daily CPU sawtooth.</span></foreignObject></g></g></g></g><g transform="translate(0, 682)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Custom loader — a dedicated image CDN</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="279" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Rewrite URLs to Cloudinary, imgix, or Thumbor — keep the next/image markup benefits (srcset, dimensions, lazy/priority) while moving transformation onto infrastructure built for it.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="371" fill="#f59e0b" points="0,0 15,10 30,0 30,361 15,371 0,361" /><g><text width="30" height="371" x="15" y="185.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

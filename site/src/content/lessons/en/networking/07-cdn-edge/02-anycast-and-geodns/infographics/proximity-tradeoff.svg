99/xhtml">Absorbs DDoS across every POP on the IP</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /></g><g transform="translate(25, 232)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Hop-nearest, not latency-nearest</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /></g><g transform="translate(365, 20)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Routes by resolving nameserver's IP geolocation</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 73)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Returns region-specific A records, explicit steering</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 126)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height
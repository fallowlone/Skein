" x="0" y="0" width="150" height="150" fill="#6366f1" transform="translate(0, 0)" /><g transform="translate(20, 58)"><foreignObject height="20" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">One-way · plain HTTP → SSE</span></foreignObject></g><g transform="translate(20, 88)"><foreignObject height="31" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:11px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Server pushes, client listens. text/event-stream rides any proxy with no upgrade and auto-reconnects. Live dashboards, notifications, AI token streams.</span></foreignObject></g></g><g transform="translate(180, 10)"><path d="
  M 16 0

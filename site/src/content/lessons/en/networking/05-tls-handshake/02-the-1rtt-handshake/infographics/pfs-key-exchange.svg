t;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">No PFS — forward secrecy is optional, off by default</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#f43f5e" /></g><g transform="translate(365, 20)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">key_share carries a fresh ECDHE public key, new per connection</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 73)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Ephemeral private scalars are discarded after the handshake</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 126)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Stolen long-term key cannot decrypt past sessions</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /></g><g transform="translate(365, 179)"><g><foreignObject height="26" width="200" y="0" x="0" o
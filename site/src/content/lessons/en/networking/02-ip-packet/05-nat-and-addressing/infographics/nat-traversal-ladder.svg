<svg height="627" width="994" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 994 627"><defs /><g><g><g transform="translate(270.5, 0)"><foreignObject height="35" width="413" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The NAT-traversal escalation ladder</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="954" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">ICE climbs from the cheapest direct path to a guaranteed relay — each rung trades latency for a higher chance of connecting</span></foreignObject></g></g><g transform="translate(245, 91)"><g><g transform="translate(72, 202)"><g transform="translate(28, 0)"><foreignObject height="154" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">A STUN server tells each peer the public IP and port the NAT assigned it. Peers then try a direct path. No relay, lowest latency — this is the path you want.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,182 16,166 16,182" /><path d="M 28 238 L 28 170 L 140 170" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 214)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">STUN — discover the public mapping, connect directly</span></foreignObject></g></g><g transform="translate(196, 101)"><g transform="translate(28, 0)"><foreignObject height="205" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">The framework races STUN-discovered, direct, and relayed candidates together, picking the first working pair. It is the logic that decides whether STUN was enough or TURN is needed.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,233 16,217 16,233" /><path d="M 28 289 L 28 221 L 140 221" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 265)"><foreignObject height="80" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">ICE — iterate every candidate until one path works</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">If direct fails (symmetric NAT, CGNAT), a TURN server forwards every packet. It always works but adds a latency penalty and server cost — the fallback of last resort.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">TURN — relay all traffic through the server</span></foreignObject></g></g></g></g></g></svg>

<svg height="479" width="854" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 854 479"><defs /><g><g><g transform="translate(179, 0)"><foreignObject height="35" width="456" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The three-tier payload length encoding</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="814" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The 7-bit length field escalates: pay more header bytes only when the payload outgrows the previous tier</span></foreignObject></g></g><g transform="translate(175, 91)"><g><g transform="translate(72, 128)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">The length byte holds the real length. No extension. Header stays at 2 bytes — the minimum WebSocket frame.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Length 0-125 — inline 7-bit field</span></foreignObject></g></g><g transform="translate(196, 64)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">The 7-bit field signals 126; the next 2 bytes carry the real length, up to 65,535 bytes. Header grows by +2 bytes.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Length 126 — uint16 extension</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="171" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">The 7-bit field signals 127; the next 8 bytes carry the real length. Header grows by +8 bytes, addressing payloads far beyond any practical message.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,199 16,183 16,199" /><path d="M 28 255 L 28 187 L 140 187" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 231)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Length 127 — uint64 extension</span></foreignObject></g></g></g></g></g></svg>

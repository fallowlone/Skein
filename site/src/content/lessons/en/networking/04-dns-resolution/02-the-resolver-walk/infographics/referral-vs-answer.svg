<svg height="535" width="640" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 640 535"><defs /><defs><filter id="vs-divider-glow-filter" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" /></filter><filter id="drop-shadow" x="-25%" y="-25%" width="200%" height="200%"><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="black" flood-opacity="0.8" /></filter></defs><g id="infographic-container"><g><g transform="translate(116.5, 0)"><foreignObject height="35" width="367" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Referral vs authoritative answer</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="600" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Two response shapes — which DNS message sections each fills, and the AA bit</span></foreignObject></g></g><g transform="translate(17.5, 91)"><g><g transform="translate(245, 162)"><ellipse x="0" y="0" width="100" height="100" fill="#ff9bb5" filter="url(#vs-divider-glow-filter)" opacity="0.6" cx="50" cy="50" rx="50" ry="50" /><ellipse x="0" y="0" width="100" height="100" fill="#ff356a" cx="50" cy="50" rx="50" ry="50" /><text x="50" y="50" font-size="66.66666666666667" font-weight="bold" fill="currentColor" text-anchor="middle" dominant-baseline="central" filter="url(#drop-shadow)">VS</text></g></g><g><g transform="translate(25, 20)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Answer section empty</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Server does not own the name, so it answers nothing directly</span></foreignObject></g></g><g transform="translate(25, 121)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">NS in Authority</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Nameserver for the next zone down the tree</span></foreignObject></g></g><g transform="translate(25, 222)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Glue A/AAAA in Additional</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Pre-fetched IP of that nameserver, so no lookup loop</span></foreignObject></g></g><g transform="translate(25, 323)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">AA bit = 0</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Not an authoritative answer — just a pointer onward</span></foreignObject></g></g><g transform="translate(365, 20)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Answer section populated</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">e.g. cdn.example.co.uk A 203.0.113.10 TTL=300</span></foreignObject></g></g><g transform="translate(365, 121)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Authority optional</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">May echo the zone's own NS records</span></foreignObject></g></g><g transform="translate(365, 222)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Additional often empty</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">No referral target to glue — this is the final hop</span></foreignObject></g></g><g transform="translate(365, 323)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">AA bit = 1</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Responding server owns the zone</span></foreignObject></g></g></g></g></g></svg>

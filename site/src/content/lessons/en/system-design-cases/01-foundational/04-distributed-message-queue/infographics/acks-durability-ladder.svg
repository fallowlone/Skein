<svg height="411" width="551" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 551 411"><defs /><g><g><g transform="translate(106, 0)"><foreignObject height="35" width="299" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The acks durability ladder</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="511" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each rung trades speed for a stronger guarantee against data loss</span></foreignObject></g></g><g transform="translate(23.5, 91)"><g><g transform="translate(72, 94)"><g transform="translate(28, 0)"><foreignObject height="86" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Fastest; producer never waits. A crash loses the message — no durability.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,114 16,98 16,114" /><path d="M 28 170 L 28 102 L 140 102" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 146)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">acks=0 — fire-and-forget</span></foreignObject></g></g><g transform="translate(196, 47)"><g transform="translate(28, 0)"><foreignObject height="69" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Leader confirms before replicating. Loses data if the leader dies first.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,97 16,81 16,97" /><path d="M 28 153 L 28 85 L 140 85" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 129)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">acks=1 — leader-only ack</span></foreignObject></g></g><g transform="translate(320, 0)"><g transform="translate(28, 0)"><foreignObject height="69" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Every in-sync replica must have it. Survives leader failure with no loss.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,97 16,81 16,97" /><path d="M 28 153 L 28 85 L 140 85" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 129)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">acks=all — full ISR ack</span></foreignObject></g></g></g></g></g></svg>

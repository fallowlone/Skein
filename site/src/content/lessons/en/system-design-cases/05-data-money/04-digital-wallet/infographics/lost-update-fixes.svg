<svg height="1244" width="706" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 706 1244"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="666" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Three fixes for the lost update — pick by contention profile</span></foreignObject></g><g transform="translate(6, 43)"><foreignObject height="48" width="654" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">All three close the stale-read-then-write gap; they differ in how a hot wallet behaves</span></foreignObject></g></g><g transform="translate(183, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Pessimistic lock — SELECT … FOR UPDATE</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Lock the wallet row before reading, so the second debit blocks and reads the fresh balance. Simple and exactly correct, but a hot wallet serializes into a queue.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="311" fill="#6366f1" points="0,0 15,10 30,0 30,301 15,311 0,301" /><g><text width="30" height="311" x="15" y="155.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 311)"><g><g transform="translate(135, 0)"><polygon width="30" height="331" fill="#14b8a6" points="0,0 15,10 30,0 30,321 15,331 0,321" /><g><text width="30" height="331" x="15" y="165.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Optimistic / CAS — version check</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="259" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Read balance + version, write only if the version is unchanged (WHERE id=? AND version=?); on conflict, zero rows hit and you retry. Great when contention is rare, storms with retries when it is high.</span></foreignObject></g></g></g></g><g transform="translate(0, 642)"><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Atomic conditional write — single statement</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="359" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Push check-and-decrement into one operation: UPDATE … SET balance = balance - 70 WHERE balance &gt;= 70. No read-modify-write race exists; zero rows means insufficient funds. The cleanest single-wallet debit.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="471" fill="#f59e0b" points="0,0 15,10 30,0 30,461 15,471 0,461" /><g><text width="30" height="471" x="15" y="235.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

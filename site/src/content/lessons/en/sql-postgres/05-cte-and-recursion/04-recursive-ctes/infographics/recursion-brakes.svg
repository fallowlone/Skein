<svg height="939" width="685" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 685 939"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="645" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Four brakes to stop a recursive CTE from looping forever</span></foreignObject></g><g transform="translate(27, 43)"><foreignObject height="48" width="591" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Without one, a cycle spins until work_mem spills to disk and the query hangs</span></foreignObject></g></g><g transform="translate(172.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">CYCLE clause (PG14+)</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Declarative cycle detection; stops revisiting a node already on the path — preferred on real graphs</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="192" fill="#6366f1" points="0,0 15,10 30,0 30,182 15,192 0,182" /><g><text width="30" height="192" x="15" y="96" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 192)"><g><g transform="translate(135, 0)"><polygon width="30" height="192" fill="#14b8a6" points="0,0 15,10 30,0 30,182 15,192 0,182" /><g><text width="30" height="192" x="15" y="96" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Visited-array path check</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Any version: carry ARRAY[node], add WHERE NOT node = ANY(path); catches every graph cycle</span></foreignObject></g></g></g></g><g transform="translate(0, 384)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">UNION, not UNION ALL</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Dedupes each pass against the result; stops simple repeats but slower and misses some graph cycles</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#f59e0b" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 596)"><g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#f43f5e" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Depth cap (WHERE depth &lt; 50)</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The seatbelt you add regardless — bounds an unbounded walk even with cycle protection on</span></foreignObject></g></g></g></g></g></g></g></svg>

<svg height="859" width="841" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 841 859"><defs /><g id="infographic-container"><g><g transform="translate(214.5, 0)"><foreignObject height="35" width="372" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Match the symptom to the stage</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="801" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">"Slow at which stage?" is the first diagnostic question — each failure mode lives at one stage with one fix</span></foreignObject></g></g><g transform="translate(250.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Syntax error</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="100" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Parse stage — pure text problem, schema irrelevant. Fix the SQL text.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="152" fill="#6366f1" points="0,0 15,10 30,0 30,142 15,152 0,142" /><g><text width="30" height="152" x="15" y="76" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 152)"><g><g transform="translate(135, 0)"><polygon width="30" height="152" fill="#14b8a6" points="0,0 15,10 30,0 30,142 15,152 0,142" /><g><text width="30" height="152" x="15" y="76" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">relation/column does not exist</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Analyze stage — valid SQL, no catalog match. Fix the name.</span></foreignObject></g></g></g></g><g transform="translate(0, 304)"><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Sudden slowdown after a bulk load</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Plan stage — stale row estimates, bad plan. Run ANALYZE to refresh statistics, do not rewrite the query.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="232" fill="#f59e0b" points="0,0 15,10 30,0 30,222 15,232 0,222" /><g><text width="30" height="232" x="15" y="116" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 536)"><g><g transform="translate(135, 0)"><polygon width="30" height="192" fill="#f43f5e" points="0,0 15,10 30,0 30,182 15,192 0,182" /><g><text width="30" height="192" x="15" y="96" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Always slow, plan looks right</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Execute stage — genuinely reading too many pages. Add an index or read less data.</span></foreignObject></g></g></g></g></g></g></g></svg>

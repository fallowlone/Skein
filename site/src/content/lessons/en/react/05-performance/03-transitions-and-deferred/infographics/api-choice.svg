<svg height="641" width="605" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 605 641"><defs /><defs><filter id="vs-divider-glow-filter" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" /></filter><filter id="drop-shadow" x="-25%" y="-25%" width="200%" height="200%"><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="black" flood-opacity="0.8" /></filter></defs><g id="infographic-container"><g transform="translate(6.5, 0)"><g transform="translate(78, 0)"><foreignObject height="35" width="396" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">useTransition vs useDeferredValue</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="552" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Same interruptible background render — the split is who owns the value</span></foreignObject></g></g><g transform="translate(0, 91)"><g><g transform="translate(245, 215)"><ellipse x="0" y="0" width="100" height="100" fill="#ff9bb5" filter="url(#vs-divider-glow-filter)" opacity="0.6" cx="50" cy="50" rx="50" ry="50" /><ellipse x="0" y="0" width="100" height="100" fill="#ff356a" cx="50" cy="50" rx="50" ry="50" /><text x="50" y="50" font-size="66.66666666666667" font-weight="bold" fill="currentColor" text-anchor="middle" dominant-baseline="central" filter="url(#drop-shadow)">VS</text></g></g><g><g transform="translate(25, 20)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">You own the setState</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Wrap setQuery in startTransition inside your own handler</span></foreignObject></g></g><g transform="translate(25, 141)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">isPending for free</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Built-in honest signal to dim the stale-but-visible content</span></foreignObject></g></g><g transform="translate(25, 262)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Split the state</span></foreignObject></g><rect x="120" y="30" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 41)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Urgent value echoes the input, transition value drives the heavy tree</span></foreignObject></g></g><g transform="translate(25, 383)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Keep the manipulated value urgent</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Never put the directly-typed echo inside the transition</span></foreignObject></g></g><g transform="translate(365, 20)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">You receive the value</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Prop from a parent, router, or library hook — no setter to wrap</span></foreignObject></g></g><g transform="translate(365, 141)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Compare for staleness</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">deferred !== current marks the stale render to dim</span></foreignObject></g></g><g transform="translate(365, 262)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Memoize the subtree</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 41)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">On the deferred value, or you pay the full cost twice per keystroke</span></foreignObject></g></g><g transform="translate(365, 383)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Cheap urgent render first</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Holds the old value, then catches up in a background transition</span></foreignObject></g></g></g></g></g></svg>

<svg height="771" width="350" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 350 771"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="310" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">React 19 root error severity</span></foreignObject></g></g><g transform="translate(5, 35)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onUncaughtError — white-screen class</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="120" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">No boundary caught it; the tree unmounted and the user saw it break. Page someone now.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#f43f5e" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 212)"><g><g transform="translate(135, 0)"><polygon width="30" height="212" fill="#f59e0b" points="0,0 15,10 30,0 30,202 15,212 0,202" /><g><text width="30" height="212" x="15" y="106" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onCaughtError — handled class</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A boundary rendered its fallback; the user kept a working page. Watch the rate, never page single events.</span></foreignObject></g></g></g></g><g transform="translate(0, 424)"><g><g transform="translate(0, 16)"><g><foreignObject height="80" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onRecoverableError — self-healed class</span></foreignObject></g><g transform="translate(0, 80)"><foreignObject height="160" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">React recovered on its own; hydration mismatches land here and the user saw nothing. Budget a metric, never alert.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="272" fill="#14b8a6" points="0,0 15,10 30,0 30,262 15,272 0,262" /><g><text width="30" height="272" x="15" y="136" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

<svg height="1197" width="990" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 990 1197"><defs /><g id="infographic-container"><g><g transform="translate(214.5, 0)"><foreignObject height="35" width="521" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Validation timing: what each policy punishes</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="950" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Validation can run continuously — the policy only decides when the verdict is shown, and each pure choice injures someone</span></foreignObject></g></g><g transform="translate(325, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onChange from the first keystroke</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="239" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Yells while the user is mid-thought: every field reads invalid until it is finished, and premature red lands as rejection — the session-replay cause of form abandonment.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="311" fill="#f43f5e" points="0,0 15,10 30,0 30,301 15,311 0,301" /><g><text width="30" height="311" x="15" y="155.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 311)"><g><g transform="translate(135, 0)"><polygon width="30" height="232" fill="#f59e0b" points="0,0 15,10 30,0 30,222 15,232 0,222" /><g><text width="30" height="232" x="15" y="116" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onSubmit only</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="180" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Punishes trust: ten fields of effort, then a wall of errors at once, often with the first broken field scrolled off-screen above the fold.</span></foreignObject></g></g></g></g><g transform="translate(0, 543)"><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">onBlur</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="180" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The fair verdict — leaving a field signals the user is done with it, so judging then is fair. The compromise field UX research keeps landing on.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="232" fill="#6366f1" points="0,0 15,10 30,0 30,222 15,232 0,222" /><g><text width="30" height="232" x="15" y="116" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 775)"><g><g transform="translate(135, 0)"><polygon width="30" height="291" fill="#14b8a6" points="0,0 15,10 30,0 30,281 15,291 0,281" /><g><text width="30" height="291" x="15" y="145.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Hybrid: reward early, punish late</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Validate at first blur; once a field is touched and in error, re-check on change so fixes clear instantly; re-run the full schema on submit and move focus to the first failure.</span></foreignObject></g></g></g></g></g></g></g></svg>

<svg height="415.5" width="779" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 779 415.5"><defs /><g><g><g transform="translate(77, 0)"><foreignObject height="35" width="585" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Waterfall latency: each tree level adds a round trip</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="739" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Children fetch on mount, so independent requests serialize down the tree — until you hoist them</span></foreignObject></g></g><g transform="translate(75.5, 91)"><g><g transform="translate(72, 115.5)"><g transform="translate(28, 0)"><foreignObject height="69" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">ProfilePage mounts and requests the user — the first 200 ms round trip.</span></foreignObject></g><polygon fill="#f43f5e" opacity="0.9" width="16" height="16" points="0,97 16,81 16,97" /><path d="M 28 153 L 28 85 L 140 85" stroke="#f43f5e" stroke-width="8" fill="none" /><g transform="translate(32, 129)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Fetch user · 0–200 ms</span></foreignObject></g></g><g transform="translate(196, 77)"><g transform="translate(28, 0)"><foreignObject height="86" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Posts mounts only after the user commits, so its request starts one round trip late.</span></foreignObject></g><polygon fill="#f59e0b" opacity="0.9" width="16" height="16" points="0,114 16,98 16,114" /><path d="M 28 170 L 28 102 L 140 102" stroke="#f59e0b" stroke-width="8" fill="none" /><g transform="translate(32, 146)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Fetch posts · 200–400 ms</span></foreignObject></g></g><g transform="translate(320, 38.5)"><g transform="translate(28, 0)"><foreignObject height="103" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Comments mounts only after posts commit — three serial hops, 600 ms before any server time.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,131 16,115 16,131" /><path d="M 28 187 L 28 119 L 140 119" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 163)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Fetch comments · 400–600 ms</span></foreignObject></g></g><g transform="translate(444, 0)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Issue the independent requests together from the top component — one round trip, ~3× faster.</span></foreignObject></g><polygon fill="#10b981" opacity="0.9" width="16" height="16" points="0,148 16,132 16,148" /><path d="M 28 204 L 28 136 L 140 136" stroke="#10b981" stroke-width="8" fill="none" /><g transform="translate(32, 180)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Hoist + Promise.all · ~200 ms</span></foreignObject></g></g></g></g></g></svg>

<svg height="505" width="752" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 752 505"><defs /><g><g transform="translate(92, 0)"><g><foreignObject height="35" width="528" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">B3 → W3C migration — do it in this exact order</span></foreignObject></g><g transform="translate(17, 43)"><foreignObject height="48" width="494" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Read-both before write-W3C; skip a step and traces split silently</span></foreignObject></g></g><g transform="translate(0, 91)"><g><g transform="translate(72, 188)"><g transform="translate(28, 0)"><foreignObject height="86" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Find every service still emitting B3-only headers before changing anything.</span></foreignObject></g><polygon fill="#6366f1" opacity="0.9" width="16" height="16" points="0,114 16,98 16,114" /><path d="M 28 170 L 28 102 L 140 102" stroke="#6366f1" stroke-width="8" fill="none" /><g transform="translate(32, 146)"><foreignObject height="40" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Audit B3-only services</span></foreignObject></g></g><g transform="translate(196, 141)"><g transform="translate(28, 0)"><foreignObject height="103" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Register W3C + B3 multi + B3 single everywhere: read inbound from both, write outbound W3C only.</span></foreignObject></g><polygon fill="#14b8a6" opacity="0.9" width="16" height="16" points="0,131 16,115 16,131" /><path d="M 28 187 L 28 119 L 140 119" stroke="#14b8a6" stroke-width="8" fill="none" /><g transform="translate(32, 163)"><foreignObject height="60" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Deploy composite propagator</span></foreignObject></g></g><g transform="translate(320, 94)"><g transform="translate(28, 0)"><foreignObject height="120" width="112" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:12px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-end;align-items:flex-end" xmlns="http://www.w3.org/1999/xhtml">Confirm propagation does not regress; a skipped 
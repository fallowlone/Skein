ext-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Standing ~1.5-6 GB/month buys retroactive flame graphs for any moment</span></foreignObject></g></g></g></g></g></svg>

<svg height="425" width="720" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 720 425"><defs /><defs><linearGradient id="gradient-arrow-fill-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" stop-opacity="0.36" /><stop offset="100%" stop-color="#FF356A" stop-opacity="0" /></linearGradient><linearGradient id="gradient-arrow-stroke-FF356A" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#FF356A" /><stop offset="58%" stop-color="#FF356A" stop-opacity="0" /></linearGradient></defs><g id="infographic-container"><g transform="translate(95, 0)"><g><foreignObject height="35" width="490" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Six SLO alerting approaches — why five fail</span></foreignObject></g><g transform="translate(51.5, 43)"><foreignObject height="48" width="387" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each fixes the prior flaw; only Approach 6 survives</span></foreignObject></g></g><g transform="translate(0, 91)"><g><polygon x="207.5" y="41" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(207.5, 41)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="447.5" y="41" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(447.5, 41)rotate(0 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="567.5" y="134.5" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(567.5, 134.5)rotate(90 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="447.5" y="228" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(447.5, 228)rotate(180 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /><polygon x="207.5" y="228" width="25" height="25" fill="url(#gradient-arrow-fill-FF356A)" stroke="url(#gradient-arrow-stroke-FF356A)" transform="translate(207.5, 228)rotate(180 12.5 12.5)" points="0,7 13,7 13,1.875 25,14.374999999999998 13,26.875 13,22 0,22" /></g><g><g><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">1 · Error rate &gt; threshold</span></foreignObject></g><rect x="60" y="56" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Too noisy — pages on any spike (alert fatigue)</span></foreignObject></g></g><g transform="translate(240, 0)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">2 · Add "for 5m" delay</span></foreignObject></g><rect x="60" y="30" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 41)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Kills brief spikes, but threshold still wrong</span></foreignObject></g></g><g transform="translate(480, 0)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#6366f1;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">3 · Single burn rate, 1h window</span></foreignObject></g><rect x="60" y="56" width="80" height="3" fill="#6366f1" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Catches outages, but long reset after fix</span></foreignObject></g></g><g transform="translate(480, 187)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">4 · Dual burn rate, OR logic</span></foreignObject></g><rect x="60" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">OR fires on either — worst of both windows</span></foreignObject></g></g><g transform="translate(240, 187)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">5 · Dual severity, single windows</span></foreignObject></g><rect x="60" y="56" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Closer, but the page still has long reset</span></foreignObject></g></g><g transform="translate(0, 187)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">6 · MWMBR — long AND short</span></foreignObject></g><rect x="60" y="56" width="80" height="3" fill="#f59e0b" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Survives: rejects noise + clears in ~5 min</span></foreignObject></g></g></g></g></g></svg>

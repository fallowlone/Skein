<svg height="904" width="647" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 647 904"><defs /><g id="infographic-container"><g><g transform="translate(91.5, 0)"><foreignObject height="35" width="424" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Three partitioning schemes, one dial</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="607" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each strategy buys one property at the cost of another — there is no free choice</span></foreignObject></g></g><g transform="translate(153.5, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Range</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Buys efficient range scans (all March orders hit one shard) — at the cost of a write hot-spot when keys are ordered (timestamp, auto-increment id cluster on the last shard)</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="271" fill="#6366f1" points="0,0 15,10 30,0 30,261 15,271 0,261" /><g><text width="30" height="271" x="15" y="135.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 271)"><g><g transform="translate(135, 0)"><polygon width="30" height="251" fill="#14b8a6" points="0,0 15,10 30,0 30,241 15,251 0,241" /><g><text width="30" height="251" x="15" y="125.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Hash</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="199" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Buys even write load (neighbours scattered across shards) — at the cost of range scans, which now fan out to every shard since adjacent keys sit far apart</span></foreignObject></g></g></g></g><g transform="translate(0, 522)"><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Directory</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="199" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Buys flexibility (move a hot key to its own shard with a one-row change) — at the cost of an extra hop and a lookup table that is itself critical infrastructure</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="251" fill="#f59e0b" points="0,0 15,10 30,0 30,241 15,251 0,241" /><g><text width="30" height="251" x="15" y="125.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g></g></g></g></svg>

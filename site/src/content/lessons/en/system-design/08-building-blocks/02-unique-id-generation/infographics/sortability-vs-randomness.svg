<svg height="719" width="817" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 817 719"><defs /><defs><filter id="vs-divider-glow-filter" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" /></filter><filter id="drop-shadow" x="-25%" y="-25%" width="200%" height="200%"><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="black" flood-opacity="0.8" /></filter></defs><g id="infographic-container"><g><g transform="translate(146.5, 0)"><foreignObject height="35" width="484" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The one axis: time-ordered vs random IDs</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="777" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Both mint globally-unique IDs with no coordination — they split on sortability, and pay opposite costs</span></foreignObject></g></g><g transform="translate(106, 91)"><g><g transform="translate(245, 254)"><ellipse x="0" y="0" width="100" height="100" fill="#ff9bb5" filter="url(#vs-divider-glow-filter)" opacity="0.6" cx="50" cy="50" rx="50" ry="50" /><ellipse x="0" y="0" width="100" height="100" fill="#ff356a" cx="50" cy="50" rx="50" ry="50" /><text x="50" y="50" font-size="66.66666666666667" font-weight="bold" fill="currentColor" text-anchor="middle" dominant-baseline="central" filter="url(#drop-shadow)">VS</text></g></g><g><g transform="translate(25, 20)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Timestamp in the high bits</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Snowflake 41-bit ms epoch; UUIDv7 48-bit Unix-ms — IDs sort by creation</span></foreignObject></g></g><g transform="translate(25, 167)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Right-edge index inserts</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Mostly sequential keys keep B-tree locality, like auto-increment had</span></foreignObject></g></g><g transform="translate(25, 314)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Range-scannable by time</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">You can scan a time window straight off the primary key</span></foreignObject></g></g><g transform="translate(25, 461)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Leaks time + trusts the clock</span></foreignObject></g><rect x="120" y="56" width="80" height="3" fill="#14b8a6" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Two IDs reveal when each was made; a backward clock step risks duplicates</span></foreignObject></g></g><g transform="translate(365, 20)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">122 random bits, no timestamp</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 67)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Pure entropy in a 128-bit value — collisions negligible, zero shared state</span></foreignObject></g></g><g transform="translate(365, 167)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Fragments the B-tree</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 41)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Each insert lands at a random leaf: page splits, lost cache locality</span></foreignObject></g></g><g transform="translate(365, 314)"><g><foreignObject height="26" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Can't range-scan</span></foreignObject></g><rect x="0" y="30" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 41)"><foreignObject height="60" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">No ordering to exploit; and a clustered table physically fragments</span></foreignObject></g></g><g transform="translate(365, 461)"><g><foreignObject height="52" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f43f5e;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Leaks nothing, unguessable</span></foreignObject></g><rect x="0" y="56" width="80" height="3" fill="#f43f5e" /><g transform="translate(0, 67)"><foreignObject height="40" width="200" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Best for public IDs — reset tokens, public object slugs</span></foreignObject></g></g></g></g></g></svg>

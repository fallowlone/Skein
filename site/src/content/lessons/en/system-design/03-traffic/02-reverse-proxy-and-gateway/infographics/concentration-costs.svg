<svg height="1117" width="796" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 796 1117"><defs /><g id="infographic-container"><g><g transform="translate(57.5, 0)"><foreignObject height="35" width="641" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Everything the gateway centralizes, it also concentrates</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="756" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">One consistency win bought with four concentrated costs — all on the critical path of every request</span></foreignObject></g></g><g transform="translate(228, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Single point of failure</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="160" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Gateway down or misconfigured = all services behind it unreachable, regardless of their own health (the 2 a.m. typo)</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="232" fill="#6366f1" points="0,0 15,10 30,0 30,222 15,232 0,222" /><g><text width="30" height="232" x="15" y="116" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 232)"><g><g transform="translate(135, 0)"><polygon width="30" height="291" fill="#14b8a6" points="0,0 15,10 30,0 30,281 15,291 0,281" /><g><text width="30" height="291" x="15" y="145.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Throughput bottleneck</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">All traffic plus per-request work — token parsing, rate-limit lookups, TLS, aggregation — lands on one tier that must scale ahead of every backend combined</span></foreignObject></g></g></g></g><g transform="translate(0, 523)"><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Latency tax</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="140" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Adds a hop and per-request CPU to every call — usually small, but real, and on the critical path of everything</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="192" fill="#f59e0b" points="0,0 15,10 30,0 30,182 15,192 0,182" /><g><text width="30" height="192" x="15" y="96" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 715)"><g><g transform="translate(135, 0)"><polygon width="30" height="271" fill="#f43f5e" points="0,0 15,10 30,0 30,261 15,271 0,261" /><g><text width="30" height="271" x="15" y="135.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Deployment chokepoint</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="199" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">If every team's routing config lives in the gateway, the gateway team becomes the bottleneck for shipping — the org version of the SPOF</span></foreignObject></g></g></g></g></g></g></g></svg>

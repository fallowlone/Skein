<svg height="1575" width="932" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 932 1575"><defs /><g id="infographic-container"><g><g><foreignObject height="35" width="892" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The four tradeoff axes — every choice buys one property by spending another</span></foreignObject></g><g transform="translate(85.5, 43)"><foreignObject height="48" width="721" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Naming the price, not the choice, is the senior signal. State what you bought and what it cost.</span></foreignObject></g></g><g transform="translate(296, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Consistency vs availability — the CAP/PACELC trade</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="319" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Strong consistency means coordination — it costs availability under partition and latency always. Eventual consistency buys availability and low latency at the price of stale reads. A like count can be stale; a bank balance cannot.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="411" fill="#6366f1" points="0,0 15,10 30,0 30,401 15,411 0,401" /><g><text width="30" height="411" x="15" y="205.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 411)"><g><g transform="translate(135, 0)"><polygon width="30" height="351" fill="#14b8a6" points="0,0 15,10 30,0 30,341 15,351 0,341" /><g><text width="30" height="351" x="15" y="175.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Latency vs cost</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="299" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Lower latency buys you more replicas, more cache, more regions — all money. You can hit almost any target by spending enough; the design question is the cheapest way to hit the target you actually need.</span></foreignObject></g></g></g></g><g transform="translate(0, 762)"><g><g transform="translate(0, 16)"><g><foreignObject height="20" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Simplicity vs scale</span></foreignObject></g><g transform="translate(0, 20)"><foreignObject height="259" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">The simplest design that meets the requirements wins. A single Postgres instance that fits the load beats a sharded multi-region system you did not need. Add complexity only where an estimate forces it.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="311" fill="#f59e0b" points="0,0 15,10 30,0 30,301 15,311 0,301" /><g><text width="30" height="311" x="15" y="155.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 1073)"><g><g transform="translate(135, 0)"><polygon width="30" height="371" fill="#f43f5e" points="0,0 15,10 30,0 30,361 15,371 0,361" /><g><text width="30" height="371" x="15" y="185.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Read vs write optimization</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="299" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Precompute on write to make reads cheap (fan-out-on-write), or compute on read to make writes cheap (fan-out-on-read) — but not both. The access pattern's read/write ratio decides which.</span></foreignObject></g></g></g></g></g></g></g></svg>

, 307)"><text width="10" height="23" x="0" y="0" fill="#14b8a6" font-size="16" text-anchor="middle" dominant-baseline="baseline" font-weight="bold">1</text></g></g><g><g transform="translate(-10, 330)"><g><foreignObject height="77" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#f59e0b;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Timeline (read &gt;&gt; write)</span></foreignObject></g></g><g transform="translate(100, 330)"><g><foreignObject height="77" width="110" y="0" x="0" overflow="visible"><span style="overflow:visible;color:#14b8a6;font-weight:bold;font-size:18px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Message (write ~ read)</span></foreignObject></g></g></g></g></g></svg>

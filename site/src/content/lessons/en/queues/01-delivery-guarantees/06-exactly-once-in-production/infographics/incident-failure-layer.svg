<svg height="1295" width="476" style="" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 476 1295"><defs /><g id="infographic-container"><g><g transform="translate(19, 0)"><foreignObject height="35" width="398" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:24px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Where exactly-once actually broke</span></foreignObject></g><g transform="translate(0, 43)"><foreignObject height="48" width="436" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:16px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:center;justify-content:center;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Four real incidents — none failed in the broker guarantee</span></foreignObject></g></g><g transform="translate(68, 91)"><g><g><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Stripe 2020 — consumer code</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Queue consumer dropped the Idempotency-Key on retry; customers charged twice. The broker delivered correctly; the consumer was not idempotent.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="291" fill="#f43f5e" points="0,0 15,10 30,0 30,281 15,291 0,281" /><g><text width="30" height="291" x="15" y="145.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">01</text></g></g></g></g><g transform="translate(0, 291)"><g><g transform="translate(135, 0)"><polygon width="30" height="291" fill="#f59e0b" points="0,0 15,10 30,0 30,281 15,291 0,281" /><g><text width="30" height="291" x="15" y="145.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">02</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">AWS SQS 2019 — consumer-side race</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="199" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">ChangeMessageVisibility raced an in-flight DeleteMessage, forcing redelivery. The visibility-timeout contract, not the broker, leaked the duplicate.</span></foreignObject></g></g></g></g><g transform="translate(0, 582)"><g><g transform="translate(0, 16)"><g><foreignObject height="40" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Slack 2022 — zombie producer</span></foreignObject></g><g transform="translate(0, 40)"><foreignObject height="219" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:right;justify-content:flex-end;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">A rolling restart left producer sessions unfenced; Kafka EOS shipped duplicates for 6 minutes. Coordination state, not the delivery promise, failed.</span></foreignObject></g></g><g transform="translate(135, 0)"><polygon width="30" height="291" fill="#8b5cf6" points="0,0 15,10 30,0 30,281 15,291 0,281" /><g><text width="30" height="291" x="15" y="145.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">03</text></g></g></g></g><g transform="translate(0, 873)"><g><g transform="translate(135, 0)"><polygon width="30" height="291" fill="#6366f1" points="0,0 15,10 30,0 30,281 15,291 0,281" /><g><text width="30" height="291" x="15" y="145.5" fill="currentColor" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">04</text></g></g><g transform="translate(180, 16)"><g><foreignObject height="60" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-weight:bold;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:center;align-items:center" xmlns="http://www.w3.org/1999/xhtml">Stripe 2023 — operational procedure</span></foreignObject></g><g transform="translate(0, 60)"><foreignObject height="199" width="120" y="0" x="0" overflow="visible"><span style="overflow:visible;color:currentColor;font-size:14px;line-height:1.4;width:100%;height:100%;display:flex;flex-wrap:wrap;word-break:break-word;white-space:pre-wrap;text-align:left;justify-content:flex-start;align-content:flex-start;align-items:flex-start" xmlns="http://www.w3.org/1999/xhtml">Unthrottled redrive of a 1M-message DLQ flooded the consumer pool and throttled the payment API. The runbook, not the broker, caused the outage.</span></foreignObject></g></g></g></g></g></g></g></svg>

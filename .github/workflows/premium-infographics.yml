name: Premium infographic engine

on:
  pull_request:
    paths:
      - 'scripts/premium-infographics/**'
      - 'docs/infographics/engine-v2.md'
      - 'site/src/content/units.json'
      - 'site/package.json'
      - 'site/bun.lock'
      - '.github/workflows/premium-infographics.yml'
  push:
    branches: [main, feat/deployment-premium-infographics]
    paths:
      - 'scripts/premium-infographics/**'
      - 'docs/infographics/engine-v2.md'
      - 'site/src/content/units.json'
      - 'site/package.json'
      - 'site/bun.lock'
      - '.github/workflows/premium-infographics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-infographics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bilingual semantic corpus
        run: python3 scripts/premium-infographics/v2/generate.py --check
      - name: Test v1 compatibility
        run: python3 -m unittest discover -s scripts/premium-infographics -p test_generate_deployment.py -v
      - name: Test v2 constraints and publication failures
        run: python3 -m unittest discover -s scripts/premium-infographics/v2/tests -v

  browser:
    needs: structural
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install locked site dependencies
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Install matching Chromium
        run: bunx --no-install playwright install --with-deps chromium
        working-directory: site
      - name: Verify browser contract and PNG dimensions
        run: python3 scripts/premium-infographics/v2/tests/check_renderer.py
      - name: Measure and export private corpus
        run: python3 scripts/premium-infographics/v2/generate.py --export-png
      - name: Verify deterministic generation
        run: |
          cp .premium-infographics/deployment-v2/active.json "$RUNNER_TEMP/premium-active.json"
          python3 scripts/premium-infographics/v2/generate.py --export-png
          cmp "$RUNNER_TEMP/premium-active.json" .premium-infographics/deployment-v2/active.json
      # Premium SVG/PNG files are never uploaded as Actions artifacts.

name: Deploy Skein

on:
  push:
    branches: [main]
  schedule:
    # Nightly rebuild also re-validates the Git → Supabase curriculum mirror.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Pages deploy branch — 'main' = production, anything else = preview URL"
        required: false
        default: "main"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install site deps
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Unit tests
        run: bun run test
        working-directory: site
      - name: Typecheck Astro/TypeScript
        run: bun run check
        working-directory: site
      - name: API (Pages Functions) tests
        run: bun run test
        working-directory: functions
      - name: Execute runnable code samples
        run: bun run verify:samples
        working-directory: site
      - name: Verify debug-task starters present a real bug
        run: bun run verify:scenario
        working-directory: site
      - name: Verify project workbenches (scaffold fails, solution passes)
        run: bun run verify:projects
        working-directory: site

  e2e-smoke:
    # Fast @smoke subset (home, locale switch, a11y skip link) blocks deploy.
    # The full suite — including the 10-minute sheet walkthrough — runs nightly
    # (e2e-full) so per-push stays fast. Dev path is unchanged: `bun run e2e`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install site deps
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Install matching Chromium
        run: bunx --no-install playwright install --with-deps chromium
        working-directory: site
      - name: Smoke e2e (blocks deploy)
        run: bun run e2e:smoke
        working-directory: site

  e2e-full:
    # Nightly full suite: every spec, non-blocking (reports only).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install site deps
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Install matching Chromium
        run: bunx --no-install playwright install --with-deps chromium
        working-directory: site
      - name: Full e2e suite (nightly, non-blocking)
        run: bun run e2e
        working-directory: site

  deploy:
    needs: [gates, e2e-smoke]
    # e2e-smoke is skipped on the nightly schedule; without this guard the skip
    # would cascade and the nightly Supabase mirror re-validation would never run.
    if: ${{ !cancelled() && needs.gates.result == 'success' && (needs.e2e-smoke.result == 'success' || needs.e2e-smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install root deps (provides wrangler)
        run: bun install --frozen-lockfile
      - name: Install site deps
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Build and validate curriculum artifacts
        run: bun run build:content
        working-directory: site

      # Runtime lesson routes read this mirror. Publish and verify it before the
      # Worker can receive new production traffic. Git remains the source of truth.
      - name: Publish curriculum to Supabase
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bun run sync:supabase -- --prune --site-sha "$GITHUB_SHA"
        working-directory: site
      - name: Verify curriculum parity
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bun run verify:supabase-parity
        working-directory: site

      - name: Build Pages app
        run: bun run build:app
        working-directory: site
      - name: Build lesson Worker
        run: bun run build:lessons-worker
        working-directory: site
      - name: Publish lesson Worker assets with Pages
        run: cp -R dist-lessons/client/_astro/. dist/_astro/
        working-directory: site

      - name: Resolve deploy branch
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_BRANCH" ]; then
            name="$INPUT_BRANCH"
          else
            name="main"
          fi
          if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Invalid branch name: $name" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}
        run: bunx wrangler pages deploy site/dist --project-name=skein --branch="$DEPLOY_BRANCH"
      - name: Deploy lesson Worker
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun -e 'const path = "dist-lessons/server/wrangler.json"; const config = await Bun.file(path).json(); delete config.routes; delete config.route; await Bun.write(path, JSON.stringify(config));'
          bunx wrangler deploy --config dist-lessons/server/wrangler.json
        working-directory: site

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # Nightly forced full rebuild — re-baselines the cache against drift.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Pages deploy branch — 'main' = production, anything else = preview URL"
        required: false
        default: "main"
      force_full:
        description: "Force a full (non-incremental) rebuild"
        required: false
        default: "false"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install site deps
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Unit tests
        run: bun run test
        working-directory: site
      - name: API (Pages Functions) tests
        run: bun run test
        working-directory: functions
      - name: Execute runnable code samples
        run: bun run verify:samples
        working-directory: site
      - name: Verify debug-task starters present a real bug
        run: bun run verify:scenario
        working-directory: site

  # Single job: plan (full vs incremental) → build → lint → deploy, all in one
  # runner. No cross-job artifacts — the only state handed between runs is the
  # rolling dist+manifest cache (actions/cache, a separate quota from the
  # artifact storage that the old sharded pipeline exhausted on the free tier).
  build-deploy:
    needs: gates
    runs-on: ubuntu-latest
    # 180, not 90: a full (non-incremental) build now renders 5777 pages
    # single-threaded (~65 min local, slower on the runner) and Cloudflare Pages
    # upload intermittently degrades to ~minutes per hundred files. Two full-build
    # deploys (grammar system, pagespeed fixes) died at the 90-min wall. Incremental
    # builds finish in minutes; this cap only bites shared-file / large-content pushes.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install root deps (provides wrangler)
        run: bun install --frozen-lockfile
      - name: Install site deps
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Restore dist + manifest cache
        uses: actions/cache/restore@v5
        with:
          path: |
            site/dist
            site/build-cache/manifest.json
          key: site-dist-${{ github.run_id }}
          restore-keys: site-dist-

      - name: Plan build
        id: plan
        working-directory: site
        env:
          FORCE_FULL_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_full == 'true') && '1' || '0' }}
        run: bun scripts/incremental-plan.mjs

      # ── FULL: render the whole site serially (single process, ~65 min) ──
      # Parallel multi-process render was attempted (parallel-build.mjs, 2-3 shards)
      # but every shard OOM'd: each astro process loads the FULL content store +
      # content-modules.mjs + Vite module graph (~6 GB baseline) before rendering only
      # its slice, so 2 shards need ~16 GB combined with no headroom on the 16 GB
      # runner. The fat per-process baseline caps parallelism below 2. Serial fits the
      # 180-min job cap (proven green: run 27613031145). Faster parallel render would
      # require sharding the content LOAD, not just the routes — a separate redesign.
      - name: Full build
        if: steps.plan.outputs.mode == 'full'
        working-directory: site
        run: NODE_OPTIONS=--max-old-space-size=10240 bunx astro build
      - name: Verify dist completeness
        if: steps.plan.outputs.mode == 'full'
        run: bun scripts/check-dist-complete.mjs
        working-directory: site
      - name: Promote manifest (full)
        if: steps.plan.outputs.mode == 'full'
        run: mv site/build-cache/next-manifest.json site/build-cache/manifest.json

      # ── INCREMENTAL: render only changed pages, overlay onto cached dist ──
      - name: Snapshot cached dist
        if: steps.plan.outputs.mode == 'incremental'
        run: |
          if [ ! -d site/dist ]; then
            echo "Restored cache had no dist/ — cannot run incremental." >&2
            exit 1
          fi
          rm -rf site/build-cache/prev-dist
          cp -a site/dist site/build-cache/prev-dist
      - name: Render changed pages
        if: steps.plan.outputs.mode == 'incremental'
        working-directory: site
        env:
          SHARD_TOTAL: "1"
        run: |
          INCREMENTAL_PLAN="$(cat build-cache/plan.json)" \
            NODE_OPTIONS=--max-old-space-size=10240 bunx astro build
      - name: Overlay + guard + promote manifest
        if: steps.plan.outputs.mode == 'incremental'
        run: bun scripts/incremental-merge.mjs
        working-directory: site

      # ── common: lint, persist cache, deploy ──
      - name: Lint dist
        run: bun scripts/lint-dist.mjs
        working-directory: site
      - name: Save dist + manifest cache
        uses: actions/cache/save@v5
        with:
          path: |
            site/dist
            site/build-cache/manifest.json
          key: site-dist-${{ github.run_id }}
      - name: Resolve deploy branch
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_BRANCH" ]; then
            name="$INPUT_BRANCH"
          else
            name="main"
          fi
          if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Invalid branch name: $name" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}
        run: bunx wrangler pages deploy site/dist --project-name=awesome-everything --branch="$DEPLOY_BRANCH"
